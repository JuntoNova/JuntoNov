<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found - Junto Nova</title>
    <link rel="icon" type="image/png" sizes="32x32" href="https://juntonova.com/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://juntonova.com/favicon-180.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap');
        :root {
            --charcoal: #1A1A1A;
            --muted: #64748B;
            --border: #E2E8F0;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--charcoal);
            background: #fff;
        }
        .display {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
    </style>
    <style>:focus-visible{outline:2px solid #1A1A1A;outline-offset:2px}</style>
</head>
<body>

    <header class="border-b" style="border-color: var(--border); background: #fff;">
        <div class="max-w-3xl mx-auto px-6 py-5 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 hover:opacity-80 transition" style="color: var(--charcoal);">
                <img src="https://juntonova.com/jn-header.png" alt="Junto Nova" width="40" height="46" style="display:block" />
                <span class="display text-2xl tracking-tight">JUNTO NOVA</span>
            </a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-6 py-16">
        <h1 class="display text-4xl mb-6" style="color: var(--charcoal);">Page not found</h1>
        <a href="/" class="text-sm hover:opacity-70 underline" style="color: var(--muted);">Back to home</a>
    </main>

</body>
</html>
