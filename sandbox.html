<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbox · Junto Nova</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">
    <meta name="description" content="A blank Junto Nova page used to show how fast a site can change.">
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap');
        :root {
            --charcoal: #1A1A1A;
            --ember: #C45C26;
            --muted: #64748B;
            --border: #E2E8F0;
            --surface: #F8FAFC;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--charcoal);
            background: #fff;
        }
        .display {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
    </style>
</head>
<body>

    <header class="border-b" style="border-color: var(--border); background: #fff;">
        <div class="max-w-5xl mx-auto px-6 py-5 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 hover:opacity-80 transition" style="color: var(--charcoal);">
                <img src="/jn-header.png" alt="Junto Nova" width="40" height="46" style="display:block" />
                <span class="display text-2xl tracking-tight">JUNTO NOVA</span>
            </a>
            <a href="/" class="text-sm hover:opacity-70" style="color: var(--muted);">← Back</a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-6 py-24 min-h-[60vh]">
        <p class="text-xs uppercase tracking-[0.18em] mb-4" style="color: var(--ember);">Sandbox</p>
        <h1 class="display text-4xl mb-4" style="color: var(--charcoal);">This page is blank on purpose.</h1>
        <p class="text-lg leading-relaxed" style="color: var(--muted);">Say what should be here. We will change it live.</p>
    </main>

    <footer class="border-t" style="border-color: var(--border);">
        <div class="max-w-5xl mx-auto px-6 py-8 flex flex-col md:flex-row justify-between items-center gap-4 text-sm" style="color: var(--muted);">
            <div>
                <div class="display text-lg" style="color: var(--charcoal);">JUNTO NOVA</div>
                <div class="text-xs mt-1">Junto Nova LLC · Dallas, TX</div>
            </div>
            <div class="flex items-center gap-5">
                <a href="mailto:andrew@juntonova.com" class="hover:opacity-70" aria-label="Email"><i class="fa-solid fa-envelope text-base"></i></a>
                <a href="https://x.com/jandrewclark" target="_blank" rel="noopener" class="hover:opacity-70" aria-label="X"><i class="fa-brands fa-x-twitter text-base"></i></a>
                <a href="https://juntonova.substack.com" target="_blank" rel="noopener" class="hover:opacity-70" aria-label="Substack"><i class="fa-solid fa-bookmark text-base"></i></a>
                <a href="/privacy.html" class="hover:opacity-70">Privacy</a>
                <span>© 2026</span>
            </div>
        </div>
    </footer>

</body>
</html>
