<script>
const DATA = {"areas":[{"id":"ai","name":"Artificial Intelligence","practical":[{"id":"water","name":"Make data centers pay their fair share of water costs","x":74,"y":66,"stance":"Back","why":"","proof":["AP-NORC/EPIC, July 6 to 24, 2026: 57% of adults are extremely or very concerned about data centers affecting water supply in their communities, and 78% are at least somewhat concerned.","Value of Water Index, February 21 to 26, 2026 (sponsored by the Value of Water Campaign, a water advocacy campaign): 54% of voters nationwide are extremely or very concerned about data center effects on water quality, supply and cost in their area.","Global Strategy Group for the Illinois Clean Jobs Coalition (an advocacy coalition), March 16 to 19, 2026, as reported by Capitol Fax (Illinois state poll): 96% of 800 likely Illinois voters agree the state should ensure data centers pay their fair share of water infrastructure costs, and 85% strongly agree.","Joseph Rainey Center, September 10 to 14, 2026: 48% of registered voters believe a data center uses far more water than almost any other facility, and 26% are unsure. The Rainey summary calls this belief overstated."],"sources":[{"t":"Joseph Rainey Center for Public Policy, September policy survey, fielded September 10–14, 2026 (1,004 registered voters, online panel, margin of error 4.9 points)","u":"https://www.raineycenter.org/polling/september-policy-survey-summary-of-findings"},{"t":"AP-NORC/EPIC poll topline, July 6–24, 2026 (3,424 adults, margin of error 2.2 points; funded by the Energy Policy Institute at the University of Chicago)","u":"https://apnorc.org/wp-content/uploads/2026/09/2026-AP-NORC-EPIC-Topline-Release-1.pdf"},{"t":"University of Chicago Energy Policy Institute, 2026 poll of Americans' views on the impact of AI and data centers","u":"https://climate.uchicago.edu/insights/2026-poll-americans-views-on-the-impact-of-ai-and-data-centers/"},{"t":"Value of Water Campaign, Value of Water Index poll, February 21–26, 2026 (1,011 voters nationwide; fielded by FM3 and New Bridge Strategy)","u":"https://thevalueofwater.org/s/VOW-Index-Poll.pdf"},{"t":"Capitol Fax, April 20, 2026, reporting the Illinois Clean Jobs Coalition poll","u":"https://capitolfax.com/2026/04/20/poll-illinoisans-overwhelmingly-want-to-impose-strict-rules-on-data-centers/"},{"t":"Illinois Times, reporting the same Illinois poll","u":"https://www.illinoistimes.com/news-opinion/politics/poll-finds-voter-support-for-data-center-regulation/"}],"need":null,"ev":"indirect"}],"structural":[{"id":"federal","name":"Set one national AI rulebook instead of fifty state rulebooks","x":39,"y":58,"stance":"Back","why":"Passing one national rule over state rules is hard.","proof":["TechNet and Morning Consult, June 3 to 4, 2025 (TechNet is a technology industry group and sponsored the poll): 71% of 2,065 registered voters prefer a single national AI development policy and 29% prefer 50 individual state policies.","YouGov daily question, November 26, 2025: Americans are split on the federal government blocking states from passing their own AI laws, with 34% of U.S. adults in support, 36% opposed and 30% not sure.","Joseph Rainey Center, September 10 to 14, 2026: 61% of registered voters want AI regulated mostly at the federal level and 20% prefer state-level variation.","Pew Research Center, March 24 to 30, 2025: 44% of adults trust the U.S. a lot or some to regulate AI effectively and 47% have little or no trust. Republicans trust more than Democrats, 54% to 36%."],"sources":[{"t":"Joseph Rainey Center for Public Policy, September policy survey, fielded September 10–14, 2026 (1,004 registered voters, online panel, margin of error 4.9 points)","u":"https://www.raineycenter.org/polling/september-policy-survey-summary-of-findings"},{"t":"Joseph Rainey Center for Public Policy, September policy survey memo (PDF), fielded September 10–14, 2026","u":"https://cdn.prod.website-files.com/663a60b91deeae06e8ae1d1c/6ab129528411a28d1a030f66_September_Website_Final.pdf"},{"t":"Pew Research Center, survey March 24–30, 2025 (n=3,605), reported November 6, 2025","u":"https://www.pewresearch.org/short-reads/2025/11/06/republicans-democrats-now-equally-concerned-about-ai-in-daily-life-but-views-on-regulation-differ/"},{"t":"TechNet and Morning Consult, National AI Attitudes toplines, June 3–4, 2025 (2,065 registered voters; TechNet is a technology industry group)","u":"https://www.technet.org/wp-content/uploads/2025/06/National-AI-Attitudes-Toplines-Document.pdf"},{"t":"TechNet, news release on the Morning Consult poll, June 2025","u":"https://www.technet.org/media/new-poll-76-of-voters-prefer-a-single-national-ai-development-policy/"},{"t":"YouGov, daily question, November 26, 2025 (14,928 U.S. adults)","u":"https://yougov.com/en-us/daily-results/20251126-fc36f-2"}],"need":"The status and vote count of any federal AI bill.","ev":"cited"},{"id":"water-ban","name":"Ban data centers from using town water","x":18,"y":84,"stance":"Oppose","why":"","proof":["Among voters with an unfavorable view of data centers, water is the second worry, at 18%.","48% believe a data center uses far more water than almost any other facility.","Han, Li, Wierman and Ren (UC Riverside, Rochester Institute of Technology, Caltech), arXiv 2603.02705, March 2026 (preprint, not peer reviewed): U.S. data centers need 697 to 1,451 million gallons a day of new peak public water capacity from 2024 to 2030, valued at about $10 billion in the baseline case and $7 billion to $58 billion across growth cases. The authors recommend that operators fund the capacity so household water rates do not rise.","Han and coauthors, March 2026: evaporative cooling cuts data center electricity use by 25% to 35% at summer peak (company disclosures cited in the paper), so cooling without water raises power demand.","City of Hillsboro, Oregon, April 13, 2026 (the city runs the water utility): data centers used 1.76% of 2025 water demand and are billed at industrial rates of $5.17 per ccf against $3.99 to $4.58 for residential customers. The city says residential rates will not rise because of data centers.","No poll cited asks about a ban. The Rainey summary calls the water belief overstated."],"sources":[{"t":"Joseph Rainey Center for Public Policy, September policy survey, fielded September 10–14, 2026 (1,004 registered voters, online panel, margin of error 4.9 points)","u":"https://www.raineycenter.org/polling/september-policy-survey-summary-of-findings"},{"t":"Han, Li, Wierman and Ren, Small Bottle, Big Pipe: Quantifying and Addressing the Impact of Data Centers on Public Water Systems, arXiv 2603.02705, March 2026 (preprint)","u":"https://arxiv.org/abs/2603.02705"},{"t":"City of Hillsboro, Oregon, data center water frequently asked questions, April 13, 2026","u":"https://www.hillsboro-oregon.gov/Home/Components/News/News/17350"}],"need":"Existing local bans. How many members would vote yes.","ev":"cited"},{"id":"liability","name":"Make AI companies legally liable for harms from their models","x":22,"y":70,"stance":"Oppose","why":"","proof":["48% name holding AI companies liable for harms a top-3 priority (reported by the Washington Examiner)."],"sources":[{"t":"Washington Examiner, September 22, 2026, reporting the Rainey Center poll","u":"https://www.washingtonexaminer.com/policy/technology/4738287/ai-data-centers-public-opinion-poll/"}],"need":"Pending liability bills and cases.","ev":"cited"},{"id":"noise","name":"Ban data centers over noise","x":12,"y":14,"stance":"Oppose","why":"The cited poll shows little public concern about noise.","proof":["Among voters with an unfavorable view of data centers, noise and appearance draw 2%."],"sources":[{"t":"Joseph Rainey Center for Public Policy, September policy survey, fielded September 10–14, 2026 (1,004 registered voters, online panel, margin of error 4.9 points)","u":"https://www.raineycenter.org/polling/september-policy-survey-summary-of-findings"}],"need":"Local noise ordinances. How often noise is the stated reason.","ev":"cited"},{"id":"own-power","name":"Make data centers pay for their own power and grid upgrades","x":72,"y":86,"stance":"Back","why":"The household power bill is the practical proof.","proof":["AP-NORC/EPIC, July 6 to 24, 2026: 73% of adults support requiring companies that build data centers to pay for the electric grid upgrades needed to support them, and 7% oppose. About 8 in 10 Democrats and 8 in 10 Republicans support this.","ARI and Morning Consult, July 17 to 19, 2026 (ARI is an advocacy group): 78% of 2,202 registered voters support requiring data center companies to pay the costs of electrical grid upgrades rather than passing those costs on to residents, and 13% oppose.","Economist/YouGov, August 21 to 24, 2026: 62% of U.S. adult citizens think a new data center in their community would raise what they pay for electricity, 13% think it would have no effect and 3% think their electricity costs would fall.","Joseph Rainey Center, September 10 to 14, 2026: 38% of registered voters name making data center companies pay their own electricity a top-three priority for lawmakers on AI.","Joseph Rainey Center, September 10 to 14, 2026: among registered voters with an unfavorable view of data centers, 28% name electricity costs for residents as their main concern.","Joseph Rainey Center, September 10 to 14, 2026: in head-to-head matchups of lawmaker approaches, the leading package won 64% of its matchups. It recruits investment while requiring developers to bring their own power, hold public meetings, sign community benefit agreements and accept curtailment before homes."],"sources":[{"t":"Joseph Rainey Center for Public Policy, September policy survey, fielded September 10–14, 2026 (1,004 registered voters, online panel, margin of error 4.9 points)","u":"https://www.raineycenter.org/polling/september-policy-survey-summary-of-findings"},{"t":"AP-NORC/EPIC poll topline, July 6–24, 2026 (3,424 adults, margin of error 2.2 points; funded by the Energy Policy Institute at the University of Chicago)","u":"https://apnorc.org/wp-content/uploads/2026/09/2026-AP-NORC-EPIC-Topline-Release-1.pdf"},{"t":"AP-NORC/EPIC factsheets, July 6–24, 2026","u":"https://apnorc.org/wp-content/uploads/2026/09/2026-AP-NORC-EPIC-Factsheets.pdf"},{"t":"ARI (advocacy group) and Morning Consult, data center poll, July 17–19, 2026 (2,202 registered voters, margin of error 2 points)","u":"https://ari.us/wp-content/uploads/2026/07/ARI_Poll_DataCenters_RegisteredVoters_7-21-26.pdf"},{"t":"Joseph Rainey Center for Public Policy, September policy survey memo (PDF), fielded September 10–14, 2026","u":"https://cdn.prod.website-files.com/663a60b91deeae06e8ae1d1c/6ab129528411a28d1a030f66_September_Website_Final.pdf"},{"t":"Economist/YouGov, Many Americans think data centers are bad for the U.S., August 21–24, 2026 (1,536 U.S. adult citizens)","u":"https://yougov.com/en-us/articles/55438-many-americans-think-data-centers-are-bad-for-the-us-more-oppose-them-locally"}],"need":null,"ev":"cited","shared":"Energy"},{"id":"no-subsidy","name":"Make data centers pay the same taxes as other businesses","x":64,"y":78,"stance":"Back","why":"","proof":["DHM Research, Oregon state poll, July 23 to 28, 2026: 73% of 600 Oregon registered voters oppose and 21% support providing tax breaks to attract AI data centers and the construction and tech jobs they bring.","Joseph Rainey Center, September 10 to 14, 2026: in head-to-head matchups of lawmaker approaches, ending all data center tax breaks won 56% of its matchups, while keeping existing tax breaks won 35% and finished last of ten.","ARI and Morning Consult, July 17 to 19, 2026 (ARI is an advocacy group): 77% of 2,202 registered voters are concerned that taxpayers are forced to subsidize data center construction without knowing the full cost, including 50% who are very concerned."],"sources":[{"t":"Joseph Rainey Center for Public Policy, September policy survey, fielded September 10–14, 2026 (1,004 registered voters, online panel, margin of error 4.9 points)","u":"https://www.raineycenter.org/polling/september-policy-survey-summary-of-findings"},{"t":"Joseph Rainey Center for Public Policy, September policy survey memo (PDF), fielded September 10–14, 2026","u":"https://cdn.prod.website-files.com/663a60b91deeae06e8ae1d1c/6ab129528411a28d1a030f66_September_Website_Final.pdf"},{"t":"DHM Research, Oregon Pulse, AI and data centers, July 23–28, 2026 (600 Oregon registered voters, margin of error 4 points)","u":"https://www.dhmresearch.com/wp-content/uploads/2026/08/OR-Pulse_AI-and-Data-Centers-40060-Toplines-July-2026.pdf"},{"t":"ARI (advocacy group) and Morning Consult, data center poll, July 17–19, 2026 (2,202 registered voters, margin of error 2 points)","u":"https://ari.us/wp-content/uploads/2026/07/ARI_Poll_DataCenters_RegisteredVoters_7-21-26.pdf"}],"need":"Which states grant tax breaks for data centers, and at what cost.","ev":"indirect"},{"id":"no-license","name":"Do not create a new federal AI licensing board","x":44,"y":73,"stance":"Back","why":"","proof":["Program for Public Consultation, University of Maryland, February 11 to 26, 2026: 80% of 2,509 U.S. adults favor creating a new federal agency dedicated to AI and 20% oppose, a large majority for the opposite of this dot.","Quinnipiac University, September 24 to 27, 2026: 86% of U.S. adults support requiring companies that develop AI to meet independent safety standards even if it slows AI development, and 9% oppose.","Gallup and the Special Competitive Studies Project (SCSP is a think tank and sponsored the survey), June 2 to 23, 2026: 75% of 3,152 U.S. adults say AI safety testing should be done by independent experts, 52% say by government agencies and 35% say by companies.","Pew Research Center, March 24 to 30, 2025: 44% of adults trust the U.S. a lot or some to regulate AI effectively and 47% have little or no trust. Republicans trust more than Democrats, 54% to 36%."],"sources":[{"t":"Pew Research Center, survey March 24–30, 2025 (n=3,605), reported November 6, 2025","u":"https://www.pewresearch.org/short-reads/2025/11/06/republicans-democrats-now-equally-concerned-about-ai-in-daily-life-but-views-on-regulation-differ/"},{"t":"Quinnipiac University national poll, September 24–27, 2026 (1,202 adults, margin of error 3.5 points), released September 30, 2026","u":"https://poll.qu.edu/poll-release?releaseid=3969"},{"t":"Program for Public Consultation, University of Maryland, AI questionnaire, February 11–26, 2026 (2,509 adults)","u":"https://publicconsultation.org/wp-content/uploads/2026/07/CG-Questionnaire-Washington-Artificial-Intelligence-2026.pdf"},{"t":"Program for Public Consultation, Citizens' Guide to AI results page","u":"https://publicconsultation.org/united-states/cg2026-ai/"},{"t":"Gallup and SCSP (think tank sponsor), American Perspective on AI report, June 2–23, 2026 (3,152 adults)","u":"https://www.scsp.ai/wp-content/uploads/2026/09/SCSP_AmericanPerspectiveAI_Report-FINAL-09.15.2026.pdf"}],"need":"The status of any federal licensing bill.","ev":"indirect"},{"id":"no-cba","name":"Require a community-benefits contract before a data center is built","x":27,"y":60,"stance":"Oppose","why":"","proof":["Joseph Rainey Center, September 10 to 14, 2026: 71% of registered voters support requiring data center operators to sign a community benefits agreement before construction and 12% oppose.","Joseph Rainey Center, May 15 to 18, 2026 (1,010 registered voters): 66% support mandatory community benefits agreements before data center construction."],"sources":[{"t":"Joseph Rainey Center for Public Policy, September policy survey, fielded September 10–14, 2026 (1,004 registered voters, online panel, margin of error 4.9 points)","u":"https://www.raineycenter.org/polling/september-policy-survey-summary-of-findings"},{"t":"Joseph Rainey Center for Public Policy, September policy survey memo (PDF), fielded September 10–14, 2026","u":"https://cdn.prod.website-files.com/663a60b91deeae06e8ae1d1c/6ab129528411a28d1a030f66_September_Website_Final.pdf"},{"t":"Joseph Rainey Center for Public Policy, data center poll, May 15–18, 2026 (1,010 registered voters, online, margin of error 3.3 points)","u":"https://www.raineycenter.org/polling/data-centers-voters-are-persuadable-but-they-want-accountability-and-clean-energy"}],"need":"Which states or towns require this today.","ev":"cited"}],"cultural":[{"id":"china","name":"The U.S. should stay ahead of China in AI","x":63,"y":75,"stance":"Watch","why":"","proof":["Quinnipiac University, September 24 to 27, 2026: 69% of U.S. adults say it is very (40%) or somewhat (29%) important that the U.S. keep up with China in developing AI, and 27% say it is not so or not at all important.","Pew Research Center, June 22 to 28, 2026: 43% of 3,488 U.S. adults say it is extremely or very important for the U.S. to be the world's leader in developing AI, 34% say somewhat important and 22% say not too or not at all important. Republicans are at 54% and Democrats at 34% for extremely or very important.","CBS News/YouGov, September 16 to 18, 2026: 56% of U.S. adults say it is necessary to develop AI faster than China does and 44% say it is not necessary.","Joseph Rainey Center, September 10 to 14, 2026: 25% of registered voters put staying ahead of China in AI among their top three priorities for lawmakers. That ranks priorities against other issues and does not measure support for the idea."],"sources":[{"t":"Quinnipiac University national poll, September 24–27, 2026 (1,202 adults, margin of error 3.5 points), released September 30, 2026","u":"https://poll.qu.edu/poll-release?releaseid=3969"},{"t":"Pew Research Center, global AI race short read, survey June 22–28, 2026 (3,488 adults), published July 23, 2026","u":"https://www.pewresearch.org/short-reads/2026/07/23/what-americans-think-about-the-global-ai-race/"},{"t":"CBS News/YouGov poll, September 16–18, 2026 (2,051 U.S. adults, margin of error 2.5 points)","u":"https://assets1.cbsnewsstatic.com/hub/cms/prod_cms_alt/file/2026/09/18/68e001db-f79b-474f-ba94-baa1fdac644c/cbsnews_20260918_fri.pdf"},{"t":"Joseph Rainey Center for Public Policy, September policy survey, fielded September 10–14, 2026 (1,004 registered voters, online panel, margin of error 4.9 points)","u":"https://www.raineycenter.org/polling/september-policy-survey-summary-of-findings"},{"t":"Joseph Rainey Center for Public Policy, September policy survey memo (PDF), fielded September 10–14, 2026","u":"https://cdn.prod.website-files.com/663a60b91deeae06e8ae1d1c/6ab129528411a28d1a030f66_September_Website_Final.pdf"}],"need":null,"ev":"cited"},{"id":"jobs-gone","name":"Belief that AI will reduce U.S. jobs","x":79,"y":86,"stance":"Answer","why":"Most expect fewer jobs in the cited Gallup poll.","proof":["79% say AI will reduce the number of U.S. jobs over the next 10 years, up from 73% in 2025 (3,270 adults, May 4–11, 2026)."],"sources":[{"t":"Gallup/Bentley, May 4–11, 2026 (3,270 adults)","u":"https://news.gallup.com/poll/712751/americans-cool-toward.aspx"}],"need":null,"ev":"cited"},{"id":"privacy","name":"I think AI will make personal information less secure","x":71,"y":69,"stance":"Watch","why":"","proof":["Pew Research Center, February 17 to 23, 2026: 71% of 5,119 U.S. adults say increased use of AI will make their personal information less secure, 3% say more secure, 10% say not much difference and 16% are not sure.","Joseph Rainey Center, September 10 to 14, 2026: 69% of registered voters are very (34%) or somewhat (35%) concerned about AI-powered surveillance tools in public spaces.","Joseph Rainey Center, September 10 to 14, 2026: 14% of registered voters pick AI eliminating data privacy as the AI concern that worries them most, behind job loss at 26% and the destruction of humanity at 19%."],"sources":[{"t":"Pew Research Center, Americans and AI topline, survey February 17–23, 2026 (5,119 adults)","u":"https://www.pewresearch.org/wp-content/uploads/sites/20/2026/06/PI_2026.06.17_Americans-and-AI_TOPLINE.pdf"},{"t":"Joseph Rainey Center for Public Policy, September policy survey, fielded September 10–14, 2026 (1,004 registered voters, online panel, margin of error 4.9 points)","u":"https://www.raineycenter.org/polling/september-policy-survey-summary-of-findings"},{"t":"Joseph Rainey Center for Public Policy, September policy survey memo (PDF), fielded September 10–14, 2026","u":"https://cdn.prod.website-files.com/663a60b91deeae06e8ae1d1c/6ab129528411a28d1a030f66_September_Website_Final.pdf"}],"need":null,"ev":"cited"},{"id":"control","name":"I worry that AI will control people","x":45,"y":40,"stance":"Watch","why":"No poll asks this directly and the closest items run from 17% to 73%.","proof":["Pew Research Center, June 9 to 15, 2025: 57% of U.S. adults rate the risks of AI for society as high or very high. Among the 1,515 who do, 17% give concerns over human control of AI as the main reason, including 9% AI taking over and 8% no control over AI.","CBS News/YouGov, September 16 to 18, 2026: 52% of U.S. adults say AI models operating on their own will certainly or probably bring physical harm to people, 26% say probably or certainly not and 22% are not sure.","Quinnipiac University, September 24 to 27, 2026: 73% of U.S. adults are very (38%) or somewhat (35%) concerned that future AI could threaten human survival, and 25% are not concerned."],"sources":[{"t":"Pew Research Center, AI and its impact topline, survey June 9–15, 2025 (5,023 adults)","u":"https://www.pewresearch.org/wp-content/uploads/sites/20/2025/09/PS_2025.9.17_AI-and-its-impact_topline.pdf"},{"t":"CBS News/YouGov poll, September 16–18, 2026 (2,051 U.S. adults, margin of error 2.5 points)","u":"https://assets1.cbsnewsstatic.com/hub/cms/prod_cms_alt/file/2026/09/18/68e001db-f79b-474f-ba94-baa1fdac644c/cbsnews_20260918_fri.pdf"},{"t":"Quinnipiac University national poll, September 24–27, 2026 (1,202 adults, margin of error 3.5 points), released September 30, 2026","u":"https://poll.qu.edu/poll-release?releaseid=3969"}],"need":null,"ev":"indirect"},{"id":"cure","name":"I hope that AI will cure disease","x":53,"y":36,"stance":"Watch","why":"Polls on hopes for AI in medicine run from 17% to 66%.","proof":["Joseph Rainey Center, September 10 to 14, 2026: 17% of registered voters name curing diseases as the AI development that excites them most, the top choice, and 41% choose nothing.","CBS News/YouGov, September 16 to 18, 2026: 57% of U.S. adults are very (15%) or somewhat (42%) optimistic that AI will find new scientific discoveries, including medicines, and 43% are pessimistic.","Pew Research Center, June 9 to 15, 2025: among 2,505 U.S. adults, 66% say AI will play a big role (31%) or small role (35%) in developing new medicines, 18% say no role and 16% are not sure.","Anthropic (an AI company that ran the survey) Public Record, fielded by YouGov November 1 to December 11, 2025: 48% of 51,993 U.S. residents age 16 and older put curing diseases like cancer or Alzheimer's among their top three hopes for AI, out of 17 options."],"sources":[{"t":"Joseph Rainey Center for Public Policy, September policy survey, fielded September 10–14, 2026 (1,004 registered voters, online panel, margin of error 4.9 points)","u":"https://www.raineycenter.org/polling/september-policy-survey-summary-of-findings"},{"t":"Joseph Rainey Center for Public Policy, September policy survey memo (PDF), fielded September 10–14, 2026","u":"https://cdn.prod.website-files.com/663a60b91deeae06e8ae1d1c/6ab129528411a28d1a030f66_September_Website_Final.pdf"},{"t":"CBS News/YouGov poll, September 16–18, 2026 (2,051 U.S. adults, margin of error 2.5 points)","u":"https://assets1.cbsnewsstatic.com/hub/cms/prod_cms_alt/file/2026/09/18/68e001db-f79b-474f-ba94-baa1fdac644c/cbsnews_20260918_fri.pdf"},{"t":"Pew Research Center, AI and its impact topline, survey June 9–15, 2025 (5,023 adults)","u":"https://www.pewresearch.org/wp-content/uploads/sites/20/2025/09/PS_2025.9.17_AI-and-its-impact_topline.pdf"},{"t":"Anthropic, The Anthropic Public Record (AI company sponsor; fielded by YouGov, November 1–December 11, 2025; 51,993 U.S. residents age 16 and older)","u":"https://www.anthropic.com/news/anthropic-public-record"}],"need":null,"ev":"cited"}]},{"id":"education","name":"Education","practical":[{"id":"would-use","name":"Share of eligible families who actually use the account","x":74,"y":70,"stance":"Back","why":"The cited figure is stated intent only.","proof":["65% of school parents say they would enroll.","13% say no.","22% are unsure."],"sources":[{"t":"EdChoice (school-choice advocate; sponsors its own survey), 2026 Schooling in America Survey, March 24–April 4, 2026 (school parents n=2,466)","u":"https://www.edchoice.org/wp-content/uploads/2026/08/2026-SIA.pdf"}],"need":"Enrollment by state.","ev":"cited"}],"structural":[{"id":"esa","name":"Give every family an education account so the money follows the child","x":74,"y":88,"stance":"Back","why":"The cost case is the amount per pupil: the Arizona account formula funds 90% of the base support level plus charter additional assistance (Arizona Joint Legislative Budget Committee Staff, January 15, 2025), and in Arkansas the state estimated $12.2 million to $22.0 million in savings from students who would otherwise have attended public school in 2024-25 (University of Arkansas and Arkansas Department of Education, October 2025).","proof":["When an education savings account is described, 78% of adults and 84% of school parents favor the accounts. Without the description, 54% of adults and 64% of school parents favor the accounts.","77% of adults agree education savings accounts should be available to all families regardless of income and special needs.","Arizona Joint Legislative Budget Committee Staff, FY 2026 Baseline Book, January 2025 (citing Arizona Department of Education data through the first quarter of FY 2025): about 57% of students who newly enrolled in the universal education account program in FY 2025 were enrolled in a public school the year before. FY 2025 awards were $872,588,300 for 88,660 enrollees, which is $50,557,700 over the enacted budget of $822,030,600 for 82,452 enrollees.","Texas Legislative Budget Board fiscal note on SB 2, 2025: net cost of $1.0 billion to General Revenue in 2026-27 (capped by the bill), and projected program cost of $3.3 billion in FY 2028, $3.7 billion in FY 2029 and $4.8 billion in FY 2030 if not capped by appropriation. The note assumes 175,000 current private school students apply in FY 2027, rising to 227,500 in FY 2030, and public school savings of $10,512 per switching student in FY 2027.","University of Arkansas and Arkansas Department of Education, October 2025 (2024-25 school year): the state spent $93.8 million on education freedom accounts for 14,256 students, with $12.2 million to $22.0 million in potential savings from students who would otherwise have attended public school, a net cost of $71.8 million to $81.6 million. Of participants, 12% had attended public school the year before, 25% private school and 17% were homeschooled."],"sources":[{"t":"EdChoice (school-choice advocate; sponsors its own survey), 2026 Schooling in America Survey, March 24–April 4, 2026 (adults n=1,504; school parents n=2,466)","u":"https://www.edchoice.org/wp-content/uploads/2026/08/2026-SIA.pdf"},{"t":"Arizona Joint Legislative Budget Committee Staff, K-12 Funding, presentation to the Senate Education Committee, January 15, 2025","u":"https://www.azjlbc.gov/units/k-12formulafunding.pdf"},{"t":"Arizona Joint Legislative Budget Committee Staff, FY 2026 Baseline Book, Department of Education, January 2025","u":"https://www.azjlbc.gov/26baseline/ade.pdf"},{"t":"Texas Legislative Budget Board, fiscal note on SB 2 (89th Legislature, as passed second house), education savings accounts, 2025","u":"https://capitol.texas.gov/tlodocs/89R/fiscalnotes/pdf/SB00002F.pdf"},{"t":"University of Arkansas Department of Education Reform with the Arkansas Department of Education, 2024-25 Arkansas Education Freedom Accounts Program Annual Report, October 2025","u":"https://dese.ade.arkansas.gov/Files/2024-25_Arkansas_Education_Freedom_Accounts_Program_Annual_Report_100125_OSCPE.pdf"}],"need":"Number of states with accounts and their size. Enrollment. How many members would vote yes.","ev":"cited"},{"id":"tax-credit","name":"Give families a tax credit they can spend on school","x":68,"y":82,"stance":"Back","why":"The family spends the credit, which matches the refundable tax credit question and not a donor-credit scholarship.","proof":["72% of adults and 83% of school parents favor refundable tax credits that let families cover qualifying K-12 expenses.","In June–August 2026 EdChoice and Morning Consult polling, 65% of adults and 79% of school parents did.","Tax-credit scholarships, where donors receive the credit, drew 72% of adults and 82% of school parents."],"sources":[{"t":"EdChoice (school-choice advocate; sponsors its own survey), 2026 Schooling in America Survey, March 24–April 4, 2026 (adults n=1,504; school parents n=2,466)","u":"https://www.edchoice.org/wp-content/uploads/2026/08/2026-SIA.pdf"},{"t":"EdChoice and Morning Consult (EdChoice is a school-choice advocate that sponsors its own surveys), National Polling Report #66, June–August 2026 (three waves of about 2,250 adults each)","u":"https://www.edchoice.org/wp-content/uploads/2026/09/September-2026-Parents-and-Public-Survey.pdf"},{"t":"EdChoice, Highlights from the newly released 2026 Schooling in America survey, August 11, 2026","u":"https://www.edchoice.org/highlights-from-the-newly-released-2026-schooling-in-america-survey/"}],"need":"State credit laws and sizes. The tax-credit scholarship figure of 72% and 82% is from EdChoice's highlights post, not the report chart.","ev":"cited"},{"id":"open-enroll","name":"Let public school students transfer to a public school of their choice","x":64,"y":65,"stance":"Back","why":"Open enrollment lets students transfer while space remains, which is narrower than any public school in the state.","proof":["83% of school parents favor open enrollment, which lets a public school student transfer to another public school of choice, and 17% oppose.","In January 2025, 66% of adults supported inter-district open enrollment.","Reason Foundation counts 16 states with statewide cross-district open enrollment. That is a secondary count, not statute text."],"sources":[{"t":"EdChoice (school-choice advocate; sponsors its own survey), 2026 Schooling in America Survey, March 24–April 4, 2026 (adults n=1,504; school parents n=2,466)","u":"https://www.edchoice.org/wp-content/uploads/2026/08/2026-SIA.pdf"},{"t":"EdChoice and Morning Consult, public opinion tracker, January 13–15, 2025 (n=2,256 adults)","u":"https://www.edchoice.org/wp-content/uploads/2025/04/public-opinion-tracker-1.pdf"},{"t":"Reason Foundation, Public schools without boundaries 2025, October 2, 2025","u":"https://reason.org/open-enrollment/public-schools-without-boundaries-2025/"}],"need":"State open-enrollment laws. A 2026 adult figure.","ev":"cited"},{"id":"charters","name":"Open more charter schools","x":66,"y":44,"stance":"Back","why":"A charter school does not move the dollar to the family.","proof":["75% of school parents support charter schools and 24% oppose.","About two-thirds of adults support charter schools."],"sources":[{"t":"EdChoice (school-choice advocate; sponsors its own survey), 2026 Schooling in America Survey, March 24–April 4, 2026","u":"https://www.edchoice.org/wp-content/uploads/2026/08/2026-SIA.pdf"}],"need":"Charter cap laws by state.","ev":"cited"},{"id":"vouchers","name":"Give families a voucher for a private-school seat","x":66,"y":57,"stance":"Watch","why":"A voucher is a first step toward accounts. A voucher pays a set amount per pupil: the Ohio income-based EdChoice Expansion scholarship averaged $4,958 per participant in 2024-25 ($492,867,236 for 100,939 students), and the Wisconsin voucher pays $10,877 for grades K-8 and $13,371 for grades 9-12 in 2025-26 from state general revenue.","proof":["After a brief description, 69% of adults and 79% of school parents support vouchers. Without it, about half of adults and 61% of school parents do.","In 2025, with the description, Republican support was 77% and Democratic support was 57%.","Ohio Department of Education and Workforce, 2025 Scholarship Annual Report: the income-based EdChoice Expansion scholarship served 100,939 students in 2024-25 at a cost of $492,867,236, an average of $4,958 per participant.","Wisconsin Department of Public Instruction, 2025-26: the Milwaukee private school voucher program pays $10,877 for grades K-8 and $13,371 for grades 9-12 per pupil, funded 100% from state general revenue.","National Bureau of Economic Research, Working Paper 21839, December 2015: participation in the Louisiana Scholarship Program lowered math scores by 0.41 standard deviations one year after the lottery.","U.S. Institute of Education Sciences (Westat), NCEE 2019-4006: three years after students applied, the DC Opportunity Scholarship Program had no statistically significant impact on reading or math (students offered a scholarship scored 0.1 percentile points higher in math and 1.6 lower in reading)."],"sources":[{"t":"EdChoice (school-choice advocate; sponsors its own survey), 2026 Schooling in America Survey, March 24–April 4, 2026","u":"https://www.edchoice.org/wp-content/uploads/2026/08/2026-SIA.pdf"},{"t":"EdChoice (school-choice advocate; sponsors its own survey), 2025 Schooling in America Survey, March 28–April 7, 2025 (adults n=1,514; school parents n=2,455)","u":"https://www.edchoice.org/wp-content/uploads/2026/03/2025-SIA-WEB-2.pdf"},{"t":"Ohio Department of Education and Workforce, 2025 Scholarship Annual Report","u":"https://education.ohio.gov/getattachment/About/Annual-Reports/2025-Scholarship-Annual-Report.pdf.aspx?lang=en-US"},{"t":"Wisconsin Department of Public Instruction, 2025-26 Funding Comparison for Wisconsin Education Options","u":"https://dpi.wi.gov/sites/default/files/imce/sfs/pdf/FY26-ChoiceOptionsFundingTable.pdf"},{"t":"National Bureau of Economic Research, Abdulkadiroglu, Pathak and Walters, Free to Choose: Can School Choice Reduce Student Achievement? Working Paper 21839, December 2015","u":"https://www.nber.org/system/files/working_papers/w21839/w21839.pdf"},{"t":"U.S. Institute of Education Sciences (Westat), Evaluation of the DC Opportunity Scholarship Program: Impacts Three Years After Students Applied, NCEE 2019-4006","u":"https://ies.ed.gov/ncee/pubs/20194006/pdf/20194006.pdf"}],"need":"State voucher laws.","ev":"cited"},{"id":"needs","name":"Limit accounts to families with financial need","x":62,"y":34,"stance":"Oppose","why":"Opposing a need limit means backing accounts for all families. The cost case is the amount per pupil, shown on the account dot. This design is not a minority view: 65% agree in 2026 and 56% in 2025.","proof":["77% of adults agree education savings accounts should be available to all families regardless of income and special needs, while 65% in a separate half of the sample agree they should be available only to families based on financial need. 65% is still a majority.","In 2025 the figures were 75% and 56%.","Arizona Joint Legislative Budget Committee Staff, FY 2026 Baseline Book, January 2025 (citing Arizona Department of Education data through the first quarter of FY 2025): about 57% of students who newly enrolled in the universal education account program in FY 2025 were enrolled in a public school the year before. FY 2025 awards were $872,588,300 for 88,660 enrollees, which is $50,557,700 over the enacted budget of $822,030,600 for 82,452 enrollees.","Texas Legislative Budget Board fiscal note on SB 2, 2025: net cost of $1.0 billion to General Revenue in 2026-27 (capped by the bill), and projected program cost of $3.3 billion in FY 2028, $3.7 billion in FY 2029 and $4.8 billion in FY 2030 if not capped by appropriation. The note assumes 175,000 current private school students apply in FY 2027, rising to 227,500 in FY 2030, and public school savings of $10,512 per switching student in FY 2027.","University of Arkansas and Arkansas Department of Education, October 2025 (2024-25 school year): the state spent $93.8 million on education freedom accounts for 14,256 students, with $12.2 million to $22.0 million in potential savings from students who would otherwise have attended public school, a net cost of $71.8 million to $81.6 million. Of participants, 12% had attended public school the year before, 25% private school and 17% were homeschooled."],"sources":[{"t":"EdChoice (school-choice advocate; sponsors its own survey), 2026 Schooling in America Survey, March 24–April 4, 2026 (adults n=1,504; school parents n=2,466)","u":"https://www.edchoice.org/wp-content/uploads/2026/08/2026-SIA.pdf"},{"t":"EdChoice (school-choice advocate; sponsors its own survey), 2025 Schooling in America Survey, March 28–April 7, 2025 (adults n=1,514; school parents n=2,455)","u":"https://www.edchoice.org/wp-content/uploads/2026/03/2025-SIA-WEB-2.pdf"},{"t":"Arizona Joint Legislative Budget Committee Staff, K-12 Funding, presentation to the Senate Education Committee, January 15, 2025","u":"https://www.azjlbc.gov/units/k-12formulafunding.pdf"},{"t":"Arizona Joint Legislative Budget Committee Staff, FY 2026 Baseline Book, Department of Education, January 2025","u":"https://www.azjlbc.gov/26baseline/ade.pdf"},{"t":"Texas Legislative Budget Board, fiscal note on SB 2 (89th Legislature, as passed second house), education savings accounts, 2025","u":"https://capitol.texas.gov/tlodocs/89R/fiscalnotes/pdf/SB00002F.pdf"},{"t":"University of Arkansas Department of Education Reform with the Arkansas Department of Education, 2024-25 Arkansas Education Freedom Accounts Program Annual Report, October 2025","u":"https://dese.ade.arkansas.gov/Files/2024-25_Arkansas_Education_Freedom_Accounts_Program_Annual_Report_100125_OSCPE.pdf"}],"need":"Which states are needs-tested.","ev":"cited"}],"cultural":[{"id":"ed1","name":"Families, not districts, should fit education to the child","x":45,"y":87,"stance":"Back","why":"Polls on school choice and on parents' say run from 35% to 78%.","proof":["AP-NORC, June 5 to 9, 2025: 55% of 1,158 U.S. adults say parents have too little influence over what public schools teach, 28% say about the right amount and 16% say too much. Republicans are at 73% for too little and Democrats at 37%.","AP-NORC, June 5 to 9, 2025: Americans are split on school vouchers, with 35% in favor, 38% opposed and 25% neither.","EdChoice (a school choice advocacy group that sponsors its own survey), March 24 to April 4, 2026: 54% of 1,504 adults and 64% of school parents favor education savings accounts when the question gives no description. With a description of how the accounts work, support is 78% of adults and 84% of school parents."],"sources":[{"t":"AP-NORC, June 2025 topline (1,158 adults, margin of error 4.0 points)","u":"https://apnorc.org/wp-content/uploads/2025/07/June-2025-Topline.pdf"},{"t":"AP-NORC, the public holds nuanced views on the role of religion in public schools, June 5–9, 2025","u":"https://apnorc.org/projects/the-public-holds-nuanced-views-on-the-role-of-religion-in-public-schools/"},{"t":"EdChoice (school-choice advocate; sponsors its own survey), 2026 Schooling in America Survey, March 24–April 4","u":"https://www.edchoice.org/wp-content/uploads/2026/08/2026-SIA.pdf"}],"need":null,"ev":"indirect"},{"id":"ed4","name":"Every family should get the account, not only poor families","x":77,"y":74,"stance":"Claim","why":"The cited public polls show the universal account ahead of the needs-based one. The cost case is the amount per pupil, shown on the account dot.","proof":["77% of adults agree education savings accounts should be available to all families regardless of income and special needs, while 65% in a separate half of the sample agree they should be available only to families based on financial need.","Among school parents in the June–August 2026 polls, 76% agree with the universal version and 60% with the needs-based version.","In 2025 the figures were 75% and 56%.","Arizona Joint Legislative Budget Committee Staff, FY 2026 Baseline Book, January 2025 (citing Arizona Department of Education data through the first quarter of FY 2025): about 57% of students who newly enrolled in the universal education account program in FY 2025 were enrolled in a public school the year before. FY 2025 awards were $872,588,300 for 88,660 enrollees, which is $50,557,700 over the enacted budget of $822,030,600 for 82,452 enrollees.","Texas Legislative Budget Board fiscal note on SB 2, 2025: net cost of $1.0 billion to General Revenue in 2026-27 (capped by the bill), and projected program cost of $3.3 billion in FY 2028, $3.7 billion in FY 2029 and $4.8 billion in FY 2030 if not capped by appropriation. The note assumes 175,000 current private school students apply in FY 2027, rising to 227,500 in FY 2030, and public school savings of $10,512 per switching student in FY 2027.","University of Arkansas and Arkansas Department of Education, October 2025 (2024-25 school year): the state spent $93.8 million on education freedom accounts for 14,256 students, with $12.2 million to $22.0 million in potential savings from students who would otherwise have attended public school, a net cost of $71.8 million to $81.6 million. Of participants, 12% had attended public school the year before, 25% private school and 17% were homeschooled."],"sources":[{"t":"EdChoice (school-choice advocate; sponsors its own survey), 2026 Schooling in America Survey, March 24–April 4, 2026 (adults n=1,504; school parents n=2,466)","u":"https://www.edchoice.org/wp-content/uploads/2026/08/2026-SIA.pdf"},{"t":"EdChoice and Morning Consult (EdChoice is a school-choice advocate that sponsors its own surveys), National Polling Report #66, June–August 2026 (three waves of about 2,250 adults each)","u":"https://www.edchoice.org/wp-content/uploads/2026/09/September-2026-Parents-and-Public-Survey.pdf"},{"t":"EdChoice (school-choice advocate; sponsors its own survey), 2025 Schooling in America Survey, March 28–April 7, 2025 (adults n=1,514; school parents n=2,455)","u":"https://www.edchoice.org/wp-content/uploads/2026/03/2025-SIA-WEB-2.pdf"},{"t":"Arizona Joint Legislative Budget Committee Staff, K-12 Funding, presentation to the Senate Education Committee, January 15, 2025","u":"https://www.azjlbc.gov/units/k-12formulafunding.pdf"},{"t":"Arizona Joint Legislative Budget Committee Staff, FY 2026 Baseline Book, Department of Education, January 2025","u":"https://www.azjlbc.gov/26baseline/ade.pdf"},{"t":"Texas Legislative Budget Board, fiscal note on SB 2 (89th Legislature, as passed second house), education savings accounts, 2025","u":"https://capitol.texas.gov/tlodocs/89R/fiscalnotes/pdf/SB00002F.pdf"},{"t":"University of Arkansas Department of Education Reform with the Arkansas Department of Education, 2024-25 Arkansas Education Freedom Accounts Program Annual Report, October 2025","u":"https://dese.ade.arkansas.gov/Files/2024-25_Arkansas_Education_Freedom_Accounts_Program_Annual_Report_100125_OSCPE.pdf"}],"need":null,"ev":"cited"},{"id":"ed5","name":"Public school students should be able to transfer to a public school of their choice when there is room","x":66,"y":66,"stance":"Claim","why":"The wording follows open enrollment, the item public polls ask. The NCES figures are from 2019.","proof":["Among school parents, 83% favor open enrollment.","66% of adults supported inter-district open enrollment in January 2025 (EdChoice and Morning Consult, n=2,256).","In 2019, 79% of K-12 students attended a public school assigned by where the family lived, and 12% attended a public school the family chose."],"sources":[{"t":"EdChoice (school-choice advocate; sponsors its own survey), 2026 Schooling in America Survey, March 24–April 4, 2026 (adults n=1,504; school parents n=2,466)","u":"https://www.edchoice.org/wp-content/uploads/2026/08/2026-SIA.pdf"},{"t":"EdChoice and Morning Consult (EdChoice is a school-choice advocate that sponsors its own surveys), public opinion tracker, January 13–15, 2025 (n=2,256 adults)","u":"https://www.edchoice.org/wp-content/uploads/2025/04/public-opinion-tracker-1.pdf"},{"t":"NCES, 2019 School Choice Participation (NCES 2023-085, May 2024; 2019 Parent and Family Involvement Survey)","u":"https://nces.ed.gov/pubs2023/2023085/index.asp"}],"need":"A 2026 adult figure.","ev":"cited"},{"id":"status","name":"Most school parents say K-12 education is on the wrong track","x":59,"y":24,"stance":"Watch","why":"","proof":["Nearly 60% of school parents say K-12 education is on the wrong track nationwide (EdChoice, 2025)."],"sources":[{"t":"EdChoice (school-choice advocate; sponsors its own survey), 2025 Schooling in America Survey, March 28–April 7, 2025 (adults n=1,514; school parents n=2,455)","u":"https://www.edchoice.org/wp-content/uploads/2026/03/2025-SIA-WEB-2.pdf"}],"need":null,"ev":"cited"}]},{"id":"energy","name":"Energy","practical":[{"id":"interconnect","name":"Cut the wait to connect new power plants to the grid","x":35,"y":40,"stance":"Back","why":"The cited figure is the median wait for plants that began operating in 2025, in the regions with enough data.","proof":["Lawrence Berkeley National Laboratory, Queued Up 2026 Edition, June 2026 (requests to more than 50 grid operators that hold about 98% of installed U.S. generating capacity, through the end of 2025): the median plant that began operating in 2025 waited 61 months, about 5.1 years, from interconnection request to commercial operation, against 36 months for plants that began in 2015 and 22 months in 2008.","Berkeley Lab, June 2026: of the capacity that requested interconnection from 2000 to 2020, 13% had reached commercial operation by the end of 2025, 75% had been withdrawn and 10% was still waiting.","Berkeley Lab, June 2026: more than 8,200 projects were waiting at the end of 2025, with 1,312 GW of generation and 749 GW of storage. Waiting capacity was 773 GW of solar, 253 GW of natural gas and 220 GW of wind.","Berkeley Lab, June 2026: the median wait from request to operation was 20 months for plants under 5 MW and 59 months for plants of 200 MW or more.","Berkeley Lab, June 2026: the 2025 median covers the regions with enough data and has no 2025 sample from MISO or NYISO. Berkeley Lab says the data pre-date FERC Order 2023 implementation and it is too early to measure the full effect of that order and other reforms."],"sources":[{"t":"Lawrence Berkeley National Laboratory (U.S. Department of Energy national laboratory), Queued Up: 2026 Edition, Characteristics of Power Plants Seeking Transmission Interconnection as of the End of 2025, June 2026","u":"https://emp.lbl.gov/sites/default/files/2026-06/Queued%20Up%202026%20Edition.pdf"}],"need":"A sourced link between the queue wait and the price households pay. 2025 waits in MISO and NYISO.","ev":"cited"}],"structural":[{"id":"cross","name":"Make big new power users pay for their own power and wires","x":86,"y":88,"stance":"Back","why":"","proof":["AP-NORC/EPIC, July 6 to 24, 2026: 73% of adults support requiring companies that build data centers to pay for the electric grid upgrades needed to support them, and 7% oppose.","Consumer Reports and NORC (Consumer Reports is a nonprofit consumer group and sponsored the survey), April 27 to May 19, 2026: 84% of adults support their local utility creating a separate rate category for large electricity users like data centers, and 15% oppose.","Consumer Reports and NORC, April 27 to May 19, 2026: on who should pay for new infrastructure built for data centers, 50% of adults say data centers should pay all of the costs, 39% say data centers should pay more than other customers and 9% say costs should be shared evenly.","Pew Research Center, March 16 to 22, 2026: three-quarters of U.S. adults say their home energy costs have gone up in recent years, and 42% say a lot. Among those whose costs rose, 43% say data centers using more energy is a major reason, 23% a minor reason and 26% are not sure.","Inclusive Abundance Initiative (an advocacy group) with Blue Rose Research, May 13 to 23, 2026: 79% of likely 2026 voters say their household electricity costs rose over the past two years.","Morning Consult, November 21 to 23, 2025: 58% of registered voters say AI data centers are very or somewhat responsible for rising household electricity costs, up from 54% in October.","Joseph Rainey Center, September 10 to 14, 2026: 38% of registered voters name making data center companies pay their own electricity a top-three priority for lawmakers on AI.","Joseph Rainey Center, September 10 to 14, 2026: in head-to-head matchups of lawmaker approaches, the leading package won 64% of its matchups. It includes developers bringing their own power."],"sources":[{"t":"Pew Research Center, March 16–22, 2026 (short read published May 6, 2026)","u":"https://www.pewresearch.org/short-reads/2026/05/06/many-americans-hold-utility-companies-responsible-for-their-rising-home-energy-bills/"},{"t":"Inclusive Abundance / Blue Rose Research, likely 2026 voters (about 20,000), May 13–23, 2026","u":"https://www.inclusiveabundance.org/abundance-in-action/new-polling-voters-across-party-lines-support-permitting-reform"},{"t":"Morning Consult, November 21–23, 2025","u":"https://intel.morningconsult.com/mc-content/analysis/ai-data-center-energy-prices-november-2025"},{"t":"Joseph Rainey Center for Public Policy, September policy survey, fielded September 10–14, 2026 (1,004 registered voters, online panel, margin of error 4.9 points)","u":"https://www.raineycenter.org/polling/september-policy-survey-summary-of-findings"},{"t":"AP-NORC/EPIC poll topline, July 6–24, 2026 (3,424 adults, margin of error 2.2 points; funded by the Energy Policy Institute at the University of Chicago)","u":"https://apnorc.org/wp-content/uploads/2026/09/2026-AP-NORC-EPIC-Topline-Release-1.pdf"},{"t":"Consumer Reports and NORC, energy fairness survey, April 27–May 19, 2026 (2,003 adults)","u":"https://article.images.consumerreports.org/image/upload/v1786475744/Consumer_Reports_Energy_Fairness_April_May_2026_pydlrg.pdf"},{"t":"Joseph Rainey Center for Public Policy, September policy survey memo (PDF), fielded September 10–14, 2026","u":"https://cdn.prod.website-files.com/663a60b91deeae06e8ae1d1c/6ab129528411a28d1a030f66_September_Website_Final.pdf"}],"need":null,"ev":"cited","shared":"Artificial Intelligence"},{"id":"deadlines","name":"Give federal energy project reviews a decision deadline","x":64,"y":82,"stance":"Back","why":"The practical measure is days to permit.","proof":["Federal environmental impact statements must be completed within 2 years and environmental assessments within 1 year, though the lead agency may extend the deadline in consultation with the applicant.","If an agency misses a deadline, the project sponsor can petition a court, which sets a schedule that shall not exceed 90 days unless it finds a longer period is necessary.","60% support a plan to make building energy infrastructure faster and easier, including 71% of voters who backed the Republican ticket in 2024 and 51% of voters who backed the Democratic ticket."],"sources":[{"t":"42 U.S.C. 4336a(g)","u":"https://www.law.cornell.edu/uscode/text/42/4336a"},{"t":"Inclusive Abundance / Blue Rose Research, likely 2026 voters (about 20,000), May 13–23, 2026","u":"https://www.inclusiveabundance.org/abundance-in-action/new-polling-voters-across-party-lines-support-permitting-reform"}],"need":"Days to permit by state.","ev":"cited"},{"id":"nepa","name":"Put an end date on federal and state environmental reviews","x":44,"y":83,"stance":"Back","why":"Federal review is set in federal law, which makes the change harder.","proof":["42 U.S.C. 4336a(g): federal law sets a 2-year deadline for environmental impact statements and a 1-year deadline for environmental assessments, which the lead agency may extend in consultation with the applicant.","42 U.S.C. 4336a(g): if an agency misses a deadline, a project sponsor may ask a court to set a schedule, which shall not exceed 90 days unless the court finds a longer period is necessary.","Data for Progress, March 13 to 15, 2026, as reported by The States Forum (which proposed the policies tested): 73% of 1,259 likely voters support a two-year maximum time limit for decisions on permitting major energy projects.","Data for Progress (progressive polling group), May 22 to 24, 2025: 73% of 1,171 U.S. likely voters support requiring federal agencies to study and report the environmental impacts of actions they propose and 19% oppose, but Americans are split on the word reform, with 52% saying reforming NEPA will have mostly negative impacts and 35% mostly positive.","Heatmap News and Embold Research, August 3 to 16, 2024: 52% of 5,202 adults back the general idea of a bipartisan permitting reform law, about a quarter oppose and about a quarter are not sure.","Inclusive Abundance Initiative (an advocacy group) with Blue Rose Research, May 13 to 23, 2026: 60% of likely 2026 voters support a plan for faster energy permitting. That question is about speed, not a named repeal of a state environmental law."],"sources":[{"t":"National Agricultural Law Center, state mini-NEPA laws","u":"https://nationalaglawcenter.org/state-compilations/state-mini-nepa-laws/"},{"t":"42 U.S.C. 4336a(g)","u":"https://www.law.cornell.edu/uscode/text/42/4336a"},{"t":"Inclusive Abundance / Blue Rose Research, likely 2026 voters (about 20,000), May 13–23, 2026","u":"https://www.inclusiveabundance.org/abundance-in-action/new-polling-voters-across-party-lines-support-permitting-reform"},{"t":"The States Forum, Let States Build More Power (reports Data for Progress poll of March 13–15, 2026), April 13, 2026","u":"https://www.statesforum.org/brief/let-states-build-more-power/"},{"t":"Data for Progress, NEPA and permitting reform poll, May 22–24, 2025 (1,171 U.S. likely voters)","u":"https://www.dataforprogress.org/blog/2025/5/28/voters-support-nepa-oppose-congress-proposed-pay-to-play-amendment"},{"t":"Data for Progress, NEPA poll crosstabs, May 22–24, 2025","u":"https://www.filesforprogress.org/datasets/2025/5/dfp_nepa_permitting_reform.pdf"},{"t":"Heatmap News, Americans say 'Okay, whatever' to permitting reform, August 29, 2024 (Embold Research, August 3–16, 2024; 5,202 adults)","u":"https://heatmap.news/politics/permitting-reform-survey"}],"need":"The count and deadlines of state laws that copy the federal environmental review law, and the status of any federal bill.","ev":"cited"},{"id":"discretion","name":"Approve projects that meet a written checklist","x":44,"y":75,"stance":"Back","why":"","proof":["Virginia Code 10.1-1197.6 and 9VAC15-60: Virginia approves small solar projects of 150 MW or less through a permit by rule, which sets a written list of required filings and studies. This is one state, not a national count.","Data for Progress, March 13 to 15, 2026, as reported by The States Forum (which proposed the policies tested): 66% of likely voters support creating a single statewide office to review and approve large energy projects instead of requiring multiple approvers. This is the nearest item, not a question on checklist approval."],"sources":[{"t":"Virginia Code section 10.1-1197.6 (small renewable energy projects, permit by rule)","u":"https://law.lis.virginia.gov/vacode/title10.1/chapter11.1/section10.1-1197.6/"},{"t":"Virginia Administrative Code 9VAC15-60, small renewable energy projects (solar) permit by rule","u":"https://law.lis.virginia.gov/admincodefull/title9/agency15/chapter60/partI/"},{"t":"The States Forum, Let States Build More Power (reports Data for Progress poll of March 13–15, 2026), April 13, 2026","u":"https://www.statesforum.org/brief/let-states-build-more-power/"}],"need":"A national count of states that approve projects by checklist.","ev":"indirect"},{"id":"rps","name":"Repeal the renewable-energy quota","x":31,"y":72,"stance":"Back","why":"The quota is the state requirement that utilities buy a set share of power from renewable sources.","proof":["Lawrence Berkeley National Laboratory, June 2026 (data current as of April 2026): 27 states plus the District of Columbia have a mandatory renewable portfolio standard, and Arizona repealed its standard in a bill enacted since January 2025.","NCSL, page dated August 2021: Montana repealed its standard in 2021 and West Virginia in 2015.","Yale Program on Climate Change Communication and George Mason University, April 17 to 26, 2026: 65% of registered voters support requiring utilities in their state to produce 100% of their electricity from clean, renewable sources by 2050, so a repeal would run against majority opinion. Conservative Republicans are at 31%.","Pew Research Center, March 16 to 22, 2026: 57% of adults say expanding wind and solar should be the priority for America's energy supply and 42% say expanding oil, coal and natural gas, down from 79% for wind and solar in 2020. 71% of Republicans put oil, coal and natural gas first."],"sources":[{"t":"Lawrence Berkeley National Laboratory, state electricity resource standards data update, June 2026","u":"https://eta-publications.lbl.gov/sites/default/files/2026-06/state_electricity_resource_standards-2026_data_update.pdf"},{"t":"NCSL, state renewable portfolio standards and goals (page dated August 2021)","u":"https://www.ncsl.org/energy/state-renewable-portfolio-standards-and-goals"},{"t":"Pew Research Center, energy report, survey March 16–22, 2026 (published April 7, 2026)","u":"https://www.pewresearch.org/wp-content/uploads/sites/20/2026/04/PS_26.04.07_energy_report.pdf"},{"t":"Yale Program on Climate Change Communication and George Mason University, Climate Change in the American Mind: Politics and Policy, spring 2026 (April 17–26, 2026; 930 registered voters)","u":"https://climatecommunication.yale.edu/app/uploads/2026/06/climate-change-american-mind-politics-policy-spring-2026.pdf"}],"need":"Current status of the Montana and West Virginia repeals. The source is a 2021 NCSL page.","ev":"cited"},{"id":"rofr","name":"Let any company bid to build new power lines, not only the local utility","x":20,"y":8,"stance":"Back","why":"Federal rules already require removing the federal right of first refusal for regionally planned lines, and allow but do not require competitive bidding.","proof":["FERC Order 1000 requires removing a federal right of first refusal from FERC-approved tariffs only for facilities selected in a regional plan for cost allocation.","FERC Order 1000 allows but does not require competitive bidding, and it does not affect state or local laws on building transmission, including siting and permitting.","NCSL, updated December 9, 2024: 12 states have right of first refusal laws for electric transmission.","MISO, notice posted January 28, 2026: the notice lists Iowa's statute as void from the start and Texas's statute as ruled unconstitutional by a federal court in the Western District of Texas."],"sources":[{"t":"FERC, Order No. 1000 (transmission planning and cost allocation)","u":"https://cms.ferc.gov/electric-transmission/order-no-1000-transmission-planning-and-cost-allocation"},{"t":"NCSL, right of first refusal for electric transmission (updated December 9, 2024)","u":"https://www.ncsl.org/energy/right-of-first-refusal-for-electric-transmission"},{"t":"MISO, state or local rights of first refusal notice (posted January 28, 2026)","u":"https://cdn.misoenergy.org/State%20or%20Local%20Rights%20of%20First%20Refusal514796.pdf"}],"need":"The current status of the Alabama, Montana, Nebraska and Oklahoma laws.","ev":"cited"},{"id":"nuclear-new","name":"Allow nuclear plants on new sites","x":26,"y":79,"stance":"Back","why":"State law is one barrier. Federal NRC licensing is another.","proof":["10 states restrict new nuclear construction. Illinois, West Virginia and Montana repealed their restrictions, and New Jersey eased its own.","The NRC issued an early site permit for Clinch River (ESP-006) on December 19, 2019.","59% favor more nuclear plants, up from 43% in 2020 (Pew, April 28–May 4, 2025, n=5,085). 61% favor the use of nuclear energy (Gallup, March 3–16, 2025, n=1,002).","53% oppose and 45% favor a nuclear plant in their area (Gallup, March 2–18, 2026, n=1,000)."],"sources":[{"t":"NCSL, states' restrictions on new nuclear power facility construction, updated April 16, 2026","u":"https://www.ncsl.org/environment-and-natural-resources/states-restrictions-on-new-nuclear-power-facility-construction"},{"t":"NRC, Clinch River early site permit (ESP-006), December 19, 2019","u":"https://www.nrc.gov/reactors/new-reactors/large-lwr/esp/clinch-river"},{"t":"Pew Research Center, April 28–May 4, 2025","u":"https://www.pewresearch.org/short-reads/2025/10/16/support-for-expanding-nuclear-power-is-up-in-both-parties-since-2020/"},{"t":"Gallup, March 3–16, 2025","u":"https://news.gallup.com/poll/659180/nuclear-energy-support-near-record-high.aspx"},{"t":"Gallup, March 2–18, 2026","u":"https://news.gallup.com/poll/708620/less-support-solar-wind-energy-nuclear.aspx"}],"need":"Licensing path. Current state bans.","ev":"cited"},{"id":"nuclear-existing","name":"Renew licenses at existing nuclear plants","x":74,"y":74,"stance":"Back","why":"Renewals are easier than new sites.","proof":["13 subsequent (second) license renewals are complete and 3 are under review.","87% support renewing a license at a plant that is operating and still meets federal safety rules.","64% agree we should definitely build more nuclear power plants in the future."],"sources":[{"t":"NRC, subsequent license renewal status, page updated September 15, 2026","u":"https://www.nrc.gov/reactors/operating/licensing/renewal/subsequent-license-renewal"},{"t":"Bisconti Research, 2025 National Nuclear Energy Public Opinion Survey (online panel of about 1,000 adults, May 28–June 8, 2025)","u":"https://www.bisconti.com/blog/public-opinion-2025"}],"need":"Plants up for renewal.","ev":"cited"},{"id":"btm","name":"Let big new power users bring their own power source on site","x":42,"y":67,"stance":"Back","why":"","proof":["FERC, June 18, 2026: FERC issued show-cause orders to six regional grid operators, with 60 days to respond, that include accommodating co-location agreements and behind-the-meter generation. The orders concern large loads, which is narrower than this dot.","Inclusive Abundance Initiative (an advocacy group) with Blue Rose Research, May 13 to 23, 2026: 60% of likely 2026 voters support a plan to make building energy infrastructure faster and easier. That is the nearest number, not a behind-the-meter question."],"sources":[{"t":"FERC, large load integration news release, June 18, 2026","u":"https://ferc.gov/news-events/news/ferc-launches-aggressive-targeted-action-speed-large-load-integration"},{"t":"Inclusive Abundance / Blue Rose Research, likely 2026 voters (about 20,000), May 13–23, 2026","u":"https://www.inclusiveabundance.org/abundance-in-action/new-polling-voters-across-party-lines-support-permitting-reform"}],"need":"How the grid operators will respond to the FERC orders.","ev":"indirect"},{"id":"threshold","name":"Skip full review for small projects","x":44,"y":59,"stance":"Back","why":"","proof":["42 U.S.C. 4336e and 4336: federal law lets agencies establish categorical exclusions, classes of actions that normally do not significantly affect the environment and so skip a full environmental review.","Virginia 9VAC15-60-130: a small solar project of 1 MW or less, or on 2 acres or less, needs no notification, and projects of 150 MW or less use a permit by rule.","Regulatory Assistance Project, Laws in Order, June 2024: 27 of 51 jurisdictions (50 states and the District of Columbia) have a state siting authority that depends on project size."],"sources":[{"t":"42 U.S.C. 4336e (categorical exclusions)","u":"https://www.law.cornell.edu/uscode/text/42/4336e"},{"t":"42 U.S.C. 4336 (determination of level of review)","u":"https://www.law.cornell.edu/uscode/text/42/4336"},{"t":"Virginia Administrative Code 9VAC15-60-130","u":"https://law.lis.virginia.gov/admincode/title9/agency15/chapter60/section130/"},{"t":"Regulatory Assistance Project, Laws in Order: 50-state review of energy siting authority (Enterline and Valainis), June 2024","u":"https://tethys.pnnl.gov/sites/default/files/publications/Enterline_and_Valainis_2024.pdf"}],"need":"No current count of how often exclusions are used was verified.","ev":"cited"},{"id":"backyard","name":"Let households install their own solar","x":62,"y":56,"stance":"Back","why":"","proof":["Yale Program on Climate Change Communication and George Mason University, April 17 to 26, 2026: 89% of registered voters support state laws that let residents install small plug-in solar panels on a balcony or in a backyard, including 93% of Democrats and 85% of Republicans. The question is about small plug-in panels, not every rooftop system.","Florida Statutes 2024, section 163.04: Florida law bars local ordinances and deed restrictions from prohibiting solar collectors. It does not address a utility veto.","DSIRE (NC Clean Energy Technology Center), as of November 2023: 44 states plus the District of Columbia have solar access or easement laws."],"sources":[{"t":"Florida Statutes 2024, section 163.04","u":"https://www.flsenate.gov/Laws/Statutes/2024/0163.04"},{"t":"Yale Program on Climate Change Communication and George Mason University, Climate Change in the American Mind: Politics and Policy, spring 2026 (April 17–26, 2026; 930 registered voters)","u":"https://climatecommunication.yale.edu/app/uploads/2026/06/climate-change-american-mind-politics-policy-spring-2026.pdf"},{"t":"NC Clean Energy Technology Center, DSIRE updates detailed summary maps, December 18, 2023","u":"https://nccleantech.ncsu.edu/2023/12/18/dsire-updates-detailed-summary-maps/"}],"need":null,"ev":"cited"}],"cultural":[{"id":"profit","name":"Belief that utility profit is a major reason bills rose","x":64,"y":80,"stance":"Answer","why":"This belief is hard to move.","proof":["Among adults whose costs rose, 64% say utility companies wanting more money is a major reason (21% minor, 5% not a reason)."],"sources":[{"t":"Pew Research Center, March 16–22, 2026 (short read published May 6, 2026)","u":"https://www.pewresearch.org/short-reads/2026/05/06/many-americans-hold-utility-companies-responsible-for-their-rising-home-energy-bills/"}],"need":null,"ev":"cited"},{"id":"one-fuel","name":"Americans are mixed on whether wind and solar cost consumers more or less than other energy sources","x":30,"y":29,"stance":"Watch","why":"No answer reaches 40 percent, and the largest group for wind says about the same. The cited poll shows a split by party.","proof":["Among all adults, 37% say solar costs consumers less and 30% more; 34% say wind costs less and 28% more.","Republicans are more likely to say each costs more (solar 43%, wind 44%), Democrats to say each costs less (48%).","About the same: 31% for solar, 35% for wind."],"sources":[{"t":"Pew Research Center, energy report, survey March 16–22, 2026 (published April 7, 2026)","u":"https://www.pewresearch.org/wp-content/uploads/sites/20/2026/04/PS_26.04.07_energy_report.pdf"}],"need":null,"ev":"cited"},{"id":"home","name":"Belief that using more power at home is why bills rose","x":13,"y":14,"stance":"Watch","why":"A minority view in the cited poll.","proof":["13% say using more energy in their home is a major reason bills rose, 34% a minor reason and 46% not a reason."],"sources":[{"t":"Pew Research Center, March 16–22, 2026 (short read published May 6, 2026)","u":"https://www.pewresearch.org/short-reads/2026/05/06/many-americans-hold-utility-companies-responsible-for-their-rising-home-energy-bills/"}],"need":null,"ev":"cited"},{"id":"e1","name":"Keeping consumer costs low is a very important consideration in climate policy","x":59,"y":87,"stance":"Claim","why":"The cited poll shows 59% rate this very important, below the 67% who rate protecting the environment very important.","proof":["59% say keeping consumer costs low is a very important consideration in policies to address climate change; 67% of Republicans."],"sources":[{"t":"Pew Research Center, survey October 21–27, 2024 (n=9,593), published December 9, 2024","u":"https://www.pewresearch.org/science/2024/12/09/how-americans-view-climate-change-and-policies-to-address-the-issue/"}],"need":null,"ev":"cited"},{"id":"e2","name":"Use an all-of-the-above mix to keep power affordable and reliable","x":68,"y":82,"stance":"Claim","why":"The cited poll shows a majority.","proof":["68% support an all-of-the-above energy approach to keep electricity affordable and reliable when it is explained (likely voters, about 20,000, May 13–23, 2026).","44% had never heard the phrase."],"sources":[{"t":"Inclusive Abundance / Blue Rose Research, likely 2026 voters (about 20,000), May 13–23, 2026","u":"https://www.inclusiveabundance.org/abundance-in-action/new-polling-voters-across-party-lines-support-permitting-reform"}],"need":null,"ev":"cited"},{"id":"e3","name":"The country should build more nuclear plants","x":59,"y":74,"stance":"Claim","why":"The Pew and Gallup favor questions show majorities, while Gallup finds 53% oppose a plant in their own area. Power that runs on demand and emits little carbon lowers the cost of a clean grid. MIT researchers (Joule, 2018) found that adding firm low-carbon resources such as nuclear cut the cost of a zero-carbon grid by 10% to 62% across nearly 1,000 scenarios, and the U.S. Department of Energy (September 2024) projects about $60 to $100 per MWh for a repeat reactor design if construction costs fall and tax credits apply.","proof":["59% favor more nuclear plants, up from 43% in 2020 (Pew, April 28–May 4, 2025, n=5,085).","61% favor the use of nuclear energy (Gallup, March 3–16, 2025, n=1,002). That is a different question.","In 2026, 46% of Gallup respondents want more emphasis on nuclear and 53% oppose a plant in their area.","Georgia Public Service Commission, Vogtle prudence filing, 2023: Georgia Power expected $10.188 billion in construction and capital cost for Vogtle units 3 and 4 against a certified cost of $6.11 billion. The commission limited recovery from customers to $7.562 billion, and the total rate impact on Georgia Power retail customers is about 10%, of which about 5% was already in rates.","Utility Dive, August 4, 2017: the V.C. Summer expansion in South Carolina was abandoned on July 31, 2017 with no reactor built, and customers of its main owner faced an 18% rate impact against 5% then for Georgia Power customers. The owner's share was first estimated at $6.3 billion in March 2009.","U.S. Energy Information Administration, April 2025 (new plants entering service in 2030, 2024 dollars, simple average, including tax credits under law as of December 2024): advanced nuclear costs $81.45 per MWh against $64.55 for combined-cycle gas, $31.86 for solar and $29.58 for onshore wind.","Lazard, June 2025 (unsubsidized, a financial advisory firm): new U.S. nuclear costs $141 to $220 per MWh against $48 to $109 for gas combined cycle and $37 to $86 for onshore wind."],"sources":[{"t":"Pew Research Center, April 28–May 4, 2025","u":"https://www.pewresearch.org/short-reads/2025/10/16/support-for-expanding-nuclear-power-is-up-in-both-parties-since-2020/"},{"t":"Gallup, March 3–16, 2025","u":"https://news.gallup.com/poll/659180/nuclear-energy-support-near-record-high.aspx"},{"t":"Gallup, March 2–18, 2026","u":"https://news.gallup.com/poll/708620/less-support-solar-wind-energy-nuclear.aspx"},{"t":"MIT Energy Initiative, Study: Adding power choices reduces cost and risk of carbon-free electricity (summary of Sepulveda, Jenkins, de Sisternes and Lester, Joule, 2018), September 6, 2018","u":"https://energy.mit.edu/news/study-adding-power-choices-reduces-cost-and-risk-of-carbon-free-electricity/"},{"t":"U.S. Department of Energy, Pathways to Commercial Liftoff: Advanced Nuclear, September 2024 update (copy hosted by Idaho National Laboratory)","u":"https://gain.inl.gov/content/uploads/4/2024/11/DOE-Advanced-Nuclear-Liftoff-Report.pdf"},{"t":"Georgia Public Service Commission, Georgia Power Vogtle Units 3 and 4 prudence filing, 2023","u":"https://services.psc.ga.gov/api/v1/External/Public/Get/Document/DownloadFile/205572/86912"},{"t":"Utility Dive, Death of a nuke build: Summer abandonment leaves ratepayers holding the bag, August 4, 2017","u":"https://www.utilitydive.com/news/death-of-a-nuke-build-summer-abandonment-leaves-ratepayers-holding-the-bag/448597/"},{"t":"U.S. Energy Information Administration, Levelized Costs of New Generation Resources in the Annual Energy Outlook 2025, April 2025","u":"https://www.eia.gov/outlooks/aeo/electricity_generation/pdf/AEO2025_LCOE_report.pdf"},{"t":"Lazard, Levelized Cost of Energy+, June 2025","u":"https://www.lazard.com/media/uounhon4/lazards-lcoeplus-june-2025.pdf"}],"need":null,"ev":"cited"}]},{"id":"healthcare","name":"Healthcare","practical":[{"id":"cash-price","name":"Let patients pay a hospital's posted cash price","x":62,"y":50,"stance":"Back","why":"The national figure uses prices hospitals posted by September 2022. The Texas figure is from November 2025.","proof":["Health Affairs, April 2023 (Johns Hopkins University; 2,379 hospitals, 70 shoppable services, prices posted as of September 9, 2022): on average a hospital's cash price was 64% of its chargemaster price and its commercial negotiated rate was 58%. The cash price was lower than the median commercial negotiated rate in 47% of cases.","Trilliant Health, November 26, 2025 (327 Texas hospitals): the median cash price for a diagnostic colonoscopy was $1,554 against a median negotiated rate of $2,275, which is 32% lower. For a sleep study the median cash price was $4,644 against a negotiated median of $1,473.","Trilliant Health, November 2025: cash prices were lower than negotiated rates for four of the five services studied. About 50% of hospital admissions begin in the emergency department, where cash prices are effectively irrelevant to patients.","Health Affairs, April 2023: the study received grant support from Arnold Ventures and PatientRightsAdvocate.org."],"sources":[{"t":"Health Affairs, Wang, Meiselbach, Cox, Anderson and Bai (Johns Hopkins University), The Relationships Among Cash Prices, Negotiated Rates, And Chargemaster Prices For Shoppable Hospital Services, vol. 42 no. 4, April 2023 (author-hosted copy)","u":"https://yangwanghealthecon.github.io/assets/publications/2023_The%20Relationships%20Among%20Cash%20Prices,%20Negotiated%20Rates,%20And%20Chargemaster%20Prices%20For%20Shoppable%20Hospital%20Services.pdf"},{"t":"Trilliant Health (healthcare data and analytics company), Cash Rates Are Often Lower Than Negotiated Rates for Common Hospital Services, November 26, 2025","u":"https://www.trillianthealth.com/market-research/studies/cash-rates-often-lower-than-negotiated-rates-common-hospital-services"}],"need":"A national comparison of cash prices and negotiated rates newer than September 2022. Whether a cash payment counts toward a deductible.","ev":"cited"},{"id":"con","name":"Let new clinics and surgery centers open without a state need review","x":40,"y":35,"stance":"Back","why":"The cited count is from January 2025. The spending estimate is from a conference poster that has not been peer reviewed.","proof":["National Conference of State Legislatures, April 29, 2025 (laws as of January 2025): 35 states and Washington, D.C. operate certificate of need programs that must approve new health care facilities or added services, and 12 states had repealed their programs or let them expire as of January 1, 2024.","Southern Economic Journal, 2025: repeal of a state's ambulatory surgery center certificate of need law raised surgery centers per person by 44% to 47% statewide and by 92% to 112% in rural areas, and the authors found no evidence of more rural hospital closures.","Bailey and Shakya, poster in the 2026 American Economic Association conference program (not peer reviewed): repeal of certificate of need laws lowered health spending by about 1 percentage point of GDP, 7.6%. For the 35 states with the laws, they put the drop at $123 billion."],"sources":[{"t":"National Conference of State Legislatures, Certificate of Need State Laws, updated April 29, 2025 (laws as of January 2025)","u":"https://www.ncsl.org/health/certificate-of-need-state-laws"},{"t":"Southern Economic Journal, Stratmann, Bjoerkheim and Koopman, The causal effect of repealing Certificate-of-Need laws for ambulatory surgical centers: Does access to medical services increase? vol. 92 no. 1, 2025","u":"https://ideas.repec.org/a/wly/soecon/v92y2025i1p63-86.html"},{"t":"Bailey (Providence College) and Shakya (Appalachian State University), The Impact of Repealing Certificate of Need Laws on Healthcare Spending: A Causal Analysis, poster in the 2026 American Economic Association conference program","u":"https://www.aeaweb.org/conference/2026/program/paper/D3tfAD8n"}],"need":"A peer-reviewed estimate of the price effect of repeal. The 2026 state count, since the state count in the sources is from January 2025.","ev":"indirect"},{"id":"posted-prices","name":"Let patients see and use a hospital's prices to shop","x":70,"y":45,"stance":"Back","why":"The cited figures come from an advocacy group's review of 2,000 hospitals in August 2026. The lever works only if hospitals must post prices, which is a requirement on sellers, and the cited working paper found the effect on prices paid by insured patients was limited.","proof":["PatientRightsAdvocate.org (patient advocacy group), Eighth Hospital Price Transparency Compliance
