Report, September 2026 (2,000 hospitals reviewed in August 2026): 988 hospitals, 49.4%, were fully compliant with the federal price posting rule, up from 21.1% in November 2024, 36.1% in July 2023 and 5.6% in July 2021 (500 hospitals).","PatientRightsAdvocate.org, September 2026: 360 hospitals, 18.0%, posted dollar-and-cents prices for at least half of their items and services, and 194 hospitals, 10%, were both fully compliant and met that standard. 459 hospitals, 23.0%, posted algorithms that did not give enough information to calculate a price.","PatientRightsAdvocate.org, September 2026: 98.9% of hospitals (1,978 of 2,000) showed 300 shoppable services in a display or a price estimator, and 85% of one large chain's hospitals were fully compliant while none of its hospitals met the dollar-and-cents standard.","Healthcare Dive, September 11, 2026: the federal agency that runs Medicare has fined 28 hospitals for not posting prices, up from 15 in November 2024.","Christensen, Floyd and Maffett (working paper draft): state price transparency laws cut the charge prices of common elective procedures by about 5%, and the effect on prices paid by insured patients was limited to the small share of patients with the greatest incentive to consider cost."],"sources":[{"t":"PatientRightsAdvocate.org, Eighth Hospital Price Transparency Compliance Report summary page, September 2026","u":"https://www.patientrightsadvocate.org/eighth-report-toolkit"},{"t":"PatientRightsAdvocate.org (patient advocacy group), Eighth Hospital Price Transparency Compliance Report, September 2026 (2,000 hospitals; copy hosted by Searchlight New Mexico)","u":"https://searchlightnm.org/wp-content/uploads/2026/09/6ab1b14f66f80.pdf.pdf"},{"t":"Healthcare Dive, More than half of hospitals still not fully compliant with price transparency rules, September 11, 2026","u":"https://www.healthcaredive.com/news/hospital-compliance-price-transparency-regulations-pra-report/830087/"},{"t":"Christensen, Floyd and Maffett (University of Chicago and Rice University), The Effects of Price Transparency Regulation on Prices in the Healthcare Industry, working paper draft hosted by the Baker Institute at Rice University (undated)","u":"https://www.bakerinstitute.org/sites/default/files/2023-02/HPF-paper-AHEC-Floyd.pdf"}],"need":"A sourced measure of lower prices paid by patients after hospitals post usable prices. A review of the same hospitals by a group that does not advocate for the rule.","ev":"cited"}],"structural":[{"id":"supply","name":"Let more clinics open by ending certificate-of-need laws","x":30,"y":68,"stance":"Back","why":"","proof":["NCSL, updated April 29, 2025: 35 states and the District of Columbia have certificate-of-need laws, and 12 states have repealed or let their programs expire.","Cato Institute (think tank), Briefing Paper No. 204, August 11, 2026: of 448 tests with a clear implication, 53% link certificate-of-need laws to worse outcomes such as more spending, less access or lower quality, and 12% to desirable outcomes. States without service-level certificate-of-need rules have about 24% more intensive-care capacity per person.","Harper Polling for Carolina Journal (published by the John Locke Foundation, a think tank), March 22 to 23, 2026, North Carolina state poll: voters are divided on repealing the state's certificate-of-need law, with 42% of 600 likely voters in support, 38% opposed and 20% unsure."],"sources":[{"t":"NCSL, certificate of need state laws (updated April 29, 2025)","u":"https://www.ncsl.org/health/certificate-of-need-state-laws"},{"t":"Cato Institute (think tank), Briefing Paper No. 204, certificate of need, August 11, 2026","u":"https://www.cato.org/briefing-paper/certificate-need-regulation-blocking-greater-access-higher-quality-lower-cost-care"},{"t":"Carolina Journal (John Locke Foundation), CJ poll, first post-primary survey, March 26, 2026 (Harper Polling, 600 likely North Carolina voters)","u":"https://www.carolinajournal.com/cj-poll-cooper-leads-whatley-by-8-points-in-first-post-primary-survey/"}],"need":"Whether 39 states (Cato) or 35 states plus the District of Columbia (NCSL) is the right count of states with certificate-of-need laws.","ev":"cited"},{"id":"transparency","name":"Strengthen price transparency rules so patients can see prices","x":68,"y":76,"stance":"Back","why":"The practical measure is out-of-pocket cost at the visit.","proof":["61% say boosting price transparency rules should be a top priority, including majorities of Democrats and independents and 56% of Republicans.","Christensen, Floyd and Maffett (University of Chicago and Rice University), working paper draft hosted by the Baker Institute at Rice University (undated): state price transparency laws reduce the charge prices of common elective procedures by about 5%, and the effect on prices paid by insured patients is limited to the small share of patients with the greatest incentive to consider cost.","RAND Corporation, Prices Paid to Hospitals by Private Health Plans, Round 5.1: employer and private insurer hospital prices were 254% of Medicare in 2018, 246% in 2020 and 253% in 2022, a period that includes the federal price posting rule.","U.S. Government Accountability Office, GAO-25-106995: from 2021 to 2023 the Centers for Medicare and Medicaid Services reviewed 1,746 hospitals and started 1,287 enforcement actions, and the agency lacks assurance that the posted pricing data are complete and accurate."],"sources":[{"t":"KFF Health Tracking Poll, January 7–14, 2025 (n=1,310)","u":"https://www.kff.org/public-opinion/kff-health-tracking-poll-public-weighs-health-care-spending-and-other-priorities-for-incoming-administration/"},{"t":"Christensen, Floyd and Maffett, The Effects of Price Transparency Regulation on Prices in the Healthcare Industry (working paper draft, Baker Institute, Rice University)","u":"https://www.bakerinstitute.org/sites/default/files/2023-02/HPF-paper-AHEC-Floyd.pdf"},{"t":"RAND Corporation, Prices Paid to Hospitals by Private Health Plans: Findings from Round 5.1 of an Employer-Led Transparency Initiative","u":"https://www.rand.org/pubs/research_reports/RRA1144-2-v2.html"},{"t":"U.S. Government Accountability Office, Health Care Transparency: CMS Needs More Information on Hospital Pricing Data Completeness and Accuracy, GAO-25-106995","u":"https://files.gao.gov/reports/GAO-25-106995/index.html"}],"need":"Posting-rule status by state. Price compliance rate.","ev":"cited"},{"id":"prior-auth","name":"Set rules on insurance denials and prior authorization","x":60,"y":42,"stance":"Watch","why":"The direction of the rule is undecided.","proof":["55% call denial rules a top priority when asked that way.","Only 22% of insured adults pick ending prior authorization as the change they want most.","National Bureau of Economic Research, Working Paper 30878, January 2023 (Brot-Goldberg, Burn, Layton and Vabson): among Medicare Part D low-income enrollees randomly assigned to default plans, prior authorization cut use of the restricted drug by 26.8% and drug spending by $96 per beneficiary-year (3.6%), at about $10 of paperwork cost.","Centers for Medicare and Medicaid Services, final rule CMS-0057-F, January 2024: streamlining prior authorization is estimated to save about $15 billion over ten years, mainly by cutting administrative burden for providers and payers.","KFF, 2024 Medicare Advantage data: insurers made nearly 53 million prior authorization determinations and denied 4.1 million in full or in part (7.7%, up from 6.4% in 2023). Of denials, 11.5% were appealed and 80.7% of appeals were partly or fully overturned."],"sources":[{"t":"KFF Health Tracking Poll, January 7–14, 2025 (n=1,310)","u":"https://www.kff.org/public-opinion/kff-health-tracking-poll-public-weighs-health-care-spending-and-other-priorities-for-incoming-administration/"},{"t":"KFF Health Tracking Poll, April 14–19, 2026 (published April 29, 2026)","u":"https://www.kff.org/public-opinion/kff-health-tracking-poll-health-care-costs-and-the-midterms/"},{"t":"National Bureau of Economic Research, Rationing Medicine Through Bureaucracy: Authorization Restrictions in Medicare, Working Paper 30878, January 2023","u":"https://www.nber.org/system/files/working_papers/w30878/w30878.pdf"},{"t":"Centers for Medicare and Medicaid Services, press release on the interoperability and prior authorization final rule (CMS-0057-F), January 2024","u":"https://www.cms.gov/newsroom/press-releases/cms-finalizes-rule-expand-access-health-information-improve-prior-authorization-process"},{"t":"KFF, Medicare Advantage Insurers Made Nearly 53 Million Prior Authorization Determinations in 2024","u":"https://www.kff.org/medicare/medicare-advantage-insurers-made-nearly-53-million-prior-authorization-determinations-in-2024/"}],"need":"Bill status.","ev":"cited"}],"cultural":[{"id":"afford","name":"Paying for health care is a top money worry","x":64,"y":82,"stance":"Watch","why":"The cited poll shows majority worry about being able to afford health care costs.","proof":["64% are at least somewhat worried about being able to afford health care costs, including the cost of health insurance and out-of-pocket costs such as for office visits and prescription drugs.","30% are very worried.","46% of insured adults pick paying less out-of-pocket as the most important change, against 22% for eliminating prior authorization.","In KFF's June 2026 poll, 62% were somewhat or very worried (27% very, 35% somewhat)."],"sources":[{"t":"KFF Health Tracking Poll, April 14–19, 2026 (published April 29, 2026)","u":"https://www.kff.org/public-opinion/kff-health-tracking-poll-health-care-costs-and-the-midterms/"},{"t":"KFF Health Tracking Poll, June 25–30, 2026 (published July 16, 2026)","u":"https://www.kff.org/public-opinion/kff-health-tracking-poll-public-views-on-fraud-in-government-health-programs/"}],"need":null,"ev":"cited"},{"id":"c1","name":"The goal is a medical bill people can pay","x":64,"y":86,"stance":"Claim","why":"","proof":["64% are at least somewhat worried about being able to afford health care costs.","16% are satisfied with the total cost of health care in the U.S. (Gallup, November 3–25, 2025)."],"sources":[{"t":"KFF Health Tracking Poll, April 14–19, 2026 (published April 29, 2026)","u":"https://www.kff.org/public-opinion/kff-health-tracking-poll-health-care-costs-and-the-midterms/"},{"t":"Gallup, November 3–25, 2025","u":"https://news.gallup.com/poll/4708/healthcare-system.aspx"}],"need":null,"ev":"cited"},{"id":"c2","name":"Making health care prices available to patients should be a top priority for lawmakers","x":61,"y":70,"stance":"Claim","why":"The cited poll shows a majority.","proof":["61% say boosting price transparency rules should be a top priority."],"sources":[{"t":"KFF Health Tracking Poll, January 7–14, 2025 (n=1,310)","u":"https://www.kff.org/public-opinion/kff-health-tracking-poll-public-weighs-health-care-spending-and-other-priorities-for-incoming-administration/"}],"need":null,"ev":"cited"},{"id":"c4","name":"Most people are satisfied with what they pay, not with the nation's health care costs","x":57,"y":34,"stance":"Answer","why":"The cited poll shows a gap between own cost and the country's cost.","proof":["57% are satisfied with their own costs, 16% with the cost of care in the country."],"sources":[{"t":"Gallup, November 3–25, 2025","u":"https://news.gallup.com/poll/4708/healthcare-system.aspx"}],"need":null,"ev":"cited"}]},{"id":"housing","name":"Housing","practical":[{"id":"permit-time","name":"Set a deadline for local decisions on new home permits","x":55,"y":60,"stance":"Back","why":"The cited figures cover standardized projects in 60 cities from 2000 to 2025 and come from a September 2026 working paper.","proof":["D'Amico, Soltas and Wang, working paper, September 2026 (permit records for new housing in 60 U.S. cities, 2000 to 2025): a typical 20-unit apartment building takes on average 4.6 years to complete in Los Angeles, New York and San Francisco and 2 years in Raleigh, Orlando and Phoenix. 30% to 43% of the gap between the slowest and fastest cities is the time to receive a permit.","D'Amico, Soltas and Wang, September 2026: across the 60 cities a permit takes on average 0.7 years for the multifamily building and 0.2 years for a single-family home. The chance a multifamily project is approved within six months fell from 71% in 2000 to 44% in 2025, and the chance a single-family home is approved within two months fell from 88% to 70%.","D'Amico, Soltas and Wang, September 2026: across cities, one more year of permitting time for multifamily housing is associated with a 39% higher median rent. This is an association across cities, not a measured effect of a deadline."],"sources":[{"t":"D'Amico (University of Chicago Booth School of Business), Soltas and Wang (Princeton University), Where Is Housing Slow to Build, And Is It Getting Slower? working paper, September 2026 (one author acknowledges funding from Arnold Ventures)","u":"https://evansoltas.com/papers/Durations_DSW2026.pdf"}],"need":"A measured effect of local permit deadlines on approval time or on rents or prices.","ev":"cited"},{"id":"reg-cost","name":"Cut the permit fees and approval costs built into a new home's price","x":45,"y":72,"stance":"Back","why":"The cited figure is a builder trade group estimate from surveys of 54 land developers and 337 builders in March 2026.","proof":["National Association of Home Builders (trade group for builders), June 8, 2026: government regulation accounts for 26.4% of the final price of a new single-family home built for sale, $131,734 of an average price of $499,500. Of that, $46,975 arises during lot development and $84,939 during construction. The 2021 study put it at $93,870.","National Association of Home Builders, June 8, 2026 (share of the final house price): fees paid by the builder after buying the lot 4.0%, the cost of applying for zoning approval 1.4%, hard costs of compliance such as fees and required studies 2.2%, and the pure cost of delay 0.5% during development and 0.3% during construction.","National Association of Home Builders, June 8, 2026: the figures come from member surveys, 54 usable developer responses from a panel of 2,125 and 337 builder responses, and the study states it does not estimate how much of the regulation is excessive."],"sources":[{"t":"National Association of Home Builders (trade group for builders), Government Regulation in the Price of a New Home: 2026, Special Study for Housing Economics, June 8, 2026","u":"https://www.nahb.org/-/media/NAHB/news-and-economics/docs/housing-economics-plus/special-studies/2026/special-study-government-regulation-in-the-price-of-a-home-june-2026-updated.pdf"}],"need":"An estimate of the same cost shares from a source that is not a builder trade group.","ev":"cited"},{"id":"parking-practical","name":"Drop minimum parking rules for new homes","x":65,"y":50,"stance":"Back","why":"The cost per space figures are for Boston in the fourth quarter of 2025 and for Denver in April 2025.","proof":["Pioneer Institute (think tank), April 15, 2026, citing Cumming Group's fourth quarter 2025 costs for Boston: an above-ground parking space costs $34,000 to $59,000 to build and an underground space $106,000 to $152,000.","Pioneer Institute, April 15, 2026: Pioneer estimates that requiring one parking space per unit instead of two in a mid-market rental building in Boston cuts construction costs by up to 17%. A 2016 UCLA study found the average cost of garage parking equals adding 17% to the rent paid by a typical household.","City and County of Denver, April 2025: a structured parking space costs as much as $50,000, and a 470-unit apartment complex provides 691 parking spaces against 428 required."],"sources":[{"t":"Pioneer Institute (think tank), New Study Calls for Reducing or Eliminating Parking Requirements for New Housing, press release on The Parking Problem by Andrew Mikula, April 15, 2026","u":"https://pioneerinstitute.org/new-study-calls-for-reducing-or-eliminating-parking-requirements-for-new-housing/"},{"t":"City and County of Denver, Modernizing Parking Requirements: Background and Peer Cities Report, April 2025","u":"https://denvergov.org/files/assets/public/v/1/community-planning-and-development/documents/planning/mpr_background-report_revised_04292025.pdf"}],"need":"The Cumming Group cost data and the Pioneer report text, which were not opened. A rent effect newer than 2016.","ev":"cited"}],"structural":[{"id":"subsidy","name":"Subsidize housing instead of allowing more homes","x":14,"y":32,"stance":"Oppose","why":"","proof":["55% choose allowing more housing and 45% government programs and subsidies. By ideology: conservatives 72%, liberals 51%, moderates 47%."],"sources":[{"t":"AEI Housing Center, Zoning and Land Use Flexibility Survey, May 8–14, 2026 (5,245 adults)","u":"https://www.aei.org/wp-content/uploads/2026/06/AEI-Combined-Report-May-2026-Zoning-and-Land-Use-Flexibility-Survey.pdf"}],"need":"Program costs.","ev":"cited"},{"id":"fast-permit","name":"Require a quick, clear decision process for housing permits","x":83,"y":85,"stance":"Back","why":"The practical measure is days to permit.","proof":["86% support and 12% oppose requiring local governments to use a quick and clear process for making decisions about building permits."],"sources":[{"t":"Pew Charitable Trusts, zoning survey toplines, published November 30, 2023","u":"https://www.pew.org/-/media/assets/2023/11/zoning-survey-toplines-and-methods.pdf"}],"need":"Days to permit by city.","ev":"cited"},{"id":"near-jobs","name":"Allow apartments near jobs and transit","x":78,"y":77,"stance":"Back","why":"","proof":["81% support apartments near transit or jobs.","A 2026 re-ask found 80%.","66% of conservatives support more homes near jobs and shops.","Overall, homes near jobs are at 74%."],"sources":[{"t":"Pew Charitable Trusts, zoning survey toplines, published November 30, 2023","u":"https://www.pew.org/-/media/assets/2023/11/zoning-survey-toplines-and-methods.pdf"},{"t":"AEI Housing Center, Zoning and Land Use Flexibility Survey, May 8–14, 2026 (5,245 adults)","u":"https://www.aei.org/wp-content/uploads/2026/06/AEI-Combined-Report-May-2026-Zoning-and-Land-Use-Flexibility-Survey.pdf"}],"need":"Local zoning status.","ev":"cited"},{"id":"adu","name":"Allow a backyard apartment","x":73,"y":70,"stance":"Back","why":"","proof":["72% support a garage or backyard apartment.","73% support converting a basement or attic, in both 2023 and 2026."],"sources":[{"t":"Pew Charitable Trusts, zoning survey toplines, published November 30, 2023","u":"https://www.pew.org/-/media/assets/2023/11/zoning-survey-toplines-and-methods.pdf"},{"t":"AEI Housing Center, Zoning and Land Use Flexibility Survey, May 8–14, 2026 (5,245 adults)","u":"https://www.aei.org/wp-content/uploads/2026/06/AEI-Combined-Report-May-2026-Zoning-and-Land-Use-Flexibility-Survey.pdf"}],"need":"State ADU laws.","ev":"cited"},{"id":"parking","name":"Let the builder decide the parking","x":64,"y":64,"stance":"Back","why":"","proof":["62% supported letting the builder decide the parking in 2023.","A 2026 re-ask found 67%."],"sources":[{"t":"Pew Charitable Trusts, zoning survey toplines, published November 30, 2023","u":"https://www.pew.org/-/media/assets/2023/11/zoning-survey-toplines-and-methods.pdf"},{"t":"AEI Housing Center, Zoning and Land Use Flexibility Survey, May 8–14, 2026 (5,245 adults)","u":"https://www.aei.org/wp-content/uploads/2026/06/AEI-Combined-Report-May-2026-Zoning-and-Land-Use-Flexibility-Survey.pdf"}],"need":"Parking-minimum laws.","ev":"cited"},{"id":"townhouse","name":"Allow townhouses and small apartments on any residential lot","x":44,"y":72,"stance":"Back","why":"This touches the existing block, so it is harder than homes near jobs.","proof":["58% support allowing a townhouse or small multifamily building on a residential lot.","40% of conservatives support small-scale infill in existing single-family neighborhoods, and 35% want more homes there.","Liberals are at 75% and 73% on those two questions."],"sources":[{"t":"Pew Charitable Trusts, zoning survey toplines, published November 30, 2023","u":"https://www.pew.org/-/media/assets/2023/11/zoning-survey-toplines-and-methods.pdf"},{"t":"AEI Housing Center, Zoning and Land Use Flexibility Survey, May 8–14, 2026 (5,245 adults)","u":"https://www.aei.org/wp-content/uploads/2026/06/AEI-Combined-Report-May-2026-Zoning-and-Land-Use-Flexibility-Survey.pdf"}],"need":"State laws.","ev":"cited"},{"id":"small-lots","name":"Allow smaller lots in new neighborhoods","x":59,"y":57,"stance":"Back","why":"","proof":["In 2023, a broader 'smaller lots, houses closer together' question was 49% and did not clear a majority.","In May 2026, smaller lots in new neighborhoods were at 64% overall and 52% among conservatives."],"sources":[{"t":"AEI Housing Center, Zoning and Land Use Flexibility Survey, May 8–14, 2026 (5,245 adults)","u":"https://www.aei.org/wp-content/uploads/2026/06/AEI-Combined-Report-May-2026-Zoning-and-Land-Use-Flexibility-Survey.pdf"},{"t":"Pew Charitable Trusts, zoning survey toplines, published November 30, 2023, on the older wording","u":"https://www.pew.org/-/media/assets/2023/11/zoning-survey-toplines-and-methods.pdf"}],"need":"Lot-size rules.","ev":"cited"}],"cultural":[{"id":"allow","name":"Allowing more homes beats paying subsidies","x":55,"y":92,"stance":"Claim","why":"","proof":["55% overall choose allowing more housing over government programs and subsidies.","72% of conservatives choose allowing more housing over government subsidies.","Liberals are at 51% and moderates at 47% on the same choice."],"sources":[{"t":"AEI Housing Center, Zoning and Land Use Flexibility Survey, May 8–14, 2026 (5,245 adults)","u":"https://www.aei.org/wp-content/uploads/2026/06/AEI-Combined-Report-May-2026-Zoning-and-Land-Use-Flexibility-Survey.pdf"}],"need":null,"ev":"cited"},{"id":"h2","name":"My town needs more starter homes","x":52,"y":75,"stance":"Claim","why":"About half say extremely or very important in the cited poll.","proof":["52% say more affordably priced starter homes are extremely or very important where they live.","81% say at least somewhat important."],"sources":[{"t":"AEI Housing Center, Zoning and Land Use Flexibility Survey, May 8–14, 2026 (5,245 adults)","u":"https://www.aei.org/wp-content/uploads/2026/06/AEI-Combined-Report-May-2026-Zoning-and-Land-Use-Flexibility-Survey.pdf"}],"need":null,"ev":"cited"},{"id":"h3","name":"Houses should be bigger and farther apart","x":55,"y":68,"stance":"Answer","why":"The cited poll shows a majority.","proof":["55% prefer larger houses farther apart, even if stores are miles away.","44% prefer smaller houses closer together."],"sources":[{"t":"Pew Research Center, survey January 20–26, 2026 (n=8,512)","u":"https://www.pewresearch.org/short-reads/2026/03/19/majority-of-americans-prefer-spread-out-communities-with-big-houses/"}],"need":null,"ev":"cited"},{"id":"h4","name":"A family should still be able to buy a house","x":90,"y":76,"stance":"Watch","why":"","proof":["Pew Research Center, May 4 to 17, 2026: 87% of 10,091 U.S. adults say buying a home is harder for young adults today than it was for their parents' generation, 6% say easier and 7% say about the same. In 2021, 70% said harder.","CNBC and SurveyMonkey, May 6 to 11, 2026: 58% of 4,130 U.S. adults say owning a home is needed to feel they have achieved the American Dream.","Gallup, April 1 to 15, 2026: 67% of 1,001 adults say it is a bad time to buy a home, and a new low of 25% of non-owners expect to buy within five years. These measure conditions, not the belief on this dot."],"sources":[{"t":"Pew Research Center, home affordability topline, May 4–17, 2026 (10,091 adults)","u":"https://www.pewresearch.org/wp-content/uploads/sites/20/2026/06/SR_26.06.24_home-affordability_topline.pdf"},{"t":"CNBC, American Dream out of reach survey (SurveyMonkey, May 6–11, 2026; 4,130 adults), June 9, 2026","u":"https://www.cnbc.com/2026/06/09/american-dream-out-of-reach-most-people-right-now-cnbc-survey.html"},{"t":"Gallup, survey April 1–15, 2026 (n=1,001), reported April 29, 2026","u":"https://news.gallup.com/poll/708995/homebuying-intentions-decline-further.aspx"}],"need":null,"ev":"indirect"}]},{"id":"social-security","name":"Social Security","practical":[{"id":"claim-age","name":"Let workers choose when to start Social Security and see what each year of waiting adds","x":70,"y":55,"stance":"Back","why":"The cited figures are SSA's schedule for workers born in 1960 or later and the August 2026 average benefit, not a forecast for any one worker. The choice already exists in law, and the figures are benefit rates, not a lower price or cost to a household.","proof":["SSA Office of the Chief Actuary, Early or Delayed Retirement table (accessed October 3, 2026): for workers born in 1960 or later, full retirement age is 67 and the monthly benefit is 70% of the full amount at 62, 80% at 64, 100% at 67 and 124% at 70, a credit of 8% for each year of delay.","SSA, Monthly Statistical Snapshot, August 2026: the average retired-worker benefit is $2,087.52 a month, across 54,947 thousand retired workers. Eight percent of $2,087.52 is $167.00 a month (our arithmetic, not an SSA figure)."],"sources":[{"t":"SSA Office of the Chief Actuary, Early or Delayed Retirement table (accessed October 3, 2026)","u":"https://www.ssa.gov/oact/ProgData/ar_drc.html"},{"t":"SSA, Monthly Statistical Snapshot, August 2026 (released September 2026)","u":"https://www.ssa.gov/policy/docs/quickfacts/stat_snapshot/"}],"need":"A sourced link between claiming-age choice and a lower cost to a household. SSA data on the share of workers who start at 62 and at 70 (not opened).","ev":"cited"},{"id":"cola-index","name":"Change the price index that sets the yearly Social Security COLA","x":40,"y":50,"stance":"Watch","why":"The 2026 COLA was 2.8%, set by the CPI-W, and added $56 a month for the average retired worker. The figures here are averages from SSA and CRS, not a forecast for any one person. The best argument on the other side is different for each direction. For a chained index: BLS says the CPI-W overstates inflation, and SSA estimates a chained CPI-W closes 0.65 percent of payroll, 15%, of the 4.42 percent of payroll shortfall. Against the CPI-E: BLS calls the R-CPI-E experimental, and SSA estimates the CPI-E adds 0.33 percent of payroll to the shortfall.","proof":["Social Security Administration, 2026 COLA Fact Sheet: the 2026 COLA is 2.8%, based on the CPI-W from the third quarter of 2024 to the third quarter of 2025. The average retired worker's benefit goes from $2,015 to $2,071 a month, a rise of $56.","Congressional Research Service, In Focus IF12675, updated May 27, 2026: the December 2025 COLA under the BLS research index for the elderly (R-CPI-E) would have been 3.0% instead of 2.8%, and the average retired worker's benefit would have been $2,075, which is $4 more a month. BLS cautions that the R-CPI-E is experimental. The CPI-W covers about 30% of the population, urban wage earners and clerical workers who are employed.","SSA Office of the Chief Actuary, Summary of Provisions (2026 Trustees Report baseline): a chained CPI-W would lower the annual COLA by about 0.3 percentage points on average and the CPI-E would raise it by about 0.15 points. Over 10 years that is about 3% less or about 1.5% more on a benefit of $2,071, which is $62 less or $31 more a month (our arithmetic, a simple sum without compounding, not an SSA figure).","Congressional Research Service, report R43363, October 15, 2015 (older source): BLS says the CPI-W overstates inflation because shoppers switch items. Against the current formula, a chained index lowers benefits by 0.9% at 65, 3.7% at 75 and 6.5% at 85, and the CPI-E raises them by 0.6%, 2.6% and 4.6%."],"sources":[{"t":"Social Security Administration, 2026 Cost-of-Living Adjustment Fact Sheet (accessed October 3, 2026)","u":"https://www.ssa.gov/news/en/cola/factsheets/2026.html"},{"t":"Congressional Research Service, A Hypothetical Social Security Cost-of-Living Adjustment Based on the Research Consumer Price Index for the Elderly, In Focus IF12675, updated May 27, 2026","u":"https://www.congress.gov/crs_external_products/IF/PDF/IF12675/IF12675.4.pdf"},{"t":"Social Security Administration, Office of the Chief Actuary, Summary of Provisions That Would Change the Social Security Program, estimates on the 2026 Trustees Report intermediate assumptions (accessed October 3, 2026)","u":"https://www.ssa.gov/oact/solvency/provisions/summary.html"},{"t":"Congressional Research Service, Alternative Inflation Measures for the Social Security Cost-of-Living Adjustment (COLA), report R43363, October 15, 2015 (older source; copy hosted by EveryCRSReport.com)","u":"https://www.everycrsreport.com/reports/R43363.html"}],"need":"A measure of older households' prices that BLS does not label experimental.","ev":"cited"},{"id":"cola-size","name":"Reduce the yearly Social Security COLA by one point","x":35,"y":72,"stance":"Oppose","why":"The 2026 COLA of 2.8% added $56 a month for the average retired worker, and the Part B premium rose $17.90 the same year, which leaves $38.10. The figures are averages for retired workers who pay Part B from the check. The best argument on the other side is that the Trustees put the full fix at a 25.2% benefit cut if made in 2026 and a 28.5% cut if made in 2034, and 83% of scheduled benefits is payable after 2034. A one-point COLA cut starting in December 2027 closes 46% of the 4.42 percent of payroll shortfall.","proof":["Social Security Administration, 2026 COLA Fact Sheet: the 2026 COLA is 2.8%. The average retired worker's benefit goes from $2,015 to $2,071 a month, a rise of $56.","Centers for Medicare & Medicaid Services, November 14, 2025: the 2026 standard Part B premium is $202.90 a month, up $17.90 from $185.00. The $17.90 is 32% of the $56 rise and leaves $38.10 (our arithmetic, not a CMS or SSA figure).","SSA Office of the Chief Actuary, Summary of Provisions (2026 Trustees Report baseline), option A1: cutting the annual COLA by 1 percentage point starting in December 2027 improves the long-range balance by 2.03 percent of payroll, which is 46% of the 4.42 percent of payroll shortfall. One point of COLA on a $2,071 benefit is $20.71 a month in the first year (our arithmetic, not an SSA figure).","SSA, 2026 Trustees Report Highlights: the Social Security trust funds are depleted in 2034, and 83% of scheduled benefits is payable after that.","Social Security Board of Trustees, 2026 Trustees Report Overview: closing the 75-year gap in 2026 takes a payroll tax rise from 12.40% to 16.65% or a 25.2% cut to all scheduled benefits; made in 2034 it takes 17.30% or a 28.5% cut."],"sources":[{"t":"Social Security Administration, 2026 Cost-of-Living Adjustment Fact Sheet (accessed October 3, 2026)","u":"https://www.ssa.gov/news/en/cola/factsheets/2026.html"},{"t":"Centers for Medicare & Medicaid Services, 2026 Medicare Parts A and B premiums and deductibles fact sheet, November 14, 2025","u":"https://www.cms.gov/newsroom/fact-sheets/2026-medicare-parts-b-premiums-deductibles"},{"t":"Social Security Administration, Office of the Chief Actuary, Summary of Provisions That Would Change the Social Security Program, estimates on the 2026 Trustees Report intermediate assumptions (accessed October 3, 2026)","u":"https://www.ssa.gov/oact/solvency/provisions/summary.html"},{"t":"SSA, The 2026 OASDI Trustees Report, Highlights (accessed October 3, 2026)","u":"https://www.ssa.gov/oact/tr/2026/II_A_highlights.html"}],"need":"A sourced count of retired workers whose Part B premium is taken from the benefit check.","ev":"cited"},{"id":"benefit-formula","name":"Raise the first step of the Social Security benefit formula","x":20,"y":62,"stance":"Watch","why":"In 2026 Social Security pays 90% of the first $1,286 of a worker's average monthly earnings, 32% from $1,286 to $7,749 and 15% above that. Raising the first bend point costs money, so the gain and the cost are shown together. The best argument on the other side is that raising the first bend point by 22% and the 90% factor to 95% adds about $250 a month to the basic benefit of most workers newly eligible in 2027 but costs 1.56 percent of payroll, which widens the shortfall from 4.42 to 5.98 percent of payroll (our arithmetic). Cutting the 15% factor to 5% for workers newly eligible from 2032 goes the other way and closes 0.39 percent of payroll.","proof":["Social Security Administration, Office of the Chief Actuary, Primary Insurance Amount formula page: for 2026 the bend points are $1,286 and $7,749, with factors of 90%, 32% and 15%.","Our arithmetic from that formula, not an SSA figure: moving the first bend point up $100 adds 58% of $100, which is $58 a month, for any worker whose average earnings are above the new bend point. Each point on the 32% factor is worth up to $64.63 a month for a worker with average earnings of $7,749 or more.","SSA Office of the Chief Actuary, Summary of Provisions (2026 Trustees Report baseline), option B3.17: raising the first bend point by 22% and the 90% factor to 95% adds about $250 a month to the basic benefit of most workers newly eligible in 2027 and costs 1.56 percent of payroll, which makes the 4.42 percent of payroll shortfall 35% larger.","Same SSA page, other options: cutting the 15% factor to 5% for workers newly eligible from 2032 improves the balance by 0.39 percent of payroll, 9% of the shortfall. Raising the first bend point 15% by 2047 costs 0.41."],"sources":[{"t":"Social Security Administration, Office of the Chief Actuary, Primary Insurance Amount formula page with 2026 bend points (accessed October 3, 2026)","u":"https://www.ssa.gov/oact/COLA/piaformula.html"},{"t":"Social Security Administration, Office of the Chief Actuary, Summary of Provisions That Would Change the Social Security Program, estimates on the 2026 Trustees Report intermediate assumptions (accessed October 3, 2026)","u":"https://www.ssa.gov/oact/solvency/provisions/summary.html"}],"need":"A sourced count of workers whose earnings fall above the first bend point.","ev":"cited"}],"structural":[{"id":"no-new-tax","name":"Do not raise the payroll tax on working people","x":28,"y":56,"stance":"Back","why":"The 2026 Trustees Report projects the combined trust funds are depleted in 2034, with 83 percent of scheduled benefits then payable. Closing the gap with the payroll tax alone would take a rise from 12.40 to 16.65 percent if made in 2026, or to 17.30 percent if made in 2034.","proof":["In Cato's survey question, 55% support raising the payroll tax from 12.4% to 16.05%, but 77% oppose raising their own payroll taxes by $1,300 a year.","53% of adults under 30 would protect younger workers from higher taxes even if that cuts benefits for current retirees; 89% of those 65 and older would protect current retirees' benefits even if taxes on younger workers rise."],"sources":[{"t":"Cato Institute (think tank), Social Security survey, October 9–14, 2025 (n=2,000), published December 15, 2025","u":"https://www.cato.org/survey-reports/new-poll-most-americans-expect-social-security-benefit-cuts-third-believe-program"},{"t":"Social Security Board of Trustees, 2026 OASDI Trustees Report, Table II.A1 (Social Security Administration)","u":"https://www.ssa.gov/oact/tr/2026/II_A_highlights.html"}],"need":"A poll on the payroll tax. Bill status.","ev":"cited"},{"id":"no-cut","name":"Do not cut Social Security benefits","x":78,"y":76,"stance":"Back","why":"The cost question is who pays for the scheduled benefit: the 2026 Trustees Report puts the 75-year shortfall at 4.42% of taxable payroll ($29.3 trillion in present value), and paying every scheduled benefit takes a payroll tax rise from 12.40% to 16.65% in 2026, or to 17.30% if made in 2034.","proof":["Pew Research Center, April 8 to 14, 2024: 79% of 8,709 U.S. adults say Social Security benefits should not be reduced in any way, including 83% of Democrats and 77% of Republicans, and 19% say some future reductions need to be considered.","Cato Institute/YouGov (Cato is a think tank), October 9 to 14, 2025: 77% of 2,000 U.S. adults oppose cutting benefits for current and future retirees, and 67% oppose cutting benefits only for future retirees.","Cato Institute/YouGov, October 9 to 14, 2025: views differ by age, with 47% of adults under 30 supporting reduced benefits for current and future retirees against 6% of adults 65 and older.","Social Security Trustees 2026 report summary: 62.3 million people received retirement or survivor benefits and 8.2 million received disability benefits at the end of 2025. The retirement fund can pay 100% of scheduled benefits until the fourth quarter of 2032 and 78% after that.","Social Security Board of Trustees, 2026 OASDI Trustees Report: the combined trust funds are depleted in 2034 with 83% of scheduled benefits then payable. Closing the 75-year gap with benefit cuts alone means a 25.2% cut to all scheduled benefits if made in 2026 or 28.5% if made in 2034. Closing it with the payroll tax alone means a rate of 16.65% in 2026 or 17.30% in 2034.","Cato Institute/YouGov, October 9 to 14, 2025: 77% of 2,000 U.S. adults oppose raising their own payroll taxes by $1,300 a year."],"sources":[{"t":"Pew Research Center, American Trends Panel, April 8–14, 2024 (8,709 adults), report published June 24, 2024","u":"https://www.pewresearch.org/politics/2024/06/24/americans-views-of-government-aid-to-poor-role-in-health-care-and-social-security/"},{"t":"Pew Research Center, Americans' views of government's role, April 8–14, 2024 (8,709 adults), published June 24, 2024","u":"https://www.pewresearch.org/politics/2024/06/24/americans-views-of-governments-role-persistent-divisions-and-areas-of-agreement/"},{"t":"Pew Research Center, survey April 2024, reported May 20, 2025","u":"https://www.pewresearch.org/short-reads/2025/05/20/what-the-data-says-about-social-security/"},{"t":"Cato Institute (think tank), Social Security survey, October 9–14, 2025 (n=2,000), published December 15, 2025","u":"https://www.cato.org/survey-reports/new-poll-most-americans-expect-social-security-benefit-cuts-third-believe-program"},{"t":"Social Security Administration, 2026 Trustees Report summary","u":"https://www.ssa.gov/oact/trsum/"},{"t":"Social Security Board of Trustees, 2026 OASDI Trustees Report, Table II.A1 (Social Security Administration)","u":"https://www.ssa.gov/oact/tr/2026/II_A_highlights.html"}],"need":null,"ev":"cited"},{"id":"age-70","name":"Raise the full retirement age to 70","x":32,"y":64,"stance":"Watch","why":"The change would shrink the benefit, and the cited source reports majority opposition.","proof":["65% oppose raising the full-benefit age to 70.","Democrats 67%, Republicans 64%."],"sources":[{"t":"Cato Institute (think tank), Social Security survey, October 9–14, 2025 (n=2,000), published December 15, 2025","u":"https://www.cato.org/survey-reports/new-poll-most-americans-expect-social-security-benefit-cuts-third-believe-program"}],"need":"Level of opposition by group.","ev":"cited"},{"id":"need-only","name":"Pay benefits only to people who need the money","x":19,"y":62,"stance":"Oppose","why":"The cost question is who receives the benefit. The 2026 Trustees Report puts the 75-year shortfall at 4.42% of taxable payroll ($29.3 trillion in present value), and no source cited here states how much paying benefits only to people who need the money would save.","proof":["67% oppose paying Social Security only to seniors who need the money.","Social Security Board of Trustees, 2026 OASDI Trustees Report: the combined trust funds are depleted in 2034 with 83% of scheduled benefits then payable. Closing the 75-year gap with benefit cuts alone means a 25.2% cut to all scheduled benefits if made in 2026 or 28.5% if made in 2034, and with the payroll tax alone a rate of 16.65% in 2026 or 17.30% in 2034."],"sources":[{"t":"Cato Institute (think tank), Social Security survey, October 9–14, 2025 (n=2,000), published December 15, 2025","u":"https://www.cato.org/survey-reports/new-poll-most-americans-expect-social-security-benefit-cuts-third-believe-program"},{"t":"Social Security Board of Trustees, 2026 OASDI Trustees Report, Table II.A1 (Social Security Administration)","u":"https://www.ssa.gov/oact/tr/2026/II_A_highlights.html"}],"need":"A sourced estimate of the savings from paying benefits only to people who need the money. Opposition level.","ev":"cited"}],"cultural":[{"id":"s1","name":"The Social Security check should not be reduced","x":79,"y":82,"stance":"Answer","why":"In Pew's 2024 survey, 79% said benefits should not be reduced in any way.","proof":["Pew Research Center, April 8 to 14, 2024: 79% of 8,709 U.S. adults say Social Security benefits should not be reduced in any way, including 83% of Democrats and 77% of Republicans.","Cato Institute/YouGov (Cato is a think tank), October 9 to 14, 2025: 77% of 2,000 U.S. adults oppose cutting benefits for current and future retirees."],"sources":[{"t":"Pew Research Center, American Trends Panel, April 8–14, 2024 (8,709 adults), report published June 24, 2024","u":"https://www.pewresearch.org/politics/2024/06/24/americans-views-of-government-aid-to-poor-role-in-health-care-and-social-security/"},{"t":"Pew Research Center, Americans' views of government's role, April 8–14, 2024 (8,709 adults), published June 24, 2024","u":"https://www.pewresearch.org/politics/2024/06/24/americans-views-of-governments-role-persistent-divisions-and-areas-of-agreement/"},{"t":"Pew Research Center, survey April 2024, reported May 20, 2025","u":"https://www.pewresearch.org/short-reads/2025/05/20/what-the-data-says-about-social-security/"},{"t":"Cato Institute (think tank), Social Security survey, October 9–14, 2025 (n=2,000), published December 15, 2025","u":"https://www.cato.org/survey-reports/new-poll-most-americans-expect-social-security-benefit-cuts-third-believe-program"}],"need":null,"ev":"cited"},{"id":"s2","name":"Younger workers get a worse deal from Social Security","x":58,"y":68,"stance":"Claim","why":"The cited survey shows a majority.","proof":["58% say younger workers get a worse deal than today's retirees, including 60% of Democrats and 55% of Republicans."],"sources":[{"t":"Cato Institute (think tank), Social Security survey, October 9–14, 2025 (n=2,000), published December 15, 2025","u":"https://www.cato.org/survey-reports/new-poll-most-americans-expect-social-security-benefit-cuts-third-believe-program"}],"need":"Lifetime benefits versus taxes by birth year.","ev":"cited"},{"id":"s3","name":"Congress has not kept the Social Security promise","x":62,"y":60,"stance":"Claim","why":"The cited survey shows a majority.","proof":["62% say Congress has mostly broken its promises in managing Social Security."],"sources":[{"t":"Cato Institute (think tank), Social Security survey, October 9–14, 2025 (n=2,000), published December 15, 2025","u":"https://www.cato.org/survey-reports/new-poll-most-americans-expect-social-security-benefit-cuts-third-believe-program"}],"need":null,"ev":"cited"},{"id":"s4","name":"Most Americans expect Social Security benefits to be cut","x":70,"y":44,"stance":"Answer","why":"The cited survey finds 70% expect benefits to be cut.","proof":["70% of adults expect benefits to be cut.","30% believe Social Security will not exist when they retire, and 36% are unsure."],"sources":[{"t":"Cato Institute (think tank), Social Security survey, October 9–14, 2025 (n=2,000), published December 15, 2025","u":"https://www.cato.org/survey-reports/new-poll-most-americans-expect-social-security-benefit-cuts-third-believe-program"}],"need":null,"ev":"cited"}]},{"id":"taxes","name":"Taxes","practical":[{"id":"bracket-rate","name":"Cut the 12% federal income tax rate by one point","x":38,"y":82,"stance":"Back","why":"In 2026 a one-point cut in the 12% bracket is worth up to $380 a year to a single filer and $760 to a married couple filing jointly. It lowers a tax bill but not a price. The best argument on the other side is that individual income tax is the largest source of federal revenue, $2,656.04 billion or 50.7% of receipts in fiscal year 2025, so a rate cut has to be paid for with other taxes, borrowing or lower spending.","proof":["Internal Revenue Service, IR-2025-103, October 9, 2025: for tax year 2026 the 12% rate applies to taxable income over $12,400 up to $50,400 for single filers and over $24,800 up to $100,800 for joint filers. The standard deduction is $16,100 single and $32,200 joint. One point on that bracket is 1% of $38,000, or $380, single and 1% of $76,000, or $760, joint (our arithmetic, not an IRS figure).","Our arithmetic, not a Census or IRS figure: a joint-filing household at the Census median income of $87,460 that takes the $32,200 standard deduction has taxable income of $55,260, of which $30,460 (the part above $24,800) is in the 12% bracket, so one point saves $304.60 a year. This assumes all income is wages and no other deductions or credits.","U.S. Census Bureau, Income in the United States: 2025, September 15, 2026: median household income is $87,460 before taxes and $76,060 after taxes and credits, a gap of $11,400 (our arithmetic). The after-tax figure counts payroll and state taxes as well as federal income tax.","U.S. Department of the Treasury, Monthly Treasury Statement for fiscal year 2025: individual income taxes were $2,656.04 billion of $5,234.62 billion in total receipts, which is 50.7% (our arithmetic)."],"sources":[{"t":"Internal Revenue Service, tax inflation adjustments for tax year 2026, IR-2025-103, October 9, 2025","u":"https://www.irs.gov/newsroom/irs-releases-tax-inflation-adjustments-for-tax-year-2026-including-amendments-from-the-one-big-beautiful-bill"},{"t":"U.S. Census Bureau, Income in the United States: 2025, report P60-289, September 15, 2026","u":"https://www.census.gov/library/publications/2026/demo/p60-289.html"},{"t":"U.S. Department of the Treasury, Bureau of the Fiscal Service, Monthly Treasury Statement, Table 4 receipts by source, fiscal year 2025 through September 30, 2025 (Fiscal Data API; the fiscal year 2026 statement is not yet posted)","u":"https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/accounting/mts/mts_table_4?filter=record_date:eq:2025-09-30"}],"need":"The revenue cost of one point on the 12% rate was not found in a source opened in full. A sourced revenue estimate for one point on that rate.","ev":"cited"},{"id":"payroll-rate","name":"Raise the Social Security payroll tax rate","x":30,"y":68,"stance":"Oppose","why":"In 2026 the employee pays 6.2% of wages up to $184,500. SSA's option to raise the combined rate by 1.0 point by 2037, split evenly, adds 0.5 point for the employee, which is $216.11 a year at the median wage and $922.50 at the cap. The best argument on the other side is that without more revenue the Trustees put the fix at a 25.2% benefit cut if made in 2026, which is about $526 a month on the August 2026 average retired-worker benefit of $2,087.52 (our arithmetic). The full rate fix of 16.65% would add 2.125 points for the employee if split evenly, or $918.48 a year at the median wage (our arithmetic).","proof":["SSA Office of the Chief Actuary, Contribution and Benefit Base: for 2026 the Social Security tax is 6.2% of wages up to $184,500 for the employee and 6.2% for the employer. The most an employee pays is $11,439.","SSA, Wage Statistics for 2023: the median wage is $43,222.81. At 6.2%, the employee share is $2,679.82 (our arithmetic, not an SSA figure). A 0.5 point rise is $216.11 on that wage and $922.50 on $184,500 (our arithmetic).","SSA Office of the Chief Actuary, Summary of Provisions (2026 Trustees Report baseline), option E1.10: raising the 12.4% rate by 0.1 point a year from 2028 to 2037, to 13.4%, split evenly between employer and employee, improves the balance by 0.89 percent of payroll, which is 20% of the 4.42 percent of payroll shortfall. Option E1.1, a rate of 17.0% from 2027, closes 4.47, or 101%.","SSA, 2026 Trustees Report Highlights: to close the 75-year gap with a payroll tax change made in 2026, the combined rate would go from 12.40% to 16.65%, and 17.30% if made in 2034.","U.S. Bureau of Labor Statistics, Consumer Expenditures 2024, December 19, 2025: consumer units paid an average of $6,684 in deductions for Social Security in 2024.","Social Security Board of Trustees, 2026 Trustees Report Overview: closing the 75-year gap in 2026 takes a payroll tax rise from 12.40% to 16.65% or a 25.2% cut to all scheduled benefits; made in 2034 it takes 17.30% or a 28.5% cut."],"sources":[{"t":"SSA Office of the Chief Actuary, Contribution and Benefit Base (accessed October 3, 2026)","u":"https://www.ssa.gov/oact/cola/cbb.html"},{"t":"SSA, Wage Statistics for 2023 (accessed October 3, 2026; the 2024 statistics were not yet posted)","u":"https://www.ssa.gov/cgi-bin/netcomp.cgi?year=2023"},{"t":"Social Security Administration, Office of the Chief Actuary, Summary of Provisions That Would Change the Social Security Program, estimates on the 2026 Trustees Report intermediate assumptions (accessed October 3, 2026)","u":"https://www.ssa.gov/oact/solvency/provisions/summary.html"},{"t":"SSA, The 2026 OASDI Trustees Report, Highlights (accessed October 3, 2026)","u":"https://www.ssa.gov/oact/tr/2026/II_A_highlights.html"},{"t":"U.S. Bureau of Labor Statistics, Consumer Expenditures 2024 news release, December 19, 2025","u":"https://www.bls.gov/news.release/cesan.htm"}],"need":"How the added tax would be split between employee and employer in the full fix.","ev":"cited"},{"id":"payroll-cap","name":"Raise or remove the Social Security payroll tax cap","x":25,"y":38,"stance":"Oppose","why":"In 2026 the 6.2% employee tax applies to the first $184,500 of wages, so a worker below that amount pays nothing more if the cap rises. A worker earning $250,000 would pay $4,061 a year more if the cap were removed. The best argument on the other side is that removing the cap with no added benefit credit closes 58% of the 4.42 percent of payroll shortfall, 45% with a benefit credit, and costs a worker at the median wage nothing.","proof":["SSA Office of the Chief Actuary, Contribution and Benefit Base: the 2026 taxable maximum is $184,500 and the employee rate is 6.2%, so the most an employee pays is $11,439.","Our arithmetic, not an SSA figure: at $250,000 of wages, 6.2% of the $65,500 above the cap is $4,061 a year for the employee. At the median wage of $43,222.81 (SSA Wage Statistics for 2023) the change is $0.","SSA Office of the Chief Actuary, Summary of Provisions (2026 Trustees Report baseline): removing the taxable maximum with no added benefit credit (option E2.1) improves the balance by 2.55 percent of payroll, 58% of the 4.42 percent of payroll shortfall. With a benefit credit (E2.2) it is 1.98, or 45%. Raising the maximum to cover 90% of earnings with credit (E3.1) is 0.82, or 19%, and without credit (E3.2) is 1.06, or 24%."],"sources":[{"t":"SSA Office of the Chief Actuary, Contribution and Benefit Base (accessed October 3, 2026)","u":"https://www.ssa.gov/oact/cola/cbb.html"},{"t":"SSA, Wage Statistics for 2023 (accessed October 3, 2026; the 2024 statistics were not yet posted)","u":"https://www.ssa.gov/cgi-bin/netcomp.cgi?year=2023"},{"t":"Social Security Administration, Office of the Chief Actuary, Summary of Provisions That Would Change the Social Security Program, estimates on the 2026 Trustees Report intermediate assumptions (accessed October 3, 2026)","u":"https://www.ssa.gov/oact/solvency/provisions/summary.html"}],"need":"A sourced count of workers who earn above $184,500.","ev":"cited"},{"id":"corporate-rate","name":"Change the 21% federal corporate income tax rate","x":30,"y":18,"stance":"Watch","why":"The corporate rate is a flat 21%, and who bears it is disputed: CBO and JCT assign 25% to workers and 75% to owners of capital, Treasury 18% and 82%. The best argument on the other side is that if workers bear most of the tax, as some academic studies find, a rate cut would raise take-home pay, but CBO and JCT put 75% on owners of capital, so the same cut would mostly go to owners. Either way corporate tax raised $452.09 billion in fiscal year 2025.","proof":["Congressional Research Service, report R47519, April 24, 2023 (older source): the corporate rate is a flat 21%. CBO assumes 75% of the burden falls on owners of capital and 25% on labor. Treasury (2012) assumed 82% capital and 18% labor. JCT uses 75% and 25% in the long run and 100% on capital in the short run. Academic open-economy studies find labor bears the majority, and CRS says those results rest on particular assumptions.","Same CRS report, April 24, 2023: Treasury (2023) puts corporate tax at 0.5% of income for the lowest quintile, 0.8% for the middle and 2.8% for the highest, 2.1% for all households. CBO (2019) puts it at 0.5%, 0.7% and 2.2%, 1.5% for all.","Tax Foundation (think tank), April 16, 2026, reporting CBO data for 2022: the corporate tax is 0.8% of income for the bottom quintile and 2.9% for the top quintile.","U.S. Department of the Treasury, Monthly Treasury Statement for fiscal year 2025: corporate income taxes were $452.09 billion, 8.6% of $5,234.62 billion in total receipts (our arithmetic), down from $529.87 billion in fiscal year 2024."],"sources":[{"t":"Congressional Research Service, An Overview of the Corporate Income Tax System, report R47519, April 24, 2023 (older source)","u":"https://www.congress.gov/crs-product/R47519"},{"t":"Tax Foundation (think tank), reporting Congressional Budget Office data for 2022, April 16, 2026","u":"https://taxfoundation.org/data/all/federal/us-income-growth-progressive-tax-code-2022/"},{"t":"U.S. Department of the Treasury, Bureau of the Fiscal Service, Monthly Treasury Statement, Table 4 receipts by source, fiscal year 2025 through September 30, 2025 (Fiscal Data API; the fiscal year 2026 statement is not yet posted)","u":"https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/accounting/mts/mts_table_4?filter=record_date:eq:2025-09-30"}],"need":"A measured per-household dollar effect of one point on the rate from CBO, JCT or Tax Foundation, which was not found in a source opened in full.","ev":"indirect"}],"structural":[{"id":"lower","name":"Cut the federal income tax","x":38,"y":74,"stance":"Back","why":"","proof":["59% say the federal income tax they pay is too high, 37% about right, 3% too low.","Republicans are at 60%, independents at 64%, Democrats at 49%.","The poll does not ask whether to cut the tax."],"sources":[{"t":"Gallup, telephone poll March 2–18, 2026 (n=1,000), published April 10, 2026","u":"https://news.gallup.com/poll/707951/americans-tax-views-remain-negative.aspx"}],"need":"Bill status. Effective rate.","ev":"cited"}],"cultural":[{"id":"x1","name":"The federal income tax is too high","x":59,"y":82,"stance":"Claim","why":"59% say too high in the cited poll.","proof":["59% say too high, 37% about right, 3% too low."],"sources":[{"t":"Gallup, telephone poll March 2–18, 2026 (n=1,000), published April 10, 2026","u":"https://news.gallup.com/poll/707951/americans-tax-views-remain-negative.aspx"}],"need":null,"ev":"cited"},{"id":"x2","name":"About half see the income tax they pay as fair","x":47,"y":44,"stance":"Watch","why":"47% say fair and 49% say not fair.","proof":["47% say the income tax they owe this year is fair and 49% say it is not fair, near the low of 45% in 1999."],"sources":[{"t":"Gallup, telephone poll March 2–18, 2026 (n=1,000), published April 10, 2026","u":"https://news.gallup.com/poll/707951/americans-tax-views-remain-negative.aspx"}],"need":null,"ev":"cited"},{"id":"x3","name":"Tax complaints come from every income level","x":59,"y":74,"stance":"Claim","why":"Lower, middle and upper income tiers all say too high in the cited poll.","proof":["63% of lower-income households, 58% of middle-income, and 59% of upper-income say their federal income tax is too high."],"sources":[{"t":"Gallup, telephone poll March 2–18, 2026 (n=1,000), published April 10, 2026","u":"https://news.gallup.com/poll/707951/americans-tax-views-remain-negative.aspx"}],"need":null,"ev":"cited"}]},{"id":"transportation","name":"Transportation","practical":[{"id":"cost","name":"Lower the household cost of getting around (gas, car, commute)","x":76,"y":78,"stance":"Back","why":"The cited figure is from April 2026.","proof":["64% are at least somewhat worried about being able to afford gas and transportation costs, and 29% are very worried.","In KFF's June 25–30, 2026 poll, 22% were very worried about gasoline and transportation costs."],"sources":[{"t":"KFF Health Tracking Poll, April 14–19, 2026 (published April 29, 2026)","u":"https://www.kff.org/public-opinion/kff-health-tracking-poll-health-care-costs-and-the-midterms/"},{"t":"KFF Health Tracking Poll, June 25–30, 2026 (published July 16, 2026)","u":"https://www.kff.org/public-opinion/kff-health-tracking-poll-public-views-on-fraud-in-government-health-programs/"}],"need":"Gas price and car price data.","ev":"cited"}],"structural":[{"id":"ev-rule","name":"Keep federal vehicle greenhouse gas standards repealed to lower new-car sticker prices","x":64,"y":72,"stance":"Back","why":"The repeal lowers the sticker price: the EPA final analysis (February 2026) puts the cut at $1,550 to $2,420 per vehicle across light, medium and heavy vehicles combined, and Resources for the Future (August 24, 2026) puts it at $1,808 per gasoline vehicle in 2032 for light-duty vehicles only. Over the life of the vehicles the result differs. In EPA scenario A1, which uses reference fuel prices and counts fuel savings over the full life of the vehicle, the repeal is a net cost of $180 billion at a 3% discount rate, because added fuel, repair, insurance and related costs of $1,430 billion exceed the $1,090 billion in lower vehicle cost and $200 billion in lower charger cost, and a net savings of $89 billion at 7%. Resources for the Future finds consumers worse off by $170 billion once fuel costs are counted (light-duty vehicles, 2026 to 2050, 3% rate).","proof":["Federal Register, February 18, 2026 (91 FR 7686): EPA rescinded the 2009 endangerment finding and repealed all greenhouse gas emission standards for light-duty, medium-duty and heavy-duty vehicles and engines, effective April 20, 2026. The rule leaves fuel economy and criteria pollutant standards alone.","U.S. Environmental Protection Agency, Regulatory Impact Analysis, February 2026 (light, medium and heavy vehicles combined, 2027 to 2055): the repeal cuts vehicle technology cost by $1,550 per vehicle at a 7% discount rate and $2,330 at 3% in scenario A1 (reference fuel prices, full vehicle-life fuel savings), and by $1,600 and $2,420 in the low oil price scenario A2. Added fuel, repair, maintenance, insurance, congestion and noise costs are $1,430 billion at 3% and $730 billion at 7% in A1.","U.S. Environmental Protection Agency, Regulatory Impact Analysis, February 2026: net result of the repeal is a net cost of $180 billion at 3% and net savings of $89 billion at 7% in A1, and net savings of $250 billion at 3% and $320 billion at 7% in A2. Scenarios A3 and A4, which count only the first 2.5 years of fuel savings, show net savings of $790 billion and $920 billion at 3%. The net tables have no climate or health rows, and EPA states it did not rely on the analysis for the legal basis of the rule.","Resources for the Future, August 24, 2026 (light-duty vehicles, 2026 to 2050, 3% discount rate, no backsliding in fuel economy assumed): repeal lowers the price of a gasoline vehicle by $1,808 in 2032. Excluding fuel costs consumers gain $717 billion, and with fuel costs consumers are worse off by $170 billion. Manufacturer profits rise $864 billion.","Energy Innovation, October 1, 2025 (modeling nonprofit, 2026 to 2050): repealing the standards makes households pay $310 billion more for energy, an average of $83 per household per year, mostly for gasoline.","Federal Register, EPA final rule of April 18, 2024 (89 FR 27842, light-duty and medium-duty vehicles, 2022 dollars): the standards cost about $1,200 per light-duty vehicle on average over model years 2027 to 2032 ($200 in 2027, $2,100 in 2032) and saved an average consumer about $6,000 over the life of a light-duty vehicle. The saving takes into account the federal purchase incentive, which Congress later eliminated or modified according to EPA's 2026 rule.","Pew Research Center, April 28 to May 4, 2025: 65% of 5,085 U.S. adults oppose phasing out production of new gasoline cars and trucks by 2035 and 34% favor.","Pew Research Center, May 13 to 19, 2024: 58% of adults opposed rules that would make electric vehicles at least half of new sales by 2032 and 40% favored. Republican opposition was 83%, and 64% of Democrats were in favor.","AP-NORC/EPIC, July 6 to 24, 2026: adults are split on the federal government rolling back environmental regulations, with 44% opposed, 23% in support and 33% neither.","Yale Program on Climate Change Communication and George Mason University, April 17 to 26, 2026: 63% of registered voters support allowing states to set higher fuel efficiency standards than the federal government."],"sources":[{"t":"Federal Register, EPA final rule of February 18, 2026 (91 FR 7686, effective April 20, 2026)","u":"https://www.federalregister.gov/documents/2026/02/18/2026-03157/rescission-of-the-greenhouse-gas-endangerment-finding-and-motor-vehicle-greenhouse-gas-emission"},{"t":"U.S. Environmental Protection Agency, Regulatory Impact Analysis, Rescission of the Greenhouse Gas Endangerment Finding and Motor Vehicle Greenhouse Gas Emission Standards (EPA-420-R-26-002), February 2026","u":"https://nepis.epa.gov/Exe/ZyPDF.cgi?Dockey=P101HV06.pdf"},{"t":"Resour   const dots = [...m.querySelectorAll("button[data-id] span.block")].map((d) => ({ el: d.closest("button"), r: d.getBoundingClientRect() }));
  const quads = [...m.querySelectorAll(".issue-quad")].filter((q) => q.offsetParent !== null).map((q) => q.getBoundingClientRect());
  const hit = (a, b, g) => a.left < b.right + g && a.right > b.left - g && a.top < b.bottom + g && a.bottom > b.top - g;
  const placed = [];
  chips.sort((a, b) => (a.classList.contains("font-semibold") ? 1 : 0) - (b.classList.contains("font-semibold") ? 1 : 0));
  chips.forEach((c) => {
    const btn = c.closest("button");
    const me = dots.find((d) => d.el === btn).r;
    const w = c.offsetWidth, h = c.offsetHeight, cy = (me.top + me.bottom) / 2, gap = 6;
    const xr = me.right + gap, xl = me.left - gap - w;
    const spots = [];
    for (let k = 0; k <= 30; k++) {
      const dy = (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 8;
      spots.push([xr, cy - h / 2 + dy], [xl, cy - h / 2 + dy]);
    }
    for (let k = 0; k <= 4; k++) {
      const x0 = me.right - w + (k * (w - 14)) / 4;
      spots.push([x0, me.top - gap - h], [x0, me.bottom + gap]);
    }
    let best = null;
    spots.forEach((sp, i) => {
      const r = { left: sp[0], top: sp[1], right: sp[0] + w, bottom: sp[1] + h };
      let cost = i * 0.01;
      if (r.left < pr.left + 2 || r.right > pr.right - 2 || r.top < pr.top + 2 || r.bottom > pr.bottom - 2) cost += 1000;
      dots.forEach((d) => { if (d.el !== btn && hit(r, d.r, 3)) cost += 100; });
      quads.forEach((q) => { if (hit(r, q, 0)) cost += 20; });
      placed.forEach((q) => { if (hit(r, q, 2)) cost += 50; });
      if (!best || cost < best.cost) best = { cost, r };
    });
    const b = btn.getBoundingClientRect();
    c.style.transform = "none"; c.style.translate = "none"; c.style.right = "auto";
    c.style.left = (best.r.left - b.left) + "px"; c.style.top = (best.r.top - b.top) + "px";
    placed.push(best.r);
  });
}
let chipFrame = 0;
function replaceChips() {
  if (chipFrame) return;
  chipFrame = requestAnimationFrame(() => { chipFrame = 0; if (document.getElementById("matrix")) placeChips(); });
}
if (document.fonts) {
  if (document.fonts.ready && document.fonts.ready.then) document.fonts.ready.then(replaceChips);
  if (document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", replaceChips);
}
let resizeTimer = 0;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(paintMatrix, 150); });
function paintDetail() {
  const area = areaBy(areaId);
  const item = items(area, lens).find((p) => p.id === selected);
  const cfg = MATRIX[lens];
  const el = document.getElementById("detail");
  const head = (x) => '<div class="text-[11px] tracking-widest uppercase" style="color:var(--muted)">' + x + "</div>";
  el.classList.toggle("hidden", !item);
  if (!item) { el.innerHTML = ""; return; }
  const none = item.ev === "none";
  const note = none || item.ev !== "indirect" ? "" : "The closest evidence points this way. It does not measure this directly.";
  const quad = quadName(item);
  const chip = (txt, strong) => '<span class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs' + (strong ? " font-semibold" : "") + '" style="background:var(--surface);color:' + (strong ? "var(--charcoal)" : "var(--muted)") + '">' + txt + "</span>";
  const pos = (name, v) => chip(esc(name) + ' <span class="font-semibold" style="color:var(--charcoal)">' + (none ? "not confirmed" : level(v)) + "</span>");
  const loud = lens === "cultural" && quad === "Do first" && item.stance === "Claim";
  el.innerHTML =
    '<h2 class="display text-2xl">' + esc(item.name) + "</h2>" +
    '<div class="mt-3 flex flex-wrap gap-2">' + chip(esc(STANCES[item.stance]), true) + (none ? "" : chip(esc(quad))) + (loud && !none ? chip("Say it loudly", true) : "") + (item.shared ? chip("Shared with " + esc(item.shared)) : "") + "</div>" +
    '<div class="mt-2 flex flex-wrap gap-2">' + pos(cfg.yp, item.y) + pos(cfg.xp, item.x) + "</div>" +
    (item.why ? '<p class="mt-5 text-sm leading-relaxed" style="color:var(--muted)">' + esc(item.why) + "</p>" : "") +
    '<div class="mt-5">' + head("Proof points") + (item.proof.length ? '<ul class="mt-2 list-disc pl-5 text-sm leading-relaxed" style="color:var(--muted)">' + item.proof.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul>" : '<p class="mt-2 text-sm" style="color:var(--muted)">Not confirmed.</p>') +
    (item.sources.length ? '<p class="mt-2 text-xs leading-relaxed" style="color:var(--muted)">' + item.sources.map((x) => typeof x === "string" ? esc(x) : '<a href="' + esc(x.u) + '" target="_blank" rel="noopener" class="underline">' + esc(x.t) + "</a>").join(". ") + ".</p>" : "") +
    (item.need ? '<p class="mt-2 text-xs leading-relaxed" style="color:var(--muted)">Not confirmed: ' + esc(item.need) + "</p>" : "") + "</div>" +
    (note ? '<p class="mt-5 text-sm leading-relaxed" style="color:var(--muted)">' + note + "</p>" : "") +
    '<a href="project.html" class="mt-5 inline-flex rounded-xl px-5 py-2.5 text-sm font-medium text-white" style="background:var(--charcoal)">Let\'s work together</a>';
}
function toggleMenu() {
  const m = document.getElementById("mobile-menu");
  const open = m.classList.toggle("open");
  document.getElementById("menu-icon").classList.toggle("hidden", open);
  document.getElementById("close-icon").classList.toggle("hidden", !open);
}
function closeMenu() {
  document.getElementById("mobile-menu").classList.remove("open");
  document.getElementById("menu-icon").classList.remove("hidden");
  document.getElementById("close-icon").classList.add("hidden");
}
sync();
