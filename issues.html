<script>
const DATA = {"areas":[{"id":"ai","name":"Artificial Intelligence","practical":[{"id":"power","name":"The data center pays for its own power","y":90,"x":88,"c":3,"summary":"A Republican can say this and mean it. The user pays. The household does not. It is not a ban, and it is not a fight with profit. Among voters already opposed, 28% name the household bill. 38% say the company should pay for its own electricity, Democrats 40% and Republicans 39%. Every package that wins most matchups puts that cost on the company.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026. 1,004 registered voters."},{"id":"tax","name":"Don't write a check to make them come","y":80,"x":82,"c":3,"summary":"They can pay the same property tax as the shop next door. A special break is industrial policy. Ending the breaks wins 56% of head-to-head matchups. Keeping them finishes last, at 35%.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026. 1,004 registered voters."},{"id":"water","name":"The user pays for the water","y":66,"x":74,"c":3,"summary":"Price the input. Do not outlaw the user, and do not give the water away. 48% think a data center uses far more water than almost any other facility. 26% are not sure. When the real water number is shown, that belief moves.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026. 1,004 registered voters."},{"id":"china","name":"Stay ahead of China by letting them build","y":74,"x":68,"c":3,"summary":"The race is real. The subsidy is not the way. 73% of Republicans and 73% of Democrats say it is extremely or very important to stay ahead of China. The package that recruits with public money and calls it the race wins only 41% of matchups. Permits and a bill for the power beat a check.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026. 1,004 registered voters."},{"id":"federal","name":"Stop a different AI license in every state","y":58,"x":62,"c":3,"summary":"Fifty state codes are fifty barriers, not fifty laboratories, when each one is a license. Republicans want the rule set federally, 67% to 18%. Do not answer that by standing up a new commission. Trust in Washington to regulate AI is split, 44% to 47%. Preempt the patchwork. Do not issue a national charter.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026. 1,004 registered voters. Pew Research Center, March 2025, reported November 6, 2025."},{"id":"cyber","name":"Build the newer plant. Don't freeze the old one.","y":52,"x":66,"c":3,"summary":"A freeze is not a security policy. Republicans say cyber risk is a reason to build newer infrastructure, 50% to 32%. The country as a whole is split, 42% build and 41% caution. A Republican can take the build side without pretending the national number is a landslide.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026. 1,004 registered voters."},{"id":"pause","name":"Sponsor a moratorium","y":64,"x":16,"c":3,"summary":"This is a ban with a calendar. Only 16% name pausing AI as a top priority, and 3% say lawmakers should do nothing. Offered as a bill, a one-year pause still wins 51% of matchups. Do not sponsor it. Answer it with the company paying its own power bill, which wins 64%.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026. 1,004 registered voters."},{"id":"cba","name":"Make them sign a community-benefits deal","y":76,"x":20,"c":3,"summary":"This is an exaction. The permit is held hostage to a side payment. 71% support requiring one before construction, and 12% oppose. It polls. It is not a market. The company pays for the power and the water it uses. It does not pay a toll to a committee.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026. 1,004 registered voters."},{"id":"water-ban","name":"The town's water is not for sale","y":84,"x":18,"c":3,"summary":"This is a ban. Water is the second worry among people already opposed, at 18%, and 48% think these buildings use far more water than almost anything else. Answer it with a price and the real number. Do not adopt the ban.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026. 1,004 registered voters."},{"id":"liability","name":"Open with a lawsuit against the model","y":70,"x":22,"c":3,"summary":"Holding the companies liable for harms is the single most named priority, at 48%. That is a plaintiff's bill. It is not a permit for power, and it is not how a Republican should open. Lead with who pays for the electricity.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026. 1,004 registered voters."},{"id":"jobs","name":"Jobs are worth a subsidy","y":30,"x":18,"c":3,"summary":"Do not buy a project with a tax break and call the jobs the return. Told a site would hire locally, 33% move toward yes and 18% toward no. 38% do not care.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026. 1,004 registered voters."},{"id":"noise","name":"Ban it over the noise","y":14,"x":12,"c":3,"summary":"A hum is not a land-use crime, and it is not the vote. Among voters already unfavorable, 2% name noise or looks as the main concern.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026. 1,004 registered voters."}],"structural":[{"id":"own-power","name":"The company pays for its own power and wires","y":86,"x":72,"c":3,"summary":"Pass the ratepayer protection. The data center covers its electricity and the grid work it causes, and it can be curtailed before a home. 38% already call that a top priority, even across parties. Packages with this in them are the ones that win.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026. 1,004 registered voters."},{"id":"no-subsidy","name":"End the data-center tax break","y":78,"x":64,"c":3,"summary":"Repeal the special break. Leave the ordinary property tax. Ending the breaks wins 56% of matchups. Defending them finishes last, at 35%.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026. 1,004 registered voters."},{"id":"no-license","name":"Don't create an AI licensing board","y":72,"x":46,"c":3,"summary":"No new commission with the power to say which models may exist. Trust in the federal government to regulate AI is split, 44% to 47%. Republicans were more trusting than Democrats in that poll, 54% to 36%, which is still not a mandate for a license.","source":"Pew Research Center, March 2025, reported November 6, 2025."},{"id":"no-pause","name":"Vote down a one-year moratorium","y":68,"x":36,"c":3,"summary":"A pause stops the build. It wins 51% of matchups when offered, so it is a real vote, not a fringe. The alternative that beats it is conditions: own power, public meeting, local hire, no subsidy.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026. 1,004 registered voters."},{"id":"no-cba","name":"Don't put a community-benefits contract in the statute","y":60,"x":28,"c":3,"summary":"71% want operators to sign one before construction. Writing that into law makes a side deal the price of a permit. Skip it. Bill the power instead.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026. 1,004 registered voters."}],"cultural":[{"id":"jobs-gone","name":"AI will take the jobs","y":86,"x":22,"c":3,"summary":"The belief is that AI will put people out of work.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026: job loss is the leading concern about AI, at 26%. A claim that AI could wipe out half of entry-level white-collar jobs drew 70% more negative. 34% name protecting workers as a top priority."},{"id":"kill","name":"AI will kill people","y":76,"x":16,"c":2,"summary":"The belief is that AI will hurt people, and someone has to answer for it.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026: 48% name holding AI companies legally responsible for harms as a top priority, the highest item on the list. The survey did not ask the words 'AI will kill people.'"},{"id":"privacy","name":"AI will end privacy","y":70,"x":28,"c":3,"summary":"The belief is that AI will watch people and wipe out what used to be private.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026: 69% are concerned about AI surveillance in public spaces, including 66% of Republicans. 15% think a data center monitors citizens for the government."},{"id":"control","name":"AI will control people","y":60,"x":14,"c":2,"summary":"The belief is that the machine ends up in charge, not the person.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026: the line 'AI bots will be more human than humans' drew a more negative reaction from 67%. 28% believe advanced AI carries out cyberattacks on its own."},{"id":"cure","name":"AI will cure disease","y":36,"x":78,"c":3,"summary":"The belief is that AI will cure disease. It is the good outcome people can name. Few can name one.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026: 41% say nothing about AI excites them. Curing diseases is the leading positive, at 17%."},{"id":"rich","name":"AI will make people rich","y":28,"x":68,"c":2,"summary":"The belief is that AI will make ordinary people rich. What voters actually say is that it takes the jobs and enriches the companies.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026: no question asks whether AI will make people rich. Job loss leads the worries at 26%. Defending the tax breaks for the companies finishes last, at 35%."}]},{"id":"education","name":"Education","practical":[{"id":"dollar","name":"The dollar follows the child","y":88,"x":88,"c":3,"summary":"The family spends the public dollar. The district does not own it. 61% say a school is more accountable when a child can leave and take the funding. That is the bill. An account is not a new program on top of the old one.","source":"yes. every kid. foundation / YouGov, November 19–24, 2025."},{"id":"universal","name":"Every family, not a poverty program","y":82,"x":80,"c":3,"summary":"Universal beats a needs test. 77% support an account for every student. 65% support one limited by income or special needs. Among account supporters in a separate poll, 70% want it for every family. A means test turns a market into a welfare office.","source":"EdChoice, 2026 Schooling in America Survey. yes. every kid. foundation / YouGov, November 19–24, 2025."},{"id":"explain","name":"Say what the account is, in one sentence","y":76,"x":78,"c":3,"summary":"People are not opposed. They have not been told. Support is 54% before a plain description and 78% after. Parents move from 64% to 84%. Describe the account before the hearing.","source":"EdChoice, 2026 Schooling in America Survey."},{"id":"credit","name":"A tax credit the family spends on school","y":72,"x":76,"c":3,"summary":"The family buys the education. The state does not approve each invoice first. 72% of Americans and 82% of school parents support tax-credit scholarships. A separate poll finds 58%. Use the plain version. The majority is real either way.","source":"EdChoice, 2026 Schooling in America Survey. yes. every kid. foundation / YouGov, November 19–24, 2025."},{"id":"open","name":"The address does not assign the school","y":64,"x":72,"c":3,"summary":"Any public school in the state. 64% support that. It is not the full dollar, and it is a vote you can take on the way to the account.","source":"yes. every kid. foundation / YouGov, November 19–24, 2025."},{"id":"voucher","name":"A voucher is a seat. Pass it, then the account.","y":58,"x":68,"c":3,"summary":"69% of Americans and 79% of school parents support a voucher for a private-school seat. In 2025, Republicans were at 77% and Democrats at 57%. A seat is narrower than an account the family can spend on a school or a tutor. Take the seat if that is the vote in front of you. Do not stop there.","source":"EdChoice, 2026 Schooling in America Survey. EdChoice, 2025 Schooling in America, on the party split."},{"id":"would-use","name":"Parents will use it if it is real","y":70,"x":74,"c":3,"summary":"Do not build an account so tangled that nobody enrolls. 65% of school parents say they would enroll. 13% say no. 22% are unsure.","source":"EdChoice, 2026 Schooling in America Survey."},{"id":"needs","name":"Only poor families should get the dollar","y":56,"x":20,"c":3,"summary":"This recreates a program. It also polls worse than a universal account, 65% against 77%. Among supporters of accounts, about 20% want it limited to low-income families. Do not accept the means test as the compromise that saves the bill. It is the bill's replacement.","source":"EdChoice, 2026 Schooling in America Survey. yes. every kid. foundation / YouGov."},{"id":"status","name":"The assigned school is fine","y":24,"x":14,"c":3,"summary":"41% of school parents say K–12 is on the right track. That is not a reason to keep the address rule. The family that wants to leave is the point.","source":"EdChoice, 2025 Schooling in America Survey."}],"structural":[{"id":"esa","name":"Give every family an education account","y":88,"x":74,"summary":"Every child gets an account the family spends on school, a tutor, or another option. It is not limited to low-income families. With a description, 78% of Americans and 84% of school parents support the accounts. 77% support making one universal. Asked differently, 63% support them and 70% of those supporters want every family included.","source":"EdChoice, 2026 Schooling in America Survey. yes. every kid. foundation / YouGov, November 19–24, 2025.","c":3},{"id":"tax-credit","name":"A tax credit a family can spend on school","y":82,"x":68,"summary":"A family gets a tax credit and uses it to buy education, instead of waiting for the state to approve each purchase. 72% of Americans and 82% of school parents support tax-credit scholarships. A separate poll finds 58% support for education tax credits. The size of the majority depends on the wording.","source":"EdChoice, 2026 Schooling in America Survey. yes. every kid. foundation / YouGov, November 19–24, 2025.","c":3},{"id":"open-enroll","name":"Let a child attend any public school in the state","y":64,"x":64,"summary":"A student can attend any public school in the state. The address no longer assigns the school. 64% support that. A year earlier the same question was 68%, including 75% of K–12 parents. It does not yet hand the family the dollar.","source":"yes. every kid. foundation / YouGov, November 19–24, 2025, and December 2024.","c":3},{"id":"charters","name":"Open more charter schools","y":46,"x":66,"summary":"Open more charter schools. 68% of Americans and 75% of school parents support them. A charter is still a public school under a public rulebook. It does not give the family the dollar.","source":"EdChoice, 2026 Schooling in America Survey.","c":3},{"id":"vouchers","name":"A voucher for a private-school seat","y":58,"x":66,"summary":"A voucher pays for a seat at a private school. 69% of Americans and 79% of school parents support vouchers. In 2025, Republican support was 77% and Democratic support was 57%. A voucher is one seat. An account can buy more than that.","source":"EdChoice, 2026 Schooling in America Survey. EdChoice, 2025 Schooling in America, on the party split.","c":3},{"id":"needs","name":"Limit the account to low-income families","y":34,"x":62,"summary":"Only low-income families, or students with special needs, get the account. Everyone else stays assigned. That version is less popular than a universal account: 65% versus 77% in 2026, and 56% versus about three in four in 2025. Among account supporters, only 20% want it limited to low-income families.","source":"EdChoice, 2025 and 2026 Schooling in America Surveys. yes. every kid. foundation / YouGov, December 2024.","c":3}],"cultural":[{"id":"ed1","name":"A family should design a child's education","y":84,"x":86,"summary":"The belief is that a family, not a district, should fit school to the child.","source":"yes. every kid. foundation / YouGov, November 19–24, 2025: 72% say families should be able to customize K–12 to the child, a great deal or some.","c":3},{"id":"ed2","name":"Schools should answer to parents","y":78,"x":84,"summary":"The belief is that a school has to answer to the parent, not only to the system.","source":"yes. every kid. foundation / YouGov, November 19–24, 2025: 76% say K–12 schools need to be more accountable to parents.","c":3},{"id":"ed3","name":"A school is accountable when a child can leave with the money","y":80,"x":88,"summary":"The belief is that accountability means the child can leave and take the public dollars with them.","source":"yes. every kid. foundation / YouGov, November 19–24, 2025: 61% say schools are more accountable when a child can leave and take the funding.","c":3},{"id":"ed4","name":"Every family should get the account, not only poor families","y":74,"x":82,"summary":"The belief is that an education account should be for every family, not a program for the poor.","source":"EdChoice, 2026 Schooling in America: 77% support a universal account, 65% a needs-based one. yes. every kid. foundation / YouGov, December 2024: 71% of account supporters want it universal, 20% want it limited to low-income families.","c":3},{"id":"ed5","name":"A child's address should pick the school","y":68,"x":18,"summary":"The belief is that where a family lives should decide which public school the child attends.","source":"yes. every kid. foundation / YouGov, November 19–24, 2025: 64% support the opposite, access to any public school in the state. The assigned school is still the rule most children live under.","c":3},{"id":"ed6","name":"Only some families should be trusted with the money","y":36,"x":22,"summary":"The belief is that only low-income families, or families the state approves, should control the education dollar.","source":"EdChoice, 2025 Schooling in America: a universal account beats a needs-based one, about three in four versus 56%. The narrower value is the minority position.","c":3}]},{"id":"energy","name":"Energy","practical":[{"id":"cross","name":"A household does not pay for power it did not use","y":88,"x":86,"c":3,"summary":"Cost follows use. That is the whole energy message. Three-quarters of adults say the home bill went up, and 42% say a lot. 79% of voters say household electricity costs rose over two years. The answer is to stop shifting the new load onto captive customers.","source":"Pew Research Center, March 16–22, 2026. Inclusive Abundance / Blue Rose Research, May 13–23, 2026."},{"id":"all","name":"Use whatever source keeps the bill down","y":82,"x":84,"c":3,"summary":"Gas, nuclear, wind, and solar, if the price is right. No fuel is owed a quota or a sin. 68% support that mix. 44% had never heard the phrase all-of-the-above, so say it in plain words.","source":"Inclusive Abundance / Blue Rose Research, May 13–23, 2026."},{"id":"permit","name":"Put a deadline on the permit","y":78,"x":80,"c":3,"summary":"A permit that never ends is a ban. 60% want energy infrastructure faster and easier to build, including 71% of Trump voters and 51% of Harris voters. This is the bill a Republican can carry in both a red district and a mixed one.","source":"Inclusive Abundance / Blue Rose Research, May 13–23, 2026."},{"id":"renew","name":"Renew the nuclear plant that is already running","y":74,"x":86,"c":3,"summary":"The easy nuclear vote. 87% support renewing a license at a plant that is operating and still meets federal safety rules. 64% say build more. Do this before you announce a new site.","source":"Bisconti Research, 2025 National Nuclear Energy Public Opinion Survey."},{"id":"own-way","name":"New demand pays its own way","y":70,"x":74,"c":3,"summary":"A data center, a factory, or any other new load covers the power and the wires it adds. 43% say data centers are a major reason bills rose. 58% say they are responsible for higher household prices. Bill the user. Do not ban the user.","source":"Pew Research Center, March 16–22, 2026. Morning Consult, November 21–23, 2025."},{"id":"new-nuke","name":"A new nuclear site is a harder vote than a renewal","y":48,"x":64,"c":3,"summary":"59% favor more nuclear plants nationally. 53% still oppose one in their area. Let the law allow a new site. Do not pretend the groundbreaking is popular. The renewal is the vote that carries this year.","source":"Pew Research Center, April–May 2025. Gallup, March 2–18, 2026."},{"id":"profit","name":"The utility's profit is the crime","y":80,"x":16,"c":3,"summary":"People say this. Do not say it with them. Among adults whose bill rose, 64% blame the utility for wanting more money. A captive customer and a shifted cost are the problem. Profit, where a customer can leave, is not.","source":"Pew Research Center, March 16–22, 2026."},{"id":"renewables-first","name":"Put wind and solar ahead of everything else","y":62,"x":22,"c":3,"summary":"A quota and a subsidy for one pair of fuels. 57% still say prioritize renewables, down from 79% in 2020. Among Republicans the priority has flipped: 71% put oil, gas, and coal first. Do not write the quota. The mix that keeps the bill down already polls at 68%.","source":"Pew Research Center, March 16–22, 2026."},{"id":"one-fuel","name":"One fuel is why the bill rose","y":28,"x":20,"c":3,"summary":"There is no national agreement on the villain. Republicans are more likely to say wind (44%) and solar (43%) cost more. Democrats are more likely to say each costs less (48%). Don't pick a fuel to punish.","source":"Pew Research Center, March 16–22, 2026."},{"id":"home","name":"Tell households to use less","y":14,"x":18,"c":3,"summary":"Austerity is not an energy policy. Only 13% say using more at home is a major reason the bill rose. 46% say it is not a reason.","source":"Pew Research Center, March 16–22, 2026."}],"structural":[{"id":"deadlines","name":"A deadline on every energy permit","y":82,"x":64,"summary":"A permit has a date. If the agency misses it, the project moves. 60% of likely 2026 voters support making energy infrastructure faster and easier to build, including 51% of Harris voters and 71% of Trump voters.","source":"Landscape deck, slide 3. Inclusive Abundance / Blue Rose Research, May 13–23, 2026.","c":3},{"id":"nepa","name":"Put an end date on environmental review","y":76,"x":48,"summary":"State environmental review gets an end date, instead of staying open until someone finds a reason to stop the project. Voters support faster energy permitting at 60%. That question is about speed, not a named repeal of a state environmental law.","source":"Landscape deck, slide 3. Nearest poll: Inclusive Abundance / Blue Rose Research, May 13–23, 2026.","c":2},{"id":"discretion","name":"Replace the hearing with a checklist","y":72,"x":46,"summary":"If a project meets a written checklist, it is approved. A hearing cannot kill it afterward. Voters support making energy projects easier to build. No poll in this set asks about discretionary review by that name.","source":"Landscape deck, slide 3. Nearest poll: Inclusive Abundance / Blue Rose Research, May 2026.","c":2},{"id":"rps","name":"Repeal the renewable quota","y":70,"x":40,"summary":"Repeal the law that says a set share of power must come from a listed set of renewable sources. No national poll in this set asks that question directly. The nearest fight, repealing renewable tax credits, is a split.","source":"Landscape deck, slide 3. Morning Consult, June 6–8, 2025, on tax credits, not portfolio standards.","c":2},{"id":"rofr","name":"Make the utility bid for the line","y":8,"x":80,"summary":"The utility no longer gets the transmission contract automatically. It has to bid, like anyone else. The landscape deck scores this 5–10% transformative and 80% popular. It is a bidding rule, not a rewrite of the system.","source":"Landscape deck, slide 3.","c":2},{"id":"nuclear-new","name":"Allow nuclear plants on new sites","y":80,"x":34,"summary":"Allow a nuclear plant on a site that does not already have one. 59% favor more nuclear plants, and 61% favor nuclear energy. 53% still oppose a plant in their area. A new site is the hard vote.","source":"Landscape deck, slide 3. Pew Research Center, April–May 2025. Gallup, March 2025 and March 2–18, 2026.","c":3},{"id":"nuclear-existing","name":"Renew licenses at existing nuclear plants","y":74,"x":74,"summary":"Renew the license, and add capacity, at plants that are already operating and still meet federal safety rules. 87% support renewing that kind of license. 64% say build more plants.","source":"Landscape deck, slide 3. Bisconti Research, 2025 National Nuclear Energy Public Opinion Survey.","c":3},{"id":"smr","name":"Let states license small reactors","y":80,"x":36,"summary":"Create a state license for small modular reactors, a new kind of plant, instead of running them through the old federal category. 59% favor more nuclear. This license class has not been polled on its own.","source":"Landscape deck, slide 3. Pew Research Center, April–May 2025, on more nuclear plants, not this license class.","c":2},{"id":"btm","name":"Let customers connect their own power","y":68,"x":52,"summary":"Power a customer adds on their own side of the meter should not wait in the queue built for big power plants. 60% want it to be easier to build energy infrastructure. That is the nearest number, not a behind-the-meter question.","source":"Landscape deck, slide 3. Inclusive Abundance / Blue Rose Research, May 2026.","c":2},{"id":"ppa","name":"Let customers buy power directly","y":58,"x":42,"summary":"A customer, a campus, or a town can sign a contract and buy power directly, instead of only through the utility. Not separately polled.","source":"Landscape deck, slide 3.","c":1},{"id":"redundancy","name":"Allow neighborhood backup power","y":64,"x":40,"summary":"Let a neighborhood add backup power, such as storage where the power is used, without a full utility case and without waiting on a new line. The landscape deck calls this local redundancy. Not separately polled.","source":"Landscape deck, slide 3.","c":1},{"id":"sandbox","name":"A trial waiver for a new power model","y":48,"x":44,"summary":"Give a new power model a time-limited waiver so it can operate and be judged, instead of waiting for a permanent rule. Not separately polled.","source":"Landscape deck, slide 3.","c":1},{"id":"threshold","name":"Skip full review for small projects","y":60,"x":48,"summary":"Below a set size, a project skips the full regulatory case. Above it, the ordinary rules apply. Not separately polled.","source":"Landscape deck, slide 3.","c":1},{"id":"backyard","name":"Let households install their own solar","y":55,"x":62,"summary":"A household can put solar on its own roof or yard without a utility veto. 77% favor more solar power. That is support for the source, not a vote on a backyard ordinance.","source":"Landscape deck, slide 3. Pew Research Center, June 2025, on expanding solar power.","c":2}],"cultural":[{"id":"e1","name":"Keep the power bill down","y":86,"x":90,"summary":"The belief is that energy policy should be judged by the household bill, not by a carbon target.","source":"Pew Research Center, December 9, 2024: 59% say keeping consumer costs low is very important in climate policy. It is the top factor for Republicans, at 67%.","c":3},{"id":"e2","name":"Use whatever source keeps power cheap","y":82,"x":84,"summary":"The belief is that the grid should use wind, solar, gas, and nuclear if that is what keeps power affordable.","source":"Inclusive Abundance / Blue Rose Research, May 13–23, 2026: 68% support an all-of-the-above mix, including wind, solar, natural gas, and nuclear. 44% had never heard the phrase.","c":3},{"id":"e3","name":"Build more nuclear plants","y":74,"x":76,"summary":"The belief is that the country should build more nuclear plants.","source":"Pew Research Center, April–May 2025: 59% favor more nuclear plants, up from 43% in 2020. Gallup, March 2025: 61% favor the use of nuclear energy.","c":3},{"id":"e4","name":"Put wind and solar ahead of oil, gas, and coal","y":76,"x":28,"summary":"The belief is that wind and solar should come before oil, gas, and coal, even when that costs more.","source":"Pew Research Center, March 16–22, 2026: 57% say prioritize renewables, down from 79% in 2020. Among Republicans the fossil-fuel priority is now 71%, up from the reverse in 2020.","c":3},{"id":"e5","name":"Get to carbon neutral by 2050","y":70,"x":22,"summary":"The belief is that the goal of energy policy is carbon neutrality by 2050.","source":"Pew Research Center, May 13–19, 2024: 63% support the U.S. taking steps to become carbon neutral by 2050. Fewer call getting to net zero very important than call keeping costs low very important.","c":3},{"id":"e6","name":"No new plant in my neighborhood","y":68,"x":16,"summary":"The belief is that a plant the country says it wants still should not be built near me.","source":"Gallup, March 2–18, 2026: 53% oppose a nuclear plant in their area, even as national support for more emphasis on nuclear is the highest Gallup has measured, at 46%.","c":3},{"id":"e7","name":"I should cut my own carbon use","y":22,"x":20,"summary":"The belief is that each person has a duty to shrink their own carbon use.","source":"Pew Research Center, May 13–19, 2024: 25% say it is extremely or very important to them personally to limit their own carbon footprint.","c":3},{"id":"e8","name":"The government should push wind and solar","y":64,"x":34,"summary":"The belief is that Washington should encourage wind and solar production.","source":"Pew Research Center, March 16–22, 2026: 65% say the federal government should encourage wind and solar production, down from 72% in 2022.","c":3}]},{"id":"healthcare","name":"Healthcare","practical":[{"id":"price","name":"Post the price before the visit","y":90,"x":90,"c":3,"summary":"A patient sees the price of the visit, the test, or the drug before agreeing. 61% say stronger price-transparency rules should be a top priority, in both parties. That is a market. A board setting the price is not.","source":"KFF Health Tracking Poll, published January 17, 2025."},{"id":"afford","name":"The price is the problem, not the coverage slogan","y":82,"x":74,"c":3,"summary":"64% of adults are worried they cannot afford care. 30% are very worried. 46% of insured adults say a lower bill at the visit is the change they want. The Republican answer is a posted price and more supply. It is not a new entitlement and it is not Medicare setting the rate.","source":"KFF Health Tracking Poll, April 14–19, 2026."},{"id":"supply","name":"Let more care be offered","y":68,"x":70,"c":2,"summary":"A certificate of need lets incumbents veto a new clinic or a new bed. More than half of the studies Cato reviewed tie those laws to higher cost, less access, or worse quality. States without them have more intensive-care capacity. There is no national voter poll in this set. The evidence is the literature, and the bill is a repeal.","source":"Cato Institute, certificate-of-need evidence review, reported September 2026."},{"id":"medicare-price","name":"Let Medicare set more drug prices","y":74,"x":14,"c":3,"summary":"This is a price control, and it polls. 55% say expanding Medicare negotiation should be a top priority. 28% say rolling it back should be. A Republican does not pass it. Post the price. Add supply. Do not have the agency name the number.","source":"KFF Health Tracking Poll, published January 17, 2025."},{"id":"guarantee","name":"Washington guarantees everyone's coverage","y":70,"x":12,"c":3,"summary":"64% say it is the federal government's job to make sure everyone has coverage. That is the other bill. It carries. It is not yours. Your bill is the price a person can see, and a clinic that is allowed to open.","source":"West Health–Gallup, November 3–25, 2025."},{"id":"denial","name":"Lead with a new rule on insurance denials","y":40,"x":32,"c":3,"summary":"55% will call denial rules a top priority when asked that way. Asked what change they want most, only 22% of insured adults pick ending prior authorization. The bill at the visit is the fight. A new denial statute is a regulation, and it is not the opening.","source":"KFF, January 2025, and KFF Health Tracking Poll, April 14–19, 2026."}],"structural":[{"id":"transparency","name":"Post the price before the visit","y":76,"x":68,"summary":"A patient sees the price of the visit, the test, or the drug before agreeing to it. 61% say stronger price-transparency rules should be a top priority, and that support shows up in both parties.","source":"KFF Health Tracking Poll, published January 17, 2025.","c":3},{"id":"prior-auth","name":"A new statute on insurance denials","y":42,"x":60,"summary":"An insurer's denial rule can be tightened. Do not lead with it. 55% call it a top priority when prompted. Only 22% of insured adults say it is the change they want most. It is a regulation. The price posted before the visit is the market bill.","source":"KFF, January 2025, and KFF Health Tracking Poll, April 14–19, 2026.","c":3},{"id":"negotiate","name":"Let Medicare set more drug prices","y":36,"x":58,"summary":"Do not pass this. 55% say expanding Medicare price negotiation should be a top priority, and 28% say rolling it back should be. It would get votes. It is a price control. It does not add a doctor or post a cash price.","source":"KFF Health Tracking Poll, published January 17, 2025.","c":3}],"cultural":[{"id":"c1","name":"The goal is a medical bill people can pay","y":86,"x":88,"summary":"The belief is that health policy succeeds when people can afford the bill.","source":"KFF Health Tracking Poll, April 14–19, 2026: 64% worry about affording care. West Health–Gallup, November 2025: 16% are satisfied with the national cost.","c":3},{"id":"c2","name":"Show the price before the visit","y":72,"x":82,"summary":"The belief is that a patient should see the price before the visit, the test, or the drug.","source":"KFF, January 2025: 61% say stronger price-transparency rules should be a top priority.","c":3},{"id":"c3","name":"The government should guarantee everyone's coverage","y":76,"x":16,"summary":"The belief is that the federal government is responsible for making sure everyone has coverage.","source":"West Health–Gallup, November 3–25, 2025: 64% say it is the federal government's responsibility to ensure all Americans have coverage.","c":3},{"id":"c4","name":"My own bill is fine. The system is not","y":34,"x":58,"summary":"The belief is that one's own doctor and one's own bill are acceptable, and the national system is the problem.","source":"West Health–Gallup, November 2025: 57% are satisfied with their own costs, 16% with the cost of care in the country.","c":3}]},{"id":"housing","name":"Housing","practical":[{"id":"allow","name":"Allow the homes. Don't subsidize the rent.","y":90,"x":90,"c":3,"summary":"This is the conservative housing line, and it is a majority of them. 72% of conservatives choose allowing more housing over government subsidies. Liberals are at 51% and moderates at 47% on the same choice. A Republican leads with permission to build, not with a check.","source":"AEI Housing Center, Zoning and Land Use Flexibility Survey, May 8–14, 2026. 5,245 adults."},{"id":"own","name":"Starter homes a family can own","y":84,"x":86,"c":3,"summary":"Ownership, not a public rental. 67% of conservatives want affordably priced starter homes people can own, against 54% of liberals and 52% of moderates. Overall, 57% want that and 4.6% want a smaller rental.","source":"AEI Housing Center, May 8–14, 2026."},{"id":"permit","name":"A deadline on the building permit","y":80,"x":84,"c":3,"summary":"The city says yes or no by a date. 86% support faster decisions on building permits. Delay is the tax. A subsidy does not repeal it.","source":"Pew Charitable Trusts, survey published November 30, 2023. AEI Housing Center, May 2026, found the same reforms still broadly supported."},{"id":"jobs","name":"Homes near jobs, not a rewrite of the old block","y":76,"x":78,"c":3,"summary":"Lead where your voters already are. 66% of conservatives support more homes near jobs and shops. Only 40% support infill in existing single-family neighborhoods, and 35% want more homes on those blocks. Overall, homes near jobs are at 74%.","source":"AEI Housing Center, May 8–14, 2026."},{"id":"gradual","name":"Small steps, not a new map of every street","y":70,"x":74,"c":3,"summary":"74% of conservatives want gradual changes. Liberals are at 41%. Do not open with a bill that rezones every existing block. Open with the permit clock, the lot near a job, and a starter home someone can own.","source":"AEI Housing Center, May 8–14, 2026."},{"id":"adu","name":"Let an owner add a backyard apartment","y":64,"x":70,"c":3,"summary":"The owner builds on the owner's land. 72% support a garage or backyard apartment. 73% support a basement or an attic. It is not a public housing project.","source":"Pew Charitable Trusts, 2023."},{"id":"parking","name":"The builder decides the parking","y":60,"x":68,"c":3,"summary":"No parking minimum. 62% supported that in 2023. A 2026 re-ask found 67%. A stall the city requires is a tax on the starter home.","source":"Pew Charitable Trusts, 2023. AEI Housing Center, May 2026."},{"id":"new-lots","name":"Smaller lots in a new neighborhood","y":54,"x":66,"c":3,"summary":"New streets, not the old block. 64% support smaller lots in new neighborhoods. Conservatives are at 52%. That is a narrow yes. Take it. Do not describe it as tearing up the street people already live on.","source":"AEI Housing Center, May 8–14, 2026."},{"id":"infill","name":"Rewrite the existing single-family block","y":36,"x":60,"c":3,"summary":"Letting an owner build is the right rule, and it is the wrong opening with conservative voters. 40% of conservatives support small-scale infill in existing single-family neighborhoods. 35% want more homes there. Liberals are at 75% and 73%. Pass the jobs-and-shops bill first.","source":"AEI Housing Center, May 8–14, 2026."},{"id":"subsidy","name":"Pay for housing instead of allowing it","y":32,"x":14,"c":3,"summary":"A subsidy leaves the ban in place and sends a check. Conservatives reject that trade, 72% to the alternative of allowing more homes. Do not bring a housing bill that is a spending bill.","source":"AEI Housing Center, May 8–14, 2026."}],"structural":[{"id":"fast-permit","name":"A deadline on housing permits","y":84,"x":82,"summary":"A housing permit gets a deadline. The city has to say yes or no by that date. 86% support requiring governments to decide building permits faster.","source":"Pew Charitable Trusts, survey published November 30, 2023. AEI Housing Center, May 2026, found the same reforms still broadly supported.","c":3},{"id":"near-jobs","name":"Allow apartments near jobs and transit","y":78,"x":78,"summary":"Allow apartment buildings near train stations, bus stations, job centers, stores, and offices. 81% support apartments near transit or jobs. A 2026 re-ask found 80%.","source":"Pew Charitable Trusts, 2023. AEI Housing Center, May 2026.","c":3},{"id":"adu","name":"Allow a backyard apartment","y":70,"x":72,"summary":"Let an owner add an apartment over a garage, in a backyard, or in a basement. 72% support a garage or backyard apartment. 73% support converting a basement or attic.","source":"Pew Charitable Trusts, 2023. AEI Housing Center, May 2026.","c":3},{"id":"parking","name":"Let the builder decide the parking","y":64,"x":64,"summary":"The builder decides how many off-street parking spaces a new home needs. The city does not set a minimum. 62% support that. A 2026 re-ask found 67%.","source":"Pew Charitable Trusts, 2023. AEI Housing Center, May 2026.","c":3},{"id":"townhouse","name":"Allow a townhouse on any lot","y":72,"x":56,"summary":"A residential lot can hold a townhouse or a small multifamily building, not only a detached house. 58% support it. It is a majority, and it is harder than homes near jobs because it touches the existing block.","source":"Pew Charitable Trusts, 2023.","c":3},{"id":"small-lots","name":"Smaller lots in new neighborhoods","y":58,"x":60,"summary":"Allow smaller lots on new streets. In 2023, a broader 'smaller lots, houses closer together' question was 49% and did not clear a majority. In May 2026, smaller lots in new neighborhoods were at 64% overall and 52% among conservatives. Do not sell it as a change to the existing block.","source":"AEI Housing Center, May 8–14, 2026. Pew Charitable Trusts, 2023, on the older wording.","c":3}],"cultural":[{"id":"h1","name":"New homes should be starter homes people can own","y":82,"x":88,"summary":"The belief is that if a neighborhood adds homes, they should be starter homes a family can own, not small rentals.","source":"AEI Housing Center, May 2026: 57% prefer affordably priced starter homes people can own. 4.6% prefer smaller rentals.","c":3},{"id":"h2","name":"My town needs more starter homes","y":74,"x":80,"summary":"The belief is that this community needs more affordably priced starter homes.","source":"AEI Housing Center, May 2026: 52% say more affordably priced starter homes are extremely or very important where they live. 81% say at least somewhat important.","c":3},{"id":"h3","name":"Houses should be bigger and farther apart","y":70,"x":26,"summary":"The belief is that the good neighborhood is bigger houses farther apart, even if the store is miles away.","source":"Pew Research Center, January 20–26, 2026: 55% prefer larger houses farther apart, even if stores are miles away. 44% prefer smaller houses closer together.","c":3},{"id":"h4","name":"A family should still be able to buy a house","y":78,"x":86,"summary":"The belief is that buying a house should still be possible for a family that does not own one.","source":"Gallup, reported April 28, 2026: 67% say it is a bad time to buy, and only 25% of non-owners expect to buy within five years.","c":3},{"id":"h5","name":"Don't change the houses already on my block","y":64,"x":20,"summary":"The belief is that new housing should not change the detached houses already on the block.","source":"Pew Charitable Trusts, 2023: apartments near jobs draw 81%, while townhouses on any residential lot draw 58% and smaller lots draw 49%. The block is where support thins.","c":3}]},{"id":"social-security","name":"Social Security","practical":[{"id":"worse","name":"Younger workers are getting the worse deal","y":78,"x":80,"c":3,"summary":"Say this. It is true, and a majority already says it. 58% say younger workers get a worse deal than today's retirees. 70% expect benefits to be cut. 62% say Congress has mostly broken its promises. The message is the deal. The bill is not a surprise cut for people already retired, and it is not a tax increase on the people still paying.","source":"Cato Institute, survey report published December 15, 2025."},{"id":"no-new-tax","name":"Don't raise the tax on people still working","y":46,"x":74,"c":3,"summary":"No new payroll tax. 53% of adults under 30 would protect younger workers from higher taxes even if that trims benefits for current retirees. 89% of adults 65 and older say the opposite. It will not pass as a national slogan this year. It is still the constraint. Do not trade it away for a short-term calm.","source":"Cato Institute, published December 15, 2025."},{"id":"age","name":"Lead with a retirement age of 70","y":28,"x":62,"c":3,"summary":"The arithmetic is real. The vote is not. 65% oppose raising the full-benefit age to 70. Democrats 67%, Republicans 64%. Do not open a campaign with it. The line that carries is that younger workers are already getting the worse deal.","source":"Cato Institute, published December 15, 2025."},{"id":"nocut","name":"Promise that no check is ever touched","y":86,"x":14,"c":3,"summary":"79% say benefits should not be reduced in any way. 77% oppose cuts even for future retirees. It would pass, and it locks in the worse deal for the worker who pays. Do not make it your bill. Do not pretend a cut for someone already retired is your bill either.","source":"Pew Research Center, 2024, reported May 20, 2025. Cato Institute, published December 15, 2025."},{"id":"welfare","name":"Turn Social Security into a program for the poor","y":30,"x":16,"c":3,"summary":"Paying only seniors the state decides need it is a welfare conversion, and 67% oppose it. Republicans and Democrats oppose it at similar rates. Leave the earned check. Fix who pays in. Do not means-test it into a poverty program.","source":"Cato Institute, published December 15, 2025."}],"structural":[{"id":"no-cut","name":"Don't cut the Social Security check","y":24,"x":78,"summary":"Do not cut benefits for current retirees or for future ones. 77% oppose cuts for both. 67% oppose cuts even if they fall only on future retirees. This would pass. It does not pay for the program.","source":"Cato Institute, published December 15, 2025. Pew Research Center, 2024: 79% say benefits should not be reduced.","c":3},{"id":"age-70","name":"Raise the retirement age to 70","y":62,"x":28,"summary":"Gradually raise the age for full Social Security benefits to 70. 65% oppose it. Democrats and Republicans oppose it at similar rates, 67% and 64%. It would change what the program costs. It is not a near-term vote.","source":"Cato Institute, published December 15, 2025.","c":3},{"id":"need-only","name":"Pay Social Security only to people who need it","y":40,"x":24,"summary":"Pay Social Security only to seniors who need the money, instead of to everyone who paid in. 67% oppose that. Republicans and Democrats oppose it at similar rates.","source":"Cato Institute, published December 15, 2025.","c":3}],"cultural":[{"id":"s1","name":"Don't reduce the Social Security check","y":82,"x":22,"summary":"The belief is that the Social Security check should not be function theory(item, lens) {

  const drives = item.y >= 50, aligned = item.x >= 50;
  let action;
  if (drives && aligned) action = "That belief lines up with lower costs, freer markets, and limited government, and it changes the outcome. Run public campaigns.";
  else if (drives && !aligned) action = "That belief is not on our side, and it still changes the outcome. Run persuasion and messaging campaigns.";
  else if (!drives && aligned) action = "People who hold this agree with you, but the belief itself does not move much. Appeal to a nearby belief that does.";
  else action = "People who hold this do not agree, and it does not change the outcome. Leave it alone.";
  return item.summary ? item.summary + " " + action : action;
}
function fold(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }

function spread(list) {
  const pts = list.map((p) => ({ id: p.id, x: p.x, y: p.y }));
  for (let pass = 0; pass < 4; pass++) {
    for (let i = 0; i < pts.length; i++) {
      for (let j = 0; j < i; j++) {
        const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
        const d = Math.hypot(dx, dy) || 0.2;
        if (d >= 8) continue;
        const push = (8 - d) / 2;
        pts[i].x += (dx / d) * push; pts[i].y += (dy / d) * push;
        pts[j].x -= (dx / d) * push; pts[j].y -= (dy / d) * push;

  const out = {};
  pts.forEach((p) => { out[p.id] = { x: Math.min(97, Math.max(3, p.x)), y: Math.min(97, Math.max(3, p.y)) }; });
  return out;
}

    if (!tokens.every((t) => hay.includes(t))) return null;
    let score = 0;
    const joined = tokens.join(" ");
