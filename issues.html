function theory(item, lens) {
  if (lens !== "cultural") return item.summary;
  const drives = item.y >= 50, aligned = item.x >= 50;
  let action;
  if (drives && aligned) action = "That belief lines up with lower costs, freer markets, and limited government, and it changes the outcome. Run public campaigns.";
  else if (drives && !aligned) action = "That belief is not on our side, and it still changes the outcome. Run persuasion and messaging campaigns.";
  else if (!drives && aligned) action = "People who hold this agree with you, but the belief itself does not move much. Appeal to a nearby belief that does.";
  else action = "People who hold this do not agree, and it does not change the outcome. Leave it alone.";
  return item.summary ? item.summary + " " + action : action;
}

function spread(list) {
  const pts = list.map((p) => ({ id: p.id, x: p.x, y: p.y }));
  for (let pass = 0; pass < 4; pass++) {
    for (let i = 0; i < pts.length; i++) {
      for (let j = 0; j < i; j++) {
        const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
        const d = Math.hypot(dx, dy) || 0.2;
        if (d >= 8) continue;
        const push = (8 - d) / 2;
        pts[i].x += (dx / d) * push; pts[i].y += (dy / d) * push;
        pts[j].x -= (dx / d) * push; pts[j].y -= (dy / d) * push;
      }
    }
  }
  const out = {};
  pts.forEach((p) => { out[p.id] = { x: Math.min(97, Math.max(3, p.x)), y: Math.min(97, Math.max(3, p.y)) }; });
  return out;
}

  const bar = document.getElementById("bar");
  bar.innerHTML = LENSES.map((l) => '<div class="h-full flex-1" style="background:' + l.color + (l.id === lens ? "" : "40") + '"></div>').join("");
  document.getElementById("caption").textContent = LENSES.find((l) => l.id === lens).caption;
  const list = items(areaBy(areaId), lens);
  if (!selected || !list.some((p) => p.id === selected)) selected = list[0] ? list[0].id : null;
  renderHits();
  paintMatrix();
  paintDetail();
}
function paintMatrix() {
  const area = areaBy(areaId);
  const list = items(area, lens);
  const cfg = MATRIX[lens];
  const pos = spread(list);
  const tokens = fold(query);
  const matchIds = tokens ? new Set(search().filter((r) => r.area.id === areaId && r.lens === lens).map((r) => r.item.id)) : null;
  const quads = cfg.quads.map((q) => '<div class="issue-quad pointer-events-none absolute z-0 hidden max-w-36 sm:block ' + q[2] + '"><div class="text-xs font-semibold" style="color:rgba(26,26,26,.55)">' + esc(q[0]) + '</div><div class="text-[11px] leading-snug" style="color:var(--muted)">' + esc(q[1]) + "</div></div>").join("");
  const dots = list.map((p) => {
    const place = pos[p.id];
    const on = p.id === selected;
    const matched = matchIds ? matchIds.has(p.id) : false;
    const dim = matchIds && matchIds.size > 0 && !matched && !on;
    const show = on || (matched && matchIds.size <= 4);
    const side = place.x > 58 ? "right:1.25rem" : "left:1.25rem";
    return '<button type="button" data-id="' + esc(p.id) + '" class="absolute flex -translate-x-1/2 translate-y-1/2 items-center" style="left:' + place.x + "%;bottom:" + place.y + "%;opacity:" + (dim ? ".25" : "1") + ";z-index:" + (on || matched ? 20 : 10) + '" aria-label="' + esc(p.name) + '"><span class="block h-3.5 w-3.5 rounded-full border-2" style="border-color:' + (on || matched ? "var(--ember)" : "var(--charcoal)") + ";background:" + (on ? "var(--ember)" : matched ? "rgba(196,92,38,.3)" : "#fff") + '"></span>' + (show ? '<span class="issue-chip absolute top-1/2 hidden max-w-52 -translate-y-1/2 rounded-md bg-white/95 px-1.5 py-0.5 text-xs leading-snug sm:block ' + (on ? "font-semibold" : "font-medium") + '" style="' + side + ";color:" + (on ? "var(--ember)" : "var(--charcoal)") + '">' + esc(p.name) + "</span>" : "") + "</button>";
  }).join("");
  document.getElementById("matrix").innerHTML =
    '<div class="flex items-stretch gap-2 sm:gap-3"><div class="flex w-16 shrink-0 flex-col text-right text-[10px] font-medium leading-tight sm:w-28 sm:text-xs" style="color:var(--muted)"><div class="flex flex-1 items-center justify-end">' + esc(cfg.yh) + '</div><div class="flex flex-1 items-center justify-end">' + esc(cfg.yl) + "</div></div>" +
    '<div class="relative min-h-96 w-full flex-1 overflow-hidden rounded-2xl border sm:min-h-[28rem]" style="border-color:var(--border);background:var(--surface)">' + quads +
    '<div class="pointer-events-none absolute inset-y-10 left-1/2 w-px" style="background:var(--border)"></div><div class="pointer-events-none absolute inset-x-10 top-1/2 h-px" style="background:var(--border)"></div>' +
    '<div class="absolute inset-10">' + dots + "</div></div></div>" +
    '<div class="mt-2 flex gap-2 sm:gap-3"><div class="w-16 shrink-0 sm:w-28"></div><div class="flex min-w-0 flex-1 justify-between gap-2 text-[10px] font-medium leading-tight sm:gap-3 sm:text-xs" style="color:var(--muted)"><span class="max-w-[46%]">' + esc(cfg.xl) + '</span><span class="max-w-[46%] text-right">' + esc(cfg.xh) + "</span></div></div>";
  document.querySelectorAll("#matrix button").forEach((b) => { b.onclick = () => { selected = b.dataset.id; paintMatrix(); paintDetail(); }; });
}
function paintDetail() {
  const area = areaBy(areaId);
  const item = items(area, lens).find((p) => p.id === selected);
  const cfg = MATRIX[lens];
  const el = document.getElementById("detail");
  if (!item) { el.innerHTML = ""; return; }
  const level = item.c || 1;
  const bars = level === 3 ? 5 : level === 2 ? 3 : 1;
  const label = level === 3 ? "High" : level === 2 ? "Medium" : "Low";
  const note = level === 3
    ? "National opinion, in the aggregate. Not a forecast of a particular vote."
    : level === 2
      ? "Not a national vote count. The closest evidence points this way."
      : "A sketch. Not yet replaced by opinion research.";
  el.innerHTML =
    '<h2 class="display text-2xl">' + esc(item.name) + "</h2>" +
    '<div class="mt-3 flex flex-wrap gap-2"><span class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs" style="background:var(--surface);color:var(--muted)">' + esc(cfg.yp) + ' <span class="font-semibold" style="color:var(--ember)">' + item.y + '%</span></span>' +
    '<span class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs" style="background:var(--surface);color:var(--muted)">' + esc(cfg.xp) + ' <span class="font-semibold" style="color:var(--ember)">' + item.x + '%</span></span></div>' +
    '<div class="mt-5"><div class="text-[11px] tracking-widest uppercase" style="color:var(--muted)">Theory</div><p class="mt-2 text-sm leading-relaxed" style="color:var(--muted)">' + esc(theory(item, lens)) + "</p>" + (item.source ? '<p class="mt-2 text-xs leading-relaxed" style="color:var(--muted)">' + esc(item.source) + "</p>" : "") + "</div>" +
    '<div class="mt-5 border-t pt-5" style="border-color:var(--border)"><div class="text-[11px] tracking-widest uppercase" style="color:var(--muted)">Confidence</div>' +
    '<div class="mt-2 flex items-center gap-3"><span class="inline-flex gap-1">' + [1,2,3,4,5].map((n) => '<span class="h-2 w-5 rounded-sm" style="background:' + (n <= bars ? "var(--ember)" : "var(--border)") + '"></span>').join("") + '</span><span class="text-sm font-medium">' + label + '</span></div>' +
    '<p class="mt-2 text-sm leading-relaxed" style="color:var(--muted)">' + note + '</p>' +
    '<a href="project.html" class="mt-4 inline-flex rounded-xl px-5 py-2.5 text-sm font-medium text-white" style="background:var(--charcoal)">Let\'s work together</a></div>';
}
function toggleMenu() {
  const m = document.getElementById("mobile-menu");
  const open = m.classList.toggle("open");
  document.getElementById("menu-icon").classList.toggle("hidden", open);
  document.getElementById("close-icon").classList.toggle("hidden", !open);
}
function closeMenu() {
  document.getElementById("mobile-menu").classList.remove("open");
  document.getElementById("menu-icon").classList.remove("hidden");
  document.getElementById("close-icon").classList.add("hidden");
}
sync();
</script>
</body>
</html>
