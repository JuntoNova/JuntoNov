<script>
const DATA = {"areas":[{"id":"ai","name":"Artificial Intelligence","practical":[{"id":"power","name":"They use the power","y":88,"x":86,"c":3,"summary":"A data center uses a city's electricity, and neighbors see it on the bill. Among voters already against data centers, 28% name electricity costs for local residents as the main concern. Noise and looks are 2%. 38% say lawmakers should make the companies pay for their own electricity. Democrats and Republicans land at 40% and 39%.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026. 1,004 registered voters."},{"id":"water","name":"They use the groundwater","y":80,"x":74,"c":3,"summary":"People think a data center drinks the local water. 48% believe one uses far more water than almost any other kind of facility. 26% are not sure. Among those who believe it, 45% heard it from local television or a local newspaper.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026. 1,004 registered voters."},{"id":"tax","name":"They pay a heavy property tax","y":72,"x":60,"c":3,"summary":"The case for letting one in is the tax check it writes the county. Voters will hear that. They will not fund the subsidy. Ending state tax breaks wins 56% of head-to-head matchups, on the argument that taxpayers should not pay the bills of the richest companies. Keeping the existing breaks finishes last, at 35%.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026. 1,004 registered voters."},{"id":"jobs","name":"They create local jobs","y":64,"x":70,"c":3,"summary":"The other case is the jobs. Told a project would hire locally, 33% move toward support and 18% move toward opposition. 38% say it makes no difference.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026. 1,004 registered voters."},{"id":"noise","name":"They make noise","y":28,"x":34,"c":3,"summary":"A data center is a loud industrial neighbor. It is a real complaint at the property line. It is not what decides the poll. Among voters unfavorable to data centers, 2% name noise or appearance as the main concern. Power and water do.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026. 1,004 registered voters."}],"structural":[{"id":"no-blank-check","name":"Don't hand AI to a regulator by default","y":68,"x":48,"summary":"Do not pass a licensing regime for AI on the assumption that the public wants a regulator in charge. Trust in the government to regulate AI is split, 44% to 47%. A license is not a majority demand. It is also not a rejection.","source":"Pew Research Center, March 2025.","c":3}],"cultural":[{"id":"jobs-gone","name":"AI will take the jobs","y":86,"x":22,"c":3,"summary":"The belief is that AI will put people out of work.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026: job loss is the leading concern about AI, at 26%. A claim that AI could wipe out half of entry-level white-collar jobs drew 70% more negative. 34% name protecting workers as a top priority."},{"id":"kill","name":"AI will kill people","y":76,"x":16,"c":2,"summary":"The belief is that AI will hurt people, and someone has to answer for it.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026: 48% name holding AI companies legally responsible for harms as a top priority, the highest item on the list. The survey did not ask the words 'AI will kill people.'"},{"id":"privacy","name":"AI will end privacy","y":70,"x":28,"c":3,"summary":"The belief is that AI will watch people and wipe out what used to be private.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026: 69% are concerned about AI surveillance in public spaces, including 66% of Republicans. 15% think a data center monitors citizens for the government."},{"id":"control","name":"AI will control people","y":60,"x":14,"c":2,"summary":"The belief is that the machine ends up in charge, not the person.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026: the line 'AI bots will be more human than humans' drew a more negative reaction from 67%. 28% believe advanced AI carries out cyberattacks on its own."},{"id":"cure","name":"AI will cure disease","y":36,"x":78,"c":3,"summary":"The belief is that AI will cure disease. It is the good outcome people can name. Few can name one.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026: 41% say nothing about AI excites them. Curing diseases is the leading positive, at 17%."},{"id":"rich","name":"AI will make people rich","y":28,"x":68,"c":2,"summary":"The belief is that AI will make ordinary people rich. What voters actually say is that it takes the jobs and enriches the companies.","source":"Joseph Rainey Center for Public Policy, September 10–14, 2026: no question asks whether AI will make people rich. Job loss leads the worries at 26%. Defending the tax breaks for the companies finishes last, at 35%."}]},{"id":"education","name":"Education","practical":[{"id":"would-use","name":"Count who would use a family account","y":84,"x":72,"summary":"Ask parents whether they would actually use an education account if one were offered, and publish that. 65% of school parents say they would enroll their child. 13% say no. 22% are unsure.","source":"EdChoice, 2026 Schooling in America Survey.","c":3},{"id":"esa-aware","name":"Explain the account, then ask","y":76,"x":48,"summary":"Describe an education savings account in plain language, then ask again. Support before the description is the awareness number. Without a description, 54% of Americans support the accounts. With one, support rises to 78%. Parents move from 64% to 84%.","source":"EdChoice, 2026 Schooling in America Survey.","c":3},{"id":"direction","name":"Ask if school is on track","y":28,"x":70,"summary":"Ask parents whether K–12 is headed the right way, and treat that as a satisfaction number, not as proof a family can leave. 41% of school parents say it is on the right track.","source":"EdChoice, 2025 Schooling in America Survey, March 28–April 7, 2025. 2,455 school parents.","c":3},{"id":"universal-pref","name":"Ask if every family gets the account","y":80,"x":66,"summary":"Ask whether the account should be for every student or only for families who meet a needs test, and publish both numbers. 77% support an account for every student. 65% support one limited by income or special needs. Among account supporters in a separate poll, 70% want it universal.","source":"EdChoice, 2026 Schooling in America Survey. yes. every kid. foundation / YouGov, November 19–24, 2025.","c":3}],"structural":[{"id":"esa","name":"Give every family an education account","y":88,"x":74,"summary":"Every child gets an account the family spends on school, a tutor, or another option. It is not limited to low-income families. With a description, 78% of Americans and 84% of school parents support the accounts. 77% support making one universal. Asked differently, 63% support them and 70% of those supporters want every family included.","source":"EdChoice, 2026 Schooling in America Survey. yes. every kid. foundation / YouGov, November 19–24, 2025.","c":3},{"id":"tax-credit","name":"A tax credit a family can spend on school","y":82,"x":68,"summary":"A family gets a tax credit and uses it to buy education, instead of waiting for the state to approve each purchase. 72% of Americans and 82% of school parents support tax-credit scholarships. A separate poll finds 58% support for education tax credits. The size of the majority depends on the wording.","source":"EdChoice, 2026 Schooling in America Survey. yes. every kid. foundation / YouGov, November 19–24, 2025.","c":3},{"id":"open-enroll","name":"Let a child attend any public school in the state","y":64,"x":64,"summary":"A student can attend any public school in the state. The address no longer assigns the school. 64% support that. A year earlier the same question was 68%, including 75% of K–12 parents. It does not yet hand the family the dollar.","source":"yes. every kid. foundation / YouGov, November 19–24, 2025, and December 2024.","c":3},{"id":"charters","name":"Open more charter schools","y":46,"x":66,"summary":"Open more charter schools. 68% of Americans and 75% of school parents support them. A charter is still a public school under a public rulebook. It does not give the family the dollar.","source":"EdChoice, 2026 Schooling in America Survey.","c":3},{"id":"vouchers","name":"A voucher for a private-school seat","y":58,"x":66,"summary":"A voucher pays for a seat at a private school. 69% of Americans and 79% of school parents support vouchers. In 2025, Republican support was 77% and Democratic support was 57%. A voucher is one seat. An account can buy more than that.","source":"EdChoice, 2026 Schooling in America Survey. EdChoice, 2025 Schooling in America, on the party split.","c":3},{"id":"needs","name":"Limit the account to low-income families","y":34,"x":62,"summary":"Only low-income families, or students with special needs, get the account. Everyone else stays assigned. That version is less popular than a universal account: 65% versus 77% in 2026, and 56% versus about three in four in 2025. Among account supporters, only 20% want it limited to low-income families.","source":"EdChoice, 2025 and 2026 Schooling in America Surveys. yes. every kid. foundation / YouGov, December 2024.","c":3}],"cultural":[{"id":"ed1","name":"A family should design a child's education","y":84,"x":86,"summary":"The belief is that a family, not a district, should fit school to the child.","source":"yes. every kid. foundation / YouGov, November 19–24, 2025: 72% say families should be able to customize K–12 to the child, a great deal or some.","c":3},{"id":"ed2","name":"Schools should answer to parents","y":78,"x":84,"summary":"The belief is that a school has to answer to the parent, not only to the system.","source":"yes. every kid. foundation / YouGov, November 19–24, 2025: 76% say K–12 schools need to be more accountable to parents.","c":3},{"id":"ed3","name":"A school is accountable when a child can leave with the money","y":80,"x":88,"summary":"The belief is that accountability means the child can leave and take the public dollars with them.","source":"yes. every kid. foundation / YouGov, November 19–24, 2025: 61% say schools are more accountable when a child can leave and take the funding.","c":3},{"id":"ed4","name":"Every family should get the account, not only poor families","y":74,"x":82,"summary":"The belief is that an education account should be for every family, not a program for the poor.","source":"EdChoice, 2026 Schooling in America: 77% support a universal account, 65% a needs-based one. yes. every kid. foundation / YouGov, December 2024: 71% of account supporters want it universal, 20% want it limited to low-income families.","c":3},{"id":"ed5","name":"A child's address should pick the school","y":68,"x":18,"summary":"The belief is that where a family lives should decide which public school the child attends.","source":"yes. every kid. foundation / YouGov, November 19–24, 2025: 64% support the opposite, access to any public school in the state. The assigned school is still the rule most children live under.","c":3},{"id":"ed6","name":"Only some families should be trusted with the money","y":36,"x":22,"summary":"The belief is that only low-income families, or families the state approves, should control the education dollar.","source":"EdChoice, 2025 Schooling in America: a universal account beats a needs-based one, about three in four versus 56%. The narrower value is the minority position.","c":3}]},{"id":"energy","name":"Energy","practical":[{"id":"bill","name":"Publish the household bill","y":86,"x":90,"summary":"Publish what a household actually pays for power, and whether it went up. That is the number people already use. Three-quarters of adults say home energy costs have gone up, and 42% say they have gone up a lot. A separate voter survey finds 79% say household electricity costs rose over two years, and 83% are concerned.","source":"Pew Research Center, March 16–22, 2026. Inclusive Abundance / Blue Rose Research, May 13–23, 2026.","c":3},{"id":"utility-margin","name":"Show the utility's profit","y":78,"x":74,"summary":"Show the utility's profit as its own line, so a household can see how much of the bill is margin rather than power. Asked why the bill rose, 64% say a major reason is utility companies wanting to make more money.","source":"Pew Research Center, March 16–22, 2026, among adults who say home energy costs have risen.","c":3},{"id":"data-load","name":"Show the data-center share","y":74,"x":66,"summary":"Show the data-center share: how much of new electricity demand, and of the household bill, comes from data centers. 43% say data centers using more energy are a major reason bills rose. In a separate survey, 58% say data centers are very or somewhat responsible for higher household electricity prices.","source":"Pew Research Center, March 16–22, 2026. Morning Consult, November 21–23, 2025.","c":3},{"id":"grid-cost","name":"Price transparency","y":70,"x":58,"summary":"Break the electricity bill into generation, transmission, and distribution, so a household can see what is driving the cost. 40% already say the cost of updating or expanding the grid is a major reason bills rose. Another 30% call it a minor reason.","source":"Pew Research Center, March 16–22, 2026.","c":3},{"id":"source-cost","name":"Compare the cost of each source","y":68,"x":60,"summary":"Publish what wind, solar, gas, coal, and nuclear cost the customer, side by side. Republicans are more likely to say wind (44%) and solar (43%) cost consumers more than other sources. Democrats are more likely to say each costs less (48%).","source":"Pew Research Center, March 16–22, 2026.","c":3},{"id":"home-use","name":"Separate home use on the bill","y":24,"x":64,"summary":"Show home use as its own line, separate from the utility, the grid, and new demand, so people can see whether they are the reason the bill rose. Only 13% say using more energy at home is a major reason. 46% say it is not a reason.","source":"Pew Research Center, March 16–22, 2026.","c":3}],"structural":[{"id":"deadlines","name":"A deadline on every energy permit","y":82,"x":64,"summary":"A permit has a date. If the agency misses it, the project moves. 60% of likely 2026 voters support making energy infrastructure faster and easier to build, including 51% of Harris voters and 71% of Trump voters.","source":"Landscape deck, slide 3. Inclusive Abundance / Blue Rose Research, May 13–23, 2026.","c":3},{"id":"nepa","name":"Put an end date on environmental review","y":76,"x":48,"summary":"State environmental review gets an end date, instead of staying open until someone finds a reason to stop the project. Voters support faster energy permitting at 60%. That question is about speed, not a named repeal of a state environmental law.","source":"Landscape deck, slide 3. Nearest poll: Inclusive Abundance / Blue Rose Research, May 13–23, 2026.","c":2},{"id":"discretion","name":"Replace the hearing with a checklist","y":72,"x":46,"summary":"If a project meets a written checklist, it is approved. A hearing cannot kill it afterward. Voters support making energy projects easier to build. No poll in this set asks about discretionary review by that name.","source":"Landscape deck, slide 3. Nearest poll: Inclusive Abundance / Blue Rose Research, May 2026.","c":2},{"id":"rps","name":"Repeal the renewable quota","y":70,"x":40,"summary":"Repeal the law that says a set share of power must come from a listed set of renewable sources. No national poll in this set asks that question directly. The nearest fight, repealing renewable tax credits, is a split.","source":"Landscape deck, slide 3. Morning Consult, June 6–8, 2025, on tax credits, not portfolio standards.","c":2},{"id":"rofr","name":"Make the utility bid for the line","y":8,"x":80,"summary":"The utility no longer gets the transmission contract automatically. It has to bid, like anyone else. The landscape deck scores this 5–10% transformative and 80% popular. It is a bidding rule, not a rewrite of the system.","source":"Landscape deck, slide 3.","c":2},{"id":"nuclear-new","name":"Allow nuclear plants on new sites","y":80,"x":34,"summary":"Allow a nuclear plant on a site that does not already have one. 59% favor more nuclear plants, and 61% favor nuclear energy. 53% still oppose a plant in their area. A new site is the hard vote.","source":"Landscape deck, slide 3. Pew Research Center, April–May 2025. Gallup, March 2025 and March 2–18, 2026.","c":3},{"id":"nuclear-existing","name":"Renew licenses at existing nuclear plants","y":74,"x":74,"summary":"Renew the license, and add capacity, at plants that are already operating and still meet federal safety rules. 87% support renewing that kind of license. 64% say build more plants.","source":"Landscape deck, slide 3. Bisconti Research, 2025 National Nuclear Energy Public Opinion Survey.","c":3},{"id":"smr","name":"Let states license small reactors","y":80,"x":36,"summary":"Create a state license for small modular reactors, a new kind of plant, instead of running them through the old federal category. 59% favor more nuclear. This license class has not been polled on its own.","source":"Landscape deck, slide 3. Pew Research Center, April–May 2025, on more nuclear plants, not this license class.","c":2},{"id":"btm","name":"Let customers connect their own power","y":68,"x":52,"summary":"Power a customer adds on their own side of the meter should not wait in the queue built for big power plants. 60% want it to be easier to build energy infrastructure. That is the nearest number, not a behind-the-meter question.","source":"Landscape deck, slide 3. Inclusive Abundance / Blue Rose Research, May 2026.","c":2},{"id":"ppa","name":"Let customers buy power directly","y":58,"x":42,"summary":"A customer, a campus, or a town can sign a contract and buy power directly, instead of only through the utility. Not separately polled.","source":"Landscape deck, slide 3.","c":1},{"id":"redundancy","name":"Allow neighborhood backup power","y":64,"x":40,"summary":"Let a neighborhood add backup power, such as storage where the power is used, without a full utility case and without waiting on a new line. The landscape deck calls this local redundancy. Not separately polled.","source":"Landscape deck, slide 3.","c":1},{"id":"sandbox","name":"A trial waiver for a new power model","y":48,"x":44,"summary":"Give a new power model a time-limited waiver so it can operate and be judged, instead of waiting for a permanent rule. Not separately polled.","source":"Landscape deck, slide 3.","c":1},{"id":"threshold","name":"Skip full review for small projects","y":60,"x":48,"summary":"Below a set size, a project skips the full regulatory case. Above it, the ordinary rules apply. Not separately polled.","source":"Landscape deck, slide 3.","c":1},{"id":"backyard","name":"Let households install their own solar","y":55,"x":62,"summary":"A household can put solar on its own roof or yard without a utility veto. 77% favor more solar power. That is support for the source, not a vote on a backyard ordinance.","source":"Landscape deck, slide 3. Pew Research Center, June 2025, on expanding solar power.","c":2}],"cultural":[{"id":"e1","name":"Keep the power bill down","y":86,"x":90,"summary":"The belief is that energy policy should be judged by the household bill, not by a carbon target.","source":"Pew Research Center, December 9, 2024: 59% say keeping consumer costs low is very important in climate policy. It is the top factor for Republicans, at 67%.","c":3},{"id":"e2","name":"Use whatever source keeps power cheap","y":82,"x":84,"summary":"The belief is that the grid should use wind, solar, gas, and nuclear if that is what keeps power affordable.","source":"Inclusive Abundance / Blue Rose Research, May 13–23, 2026: 68% support an all-of-the-above mix, including wind, solar, natural gas, and nuclear. 44% had never heard the phrase.","c":3},{"id":"e3","name":"Build more nuclear plants","y":74,"x":76,"summary":"The belief is that the country should build more nuclear plants.","source":"Pew Research Center, April–May 2025: 59% favor more nuclear plants, up from 43% in 2020. Gallup, March 2025: 61% favor the use of nuclear energy.","c":3},{"id":"e4","name":"Put wind and solar ahead of oil, gas, and coal","y":76,"x":28,"summary":"The belief is that wind and solar should come before oil, gas, and coal, even when that costs more.","source":"Pew Research Center, March 16–22, 2026: 57% say prioritize renewables, down from 79% in 2020. Among Republicans the fossil-fuel priority is now 71%, up from the reverse in 2020.","c":3},{"id":"e5","name":"Get to carbon neutral by 2050","y":70,"x":22,"summary":"The belief is that the goal of energy policy is carbon neutrality by 2050.","source":"Pew Research Center, May 13–19, 2024: 63% support the U.S. taking steps to become carbon neutral by 2050. Fewer call getting to net zero very important than call keeping costs low very important.","c":3},{"id":"e6","name":"No new plant in my neighborhood","y":68,"x":16,"summary":"The belief is that a plant the country says it wants still should not be built near me.","source":"Gallup, March 2–18, 2026: 53% oppose a nuclear plant in their area, even as national support for more emphasis on nuclear is the highest Gallup has measured, at 46%.","c":3},{"id":"e7","name":"I should cut my own carbon use","y":22,"x":20,"summary":"The belief is that each person has a duty to shrink their own carbon use.","source":"Pew Research Center, May 13–19, 2024: 25% say it is extremely or very important to them personally to limit their own carbon footprint.","c":3},{"id":"e8","name":"The government should push wind and solar","y":64,"x":34,"summary":"The belief is that Washington should encourage wind and solar production.","source":"Pew Research Center function theory(item, lens) {
  if (lens !== "cultural") return item.summary;
  const drives = item.y >= 50, aligned = item.x >= 50;
  let action;
  if (drives && aligned) action = "That belief lines up with lower costs, freer markets, and limited government, and it changes the outcome. Run public campaigns.";
  else if (drives && !aligned) action = "That belief is not on our side, and it still changes the outcome. Run persuasion and messaging campaigns.";
  else if (!drives && aligned) action = "People who hold this agree with you, but the belief itself does not move much. Appeal to a nearby belief that does.";
  else action = "People who hold this do not agree, and it does not change the outcome. Leave it alone.";
  return item.summary ? item.summary + " " + action : action;
}
function fold(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
function areaBy(id) { return DATA.areas.find((a) => a.id === id) || DATA.areas[0]; }

function spread(list) {
  const pts = list.map((p) => ({ id: p.id, x: p.x, y: p.y }));
  for (let pass = 0; pass < 4; pass++) {
    for (let i = 0; i < pts.length; i++) {
      for (let j = 0; j < i; j++) {
        const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
        const d = Math.hypot(dx, dy) || 0.2;
        if (d >= 8) continue;
        const push = (8 - d) / 2;
        pts[i].x += (dx / d) * push; pts[i].y += (dy / d) * push;
        pts[j].x -= (dx / d) * push; pts[j].y -= (dy / d) * push;
      }
    }
  }
  const out = {};
  pts.forEach((p) => { out[p.id] = { x: Math.min(97, Math.max(3, p.x)), y: Math.min(97, Math.max(3, p.y)) }; });
  return out;
}

function catalog() {

function search() {

  return CATALOG.map((row) => {
    const name = fold(row.item.name);
    const hay = name + " " + fold(row.item.summary) + " " + fold(row.area.name);

    let score = 0;
    const joined = tokens.join(" ");
    if (name.includes(joined)) score += 80;
    if (name.startsWith(joined)) score += 40;
    if (row.area.id === areaId) score += 25;

  hitsEl.innerHTML = hits.map((row, i) => {
    const label = LENSES.find((l) => l.id === row.lens).label + (row.area.id !== areaId ? " · " + row.area.name : "");
    return '<li><button type="button" data-i="' + i + '" class="flex w-full flex-col items-start gap-0.5 px-3 py-2.5 text-left ' + (i === activeHit ? "bg-slate-50" : "") + '"><span class="text-sm font-medium">' + esc(row.item.name) + '</span><span class="text-[11px] tracking-wide" style="color:var(--muted)">' + esc(label) + "</span></button></li>";
  }).join("");
  hitsEl.querySelectorAll("button").forEach((b) => {
    b.onmouseenter = () => { activeHit = Number(b.dataset.i); };
    b.onclick = () => pick(hits[Number(b.dataset.i)]);
  });
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => c === "&" ? "\u0026amp;" : c === "<" ? "\u0026lt;" : c === ">" ? "\u0026gt;" : "\u0026quot;");
}
function sync() {
  const url = new URL(location.href);
  url.searchParams.set("area", areaId);
  url.searchParams.set("lens", lens);
  history.replaceState(null, "", url);
  areaEl.value = areaId;
  document.querySelectorAll("#lenses button").forEach((b) => {
    const on = b.dataset.lens === lens;
    b.style.background = on ? "#1A1A1A" : "#fff";
    b.style.color = on ? "#fff" : "#64748B";
    b.style.borderColor = on ? "#1A1A1A" : "#E2E8F0";
  });
  const bar = document.getElementById("bar");
  bar.innerHTML = LENSES.map((l) => '<div class="h-full flex-1" style="background:' + l.color + (l.id === lens ? "" : "40") + '"></div>').join("");
  document.getElementById("caption").textContent = LENSES.find((l) => l.id === lens).caption;
  const list = items(areaBy(areaId), lens);
  if (!selected || !list.some((p) => p.id === selected)) selected = list[0] ? list[0].id : null;
  renderHits();
  paintMatrix();
  paintDetail();
}
function paintMatrix() {
  const area = areaBy(areaId);
  const list = items(area, lens);
  const cfg = MATRIX[lens];
  const pos = spread(list);
  const tokens = fold(query);
  const matchIds = tokens ? new Set(search().filter((r) => r.area.id === areaId && r.lens === lens).map((r) => r.item.id)) : null;
  const quads = cfg.quads.map((q) => '<div class="pointer-events-none absolute z-0 max-w-36 ' + q[2] + '"><div class="text-xs font-semibold" style="color:rgba(26,26,26,.55)">' + esc(q[0]) + '</div><div class="text-[11px] leading-snug" style="color:var(--muted)">' + esc(q[1]) + "</div></div>").join("");
  const dots = list.map((p) => {
    const place = pos[p.id];
    const on = p.id === selected;
    const matched = matchIds ? matchIds.has(p.id) : false;
    const dim = matchIds && matchIds.size > 0 && !matched && !on;
    const show = on || (matched && matchIds.size <= 4);
    const side = place.x > 58 ? "right:1.25rem" : "left:1.25rem";
    return '<button type="button" data-id="' + esc(p.id) + '" class="absolute flex -translate-x-1/2 translate-y-1/2 items-center" style="left:' + place.x + "%;bottom:" + place.y + "%;opacity:" + (dim ? ".25" : "1") + ";z-index:" + (on || matched ? 20 : 10) + '" aria-label="' + esc(p.name) + '"><span class="block h-3.5 w-3.5 rounded-full border-2" style="border-color:' + (on || matched ? "var(--ember)" : "var(--charcoal)") + ";background:" + (on ? "var(--ember)" : matched ? "rgba(196,92,38,.3)" : "#fff") + '"></span>' + (show ? '<span class="absolute top-1/2 max-w-52 -translate-y-1/2 rounded-md bg-white/95 px-1.5 py-0.5 text-xs leading-snug ' + (on ? "font-semibold" : "font-medium") + '" style="' + side + ";color:" + (on ? "var(--ember)" : "var(--charcoal)") + '">' + esc(p.name) + "</span>" : "") + "</button>";
  }).join("");
  document.getElementById("matrix").innerHTML =
    '<div class="flex items-stretch gap-2 sm:gap-3"><div class="flex w-24 shrink-0 flex-col text-right text-[11px] font-medium leading-tight sm:w-28 sm:text-xs" style="color:var(--muted)"><div class="flex flex-1 items-center justify-end">' + esc(cfg.yh) + '</div><div class="flex flex-1 items-center justify-end">' + esc(cfg.yl) + "</div></div>" +
    '<div class="relative min-h-80 w-full flex-1 overflow-hidden rounded-2xl border sm:min-h-[28rem]" style="border-color:var(--border);background:var(--surface)">' + quads +
    '<div class="pointer-events-none absolute inset-y-10 left-1/2 w-px" style="background:var(--border)"></div><div class="pointer-events-none absolute inset-x-10 top-1/2 h-px" style="background:var(--border)"></div>' +
    '<div class="absolute inset-10">' + dots + "</div></div></div>" +
    '<div class="mt-2 flex gap-2 sm:gap-3"><div class="w-24 shrink-0 sm:w-28"></div><div class="flex min-w-0 flex-1 justify-between gap-3 text-[11px] font-medium sm:text-xs" style="color:var(--muted)"><span>' + esc(cfg.xl) + "</span><span>" + esc(cfg.xh) + "</span></div></div>";
  document.querySelectorAll("#matrix button").forEach((b) => { b.onclick = () => { selected = b.dataset.id; paintMatrix(); paintDetail(); }; });
}
function paintDetail() {
  const area = areaBy(areaId);
  const item = items(area, lens).find((p) => p.id === selected);
  const cfg = MATRIX[lens];
  const el = document.getElementById("detail");
  if (!item) { el.innerHTML = ""; return; }
  const level = item.c || 1;
  const bars = level === 3 ? 5 : level === 2 ? 3 : 1;
  const label = level === 3 ? "High" : level === 2 ? "Medium" : "Low";
  const note = level === 3
    ? "National opinion, in the aggregate. Not a forecast of a particular vote."
    : level === 2
      ? "Direction from conversations. Not a national count."
      : "A sketch. Not yet replaced by opinion research.";
  el.innerHTML =
    '<h2 class="display text-2xl">' + esc(item.name) + "</h2>" +
    '<div class="mt-3 flex flex-wrap gap-2"><span class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs" style="background:var(--surface);color:var(--muted)">' + esc(cfg.yp) + ' <span class="font-semibold" style="color:var(--ember)">' + item.y + '%</span></span>' +
    '<span class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs" style="background:var(--surface);color:var(--muted)">' + esc(cfg.xp) + ' <span class="font-semibold" style="color:var(--ember)">' + item.x + '%</span></span></div>' +
    '<div class="mt-5"><div class="text-[11px] tracking-widest uppercase" style="color:var(--muted)">Theory</div><p class="mt-2 text-sm leading-relaxed" style="color:var(--muted)">' + esc(theory(item, lens)) + "</p>" + (item.source ? '<p class="mt-2 text-xs leading-relaxed" style="color:var(--muted)">' + esc(item.source) + "</p>" : "") + "</div>" +
    '<div class="mt-5 border-t pt-5" style="border-color:var(--border)"><div class="text-[11px] tracking-widest uppercase" style="color:var(--muted)">Confidence</div>' +
    '<div class="mt-2 flex items-center gap-3"><span class="inline-flex gap-1">' + [1,2,3,4,5].map((n) => '<span class="h-2 w-5 rounded-sm" style="background:' + (n <= bars ? "var(--ember)" : "var(--border)") + '"></span>').join("") + '</span><span class="text-sm font-medium">' + label + '</span></div>' +
    '<p class="mt-2 text-sm leading-relaxed" style="color:var(--muted)">' + note + '</p>' +
    '<a href="project.html" class="mt-4 inline-flex rounded-xl px-5 py-2.5 text-sm font-medium text-white" style="background:var(--charcoal)">Let\'s work together</a></div>';
}
function toggleMenu() {
  const m = document.getElementById("mobile-menu");
  const open = m.classList.toggle("open");
  document.getElementById("menu-icon").classList.toggle("hidden", open);
  document.getElementById("close-icon").classList.toggle("hidden", !open);
}
function closeMenu() {
  document.getElementById("mobile-menu").classList.remove("open");
  document.getElementById("menu-icon").classList.remove("hidden");
  document.getElementById("close-icon").classList.add("hidden");
}
sync();
</script>
</body>
