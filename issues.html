<script>
(function(){
var b=document.getElementById('jn-menu-btn'),m=document.getElementById('jn-menu');
if(!b||!m)return;
function set(o,f){b.setAttribute('aria-expanded',o?'true':'false');b.setAttribute('aria-label',o?'Close menu':'Open menu');m.hidden=!o;if(!o&&f)b.focus()}
function open(){return b.getAttribute('aria-expanded')==='true'}
b.addEventListener('click',function(){set(!open(),false)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&open())set(false,true)});
document.addEventListener('click',function(e){if(open()&&!m.contains(e.target)&&!b.contains(e.target))set(false,false)});
m.addEventListener('click',function(e){if(e.target.closest('a'))set(false,true)});
m.addEventListener('focusout',function(e){if(open()&&e.relatedTarget&&!m.contains(e.relatedTarget)&&e.relatedTarget!==b)set(false,false)});
function mark(){
  var p=location.pathname.replace(/\/$/,'')||'/',h=location.hash||(p==='/'?'#about':'');
  m.querySelectorAll('a').forEach(function(a){
    var u=new URL(a.getAttribute('href'),location.origin),ap=u.pathname.replace(/\/$/,'')||'/',on=ap===p&&(ap!=='/'||u.hash===h);
    if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
  });
}
mark();window.addEventListener('hashchange',mark);
})();
</script>
